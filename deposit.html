<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TASK - Deposit Funds</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 440px; margin: 0 auto; padding-bottom: 30px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; font-weight: 600; letter-spacing: 0.5px; }
        .form-select, .form-input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
        .form-select option { background: #0f172a; color: #f8fafc; }

        .payment-info-box { background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--accent-color); padding: 14px; border-radius: 12px; margin-bottom: 14px; display: none; }
        .target-number-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .target-num { font-size: 1.05rem; font-weight: 800; color: var(--accent-color); word-break: break-all; }
        .btn-copy-num { background: var(--accent-color); color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .rate-notice { font-size: 0.75rem; color: #34d399; margin-top: 4px; font-weight: 600; }
        
        .btn-submit { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #0f172a; border: none; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: transform 0.1s; }
        .btn-submit:active { transform: scale(0.98); }

        /* History Section Styling */
        .section-title { font-size: 0.95rem; font-weight: 800; color: var(--accent-color); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
        .history-item { background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 0.83rem; }
        .history-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .history-row:last-child { margin-bottom: 0; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .badge.pending { background: rgba(245, 158, 11, 0.2); color: var(--warning-color); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.approved { background: rgba(34, 197, 94, 0.2); color: var(--success-color); border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge.rejected { background: rgba(239, 68, 68, 0.2); color: var(--danger-color); border: 1px solid rgba(239, 68, 68, 0.3); }
        .no-history { text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 15px; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="site-header"></div>

    <div class="app-container">
        <!-- Deposit Form Card -->
        <div class="glass-card">
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-color); margin-bottom: 16px; text-align: center;">DEPOSIT FUNDS</div>

            <form id="deposit-form">
                <div class="form-group">
                    <label class="form-label">Select Payment Method</label>
                    <select id="deposit-method" class="form-select" required>
                        <option value="">-- Choose Method --</option>
                        <option value="bKash">bKash (Manual)</option>
                        <option value="Nagad">Nagad (Manual)</option>
                        <option value="Rocket">Rocket (Manual)</option>
                        <option value="Upay">Upay (Manual)</option>
                        <option value="USDT-TRC20">USDT (TRC20 Network)</option>
                        <option value="USDT-BEP20">USDT (BEP20 Network)</option>
                    </select>
                </div>

                <div id="payment-instruction-box" class="payment-info-box">
                    <div class="form-label" id="instruction-title">Send Money to this Number:</div>
                    <div class="target-number-row">
                        <span id="target-account-number" class="target-num">---</span>
                        <button type="button" id="copy-target-btn" class="btn-copy-num">Copy</button>
                    </div>
                    <div id="rate-info-text" class="rate-notice">Rate: 1 USD = 140 BDT</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Amount You Want to Get (USD)</label>
                    <input type="number" step="0.01" min="1" id="get-amount" class="form-input" placeholder="e.g. 5.00" required>
                </div>

                <div class="form-group" id="send-amount-group">
                    <label class="form-label" id="send-label">You Need to Send (BDT)</label>
                    <input type="text" id="send-amount-display" class="form-input" readonly style="background: rgba(0,0,0,0.6); font-weight: 700; color: #38bdf8;">
                </div>

                <div class="form-group">
                    <label class="form-label" id="txn-label">Transaction ID (TrxID / Hash)</label>
                    <input type="text" id="transaction-id" class="form-input" placeholder="Enter your transaction reference ID" required>
                </div>

                <button type="submit" class="btn-submit">Submit Deposit Request</button>
            </form>
        </div>

        <!-- Deposit History Card -->
        <div class="glass-card">
            <div class="section-title">
                <span>Deposit History</span>
                <span style="font-size: 0.7rem; color: var(--text-muted); font-weight: normal;">Recent Transactions</span>
            </div>
            <div id="deposit-history-container">
                <div class="no-history">Loading deposit history...</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script>
        // হেডার ও ফুটার লোড করার সেফ ট্রাই
        fetch('/includes/header.html').then(res => res.text()).then(data => {
            const h = document.getElementById('site-header');
            if(h) h.innerHTML = data;
        }).catch(e => {});
        
        fetch('/includes/footer.html').then(res => res.text()).then(data => {
            const f = document.getElementById('site-footer');
            if(f) f.innerHTML = data;
        }).catch(e => {});

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ইউজারের সঠিক টেলিগ্রাম আইডি শনাক্তকরণ (টেস্টিংয়ের জন্য ফলব্যাক আইডি রাখা হয়েছে)
        const tgUser = tg.initDataUnsafe?.user;
        const currentTelegramId = tgUser ? tgUser.id : 8191704137; 

        let activeMethodsData = {};

        async function loadPaymentMethods() {
            try {
                const res = await fetch('/api/get-deposit-methods');
                const data = await res.json();
                if (data.success) {
                    activeMethodsData = data.methods || {};
                }
            } catch (e) {
                console.error("Failed to load methods", e);
            }
        }
        loadPaymentMethods();

        // ডিপোজিট হিস্টরি ফেচ করার ফাংশন
        async function loadDepositHistory() {
            const historyContainer = document.getElementById('deposit-history-container');
            historyContainer.innerHTML = `<div class="no-history">Loading deposit history...</div>`;

            try {
                const res = await fetch('/api/user/deposit-history', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: currentTelegramId })
                });
                
                const data = await res.json();

                if (data.success && data.history && data.history.length > 0) {
                    historyContainer.innerHTML = '';
                    data.history.forEach(item => {
                        let badgeClass = 'pending';
                        if (item.status === 'approved') badgeClass = 'approved';
                        if (item.status === 'rejected') badgeClass = 'rejected';

                        const historyItem = document.createElement('div');
                        historyItem.className = 'history-item';
                        historyItem.innerHTML = `
                            <div class="history-row">
                                <span style="font-weight: 700; color: var(--accent-color);">${item.method}</span>
                                <span class="badge ${badgeClass}">${item.status}</span>
                            </div>
                            <div class="history-row">
                                <span style="color: var(--text-muted);">Send: ${item.send_amount} | Get: <b>$${item.get_amount}</b></span>
                                <span style="font-family: monospace; color: #facc15;">${item.transaction_id}</span>
                            </div>
                            <div class="history-row" style="font-size: 0.7rem; color: var(--text-muted);">
                                <span>${new Date(item.created_at || Date.now()).toLocaleString()}</span>
                            </div>
                        `;
                        historyContainer.appendChild(historyItem);
                    });
                } else {
                    historyContainer.innerHTML = `<div class="no-history">No deposit history found.</div>`;
                }
            } catch (err) {
                console.error("History fetch error:", err);
                historyContainer.innerHTML = `<div class="no-history" style="color: var(--danger-color);">Failed to load history. Please try again.</div>`;
            }
        }

        // পেজ লোড হওয়ার সাথে সাথে হিস্টরি কল করা হলো
        loadDepositHistory();

        const methodSelect = document.getElementById('deposit-method');
        const instructionBox = document.getElementById('payment-instruction-box');
        const targetNumSpan = document.getElementById('target-account-number');
        const getAmountInput = document.getElementById('get-amount');
        const sendAmountDisplay = document.getElementById('send-amount-display');
        const sendLabel = document.getElementById('send-label');
        const txnLabel = document.getElementById('txn-label');

        methodSelect.addEventListener('change', function() {
            const selectedMethod = this.value;
            if (!selectedMethod) {
                instructionBox.style.display = 'none';
                return;
            }

            instructionBox.style.display = 'block';
            const accNum = activeMethodsData[selectedMethod] || "Contact Admin";
            targetNumSpan.innerText = accNum;

            if (selectedMethod.includes('USDT')) {
                sendLabel.innerText = "You Need to Send (USDT)";
                txnLabel.innerText = "Blockchain Transaction Hash";
                document.getElementById('rate-info-text').innerText = "Crypto Direct 1:1 Deposit";
                calculateUsdt();
            } else {
                sendLabel.innerText = "You Need to Send (BDT)";
                txnLabel.innerText = "Transaction ID (TrxID)";
                document.getElementById('rate-info-text').innerText = "Exchange Rate: 1 USD = 140 BDT (Min 1 USD)";
                calculateBdt();
            }
        });

        function calculateBdt() {
            const usd = parseFloat(getAmountInput.value) || 0;
            const bdt = usd * 140;
            sendAmountDisplay.value = `${bdt.toFixed(2)} BDT`;
        }

        function calculateUsdt() {
            const usd = parseFloat(getAmountInput.value) || 0;
            sendAmountDisplay.value = `${usd.toFixed(2)} USDT`;
        }

        getAmountInput.addEventListener('input', function() {
            const selectedMethod = methodSelect.value;
            if (selectedMethod.includes('USDT')) {
                calculateUsdt();
            } else {
                calculateBdt();
            }
        });

        document.getElementById('copy-target-btn').addEventListener('click', () => {
            const num = targetNumSpan.innerText;
            navigator.clipboard.writeText(num);
            const btn = document.getElementById('copy-target-btn');
            btn.innerText = "Copied!";
            setTimeout(() => { btn.innerText = "Copy"; }, 2000);
        });

        document.getElementById('deposit-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const method = methodSelect.value;
            const getAmount = parseFloat(getAmountInput.value);
            const txnId = document.getElementById('transaction-id').value.trim();

            if (!method || !getAmount || !txnId) {
                alert("Please fill all fields properly.");
                return;
            }

            if (!method.includes('USDT') && getAmount < 1) {
                alert("Minimum deposit amount is 1 USD for Mobile Banking.");
                return;
            }

            let sendAmount = method.includes('USDT') ? getAmount : (getAmount * 140);

            try {
                const res = await fetch('/api/submit-deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: currentTelegramId,
                        method: method,
                        send_amount: sendAmount,
                        get_amount: getAmount,
                        transaction_id: txnId
                    })
                });
                const result = await res.json();
                if (result.success) {
                    alert("Deposit request submitted successfully! Pending admin approval.");
                    document.getElementById('deposit-form').reset();
                    instructionBox.style.display = 'none';
                    loadDepositHistory(); // নতুন রিকোয়েস্ট সাবমিট হওয়ার সাথে সাথে হিস্টরি রিফ্রেশ হয়ে যাবে
                } else {
                    alert(result.message || "Submission failed.");
                }
            } catch (err) {
                alert("Network error. Try again.");
            }
        });
    </script>
</body>
    </html>
