<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TECH GLOBAL - Deposit Funds</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 440px; margin: 0 auto; padding-bottom: 20px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 20px; margin-bottom: 16px; }
        
        .form-group { margin-bottom: 14px; }
        .form-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; display: block; font-weight: 600; }
        .form-select, .form-input { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px; border-radius: 10px; font-size: 0.9rem; outline: none; }
        .form-select option { background: #0f172a; color: #f8fafc; }

        .payment-info-box { background: rgba(56, 189, 248, 0.08); border: 1px dashed var(--accent-color); padding: 14px; border-radius: 12px; margin-bottom: 14px; display: none; }
        .target-number-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
        .target-num { font-size: 1.05rem; font-weight: 800; color: var(--accent-color); word-break: break-all; }
        .btn-copy-num { background: var(--accent-color); color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
        .rate-notice { font-size: 0.75rem; color: #34d399; margin-top: 4px; font-weight: 600; }
        
        .btn-submit { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #0f172a; border: none; padding: 14px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); }
        .btn-submit:active { transform: scale(0.98); }

        .history-btn { background: rgba(56, 189, 248, 0.12); color: var(--accent-color); border: 1px solid rgba(56, 189, 248, 0.35); padding: 9px 14px; border-radius: 10px; font-weight: 700; font-size: 0.78rem; cursor: pointer; display: block; margin: -6px auto 16px; }
        .history-btn:active { transform: scale(0.98); }
        .history-overlay { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.78); backdrop-filter: blur(7px); z-index: 9999; display: none; align-items: flex-start; justify-content: center; padding: 22px 14px; overflow-y: auto; }
        .history-overlay.show { display: flex; }
        .history-modal { width: 100%; max-width: 440px; background: #0f172a; border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden; animation: historyIn .18s ease-out; }
        @keyframes historyIn { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }
        .history-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; background: #0f172a; z-index: 2; }
        .history-title { font-size: 1rem; font-weight: 800; color: var(--accent-color); }
        .history-close { width: 34px; height: 34px; border: 0; border-radius: 9px; background: rgba(255,255,255,.08); color: #fff; font-size: 20px; cursor: pointer; }
        .history-body { padding: 14px; max-height: 72vh; overflow-y: auto; }
        .history-item { background: rgba(30,41,59,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
        .history-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
        .history-method { font-weight: 800; font-size: .92rem; }
        .history-status { font-size: .68rem; font-weight: 800; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; background: rgba(148,163,184,.14); color: #cbd5e1; }
        .history-status.pending { color: #fbbf24; background: rgba(251,191,36,.12); }
        .history-status.approved, .history-status.completed, .history-status.success { color: #34d399; background: rgba(52,211,153,.12); }
        .history-status.rejected, .history-status.failed, .history-status.cancelled { color: #fb7185; background: rgba(251,113,133,.12); }
        .history-row { display: flex; justify-content: space-between; gap: 12px; font-size: .76rem; color: var(--text-muted); padding-top: 5px; }
        .history-row strong { color: var(--text-main); font-weight: 700; text-align: right; word-break: break-word; }
        .history-empty, .history-loading, .history-error { text-align: center; color: var(--text-muted); padding: 28px 10px; font-size: .85rem; }
        .history-refresh { display: block; width: 100%; margin-top: 10px; background: rgba(56,189,248,.1); color: var(--accent-color); border: 1px solid rgba(56,189,248,.25); padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div id="site-header"></div>

    <div class="app-container">
        <div class="glass-card">
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--accent-color); margin-bottom: 16px; text-align: center;">DEPOSIT FUNDS</div>
            <button type="button" id="deposit-history-btn" class="history-btn">Deposit History</button>

            <form id="deposit-form">
                
                <div class="form-group">
                    <label class="form-label">Select Payment Method</label>
                    <select id="deposit-method" class="form-select" required>
                        <option value="">-- Choose Method --</option>
                        <option value="bKash">bKash (Manual)</option>
                        <option value="Nagad">Nagad (Manual)</option>
                        <option value="Rocket">Rocket (Manual)</option>
                        <option value="Upay">Upay (Manual)</option>
                        <option value="USDT-TRC20">USDT (TRC20 Network)</option>
                        <option value="USDT-BEP20">USDT (BEP20 Network)</option>
                    </select>
                </div>

                <div id="payment-instruction-box" class="payment-info-box">
                    <div class="form-label" id="instruction-title">Send Money to this Number:</div>
                    <div class="target-number-row">
                        <span id="target-account-number" class="target-num">---</span>
                        <button type="button" id="copy-target-btn" class="btn-copy-num">Copy</button>
                    </div>
                    <div id="rate-info-text" class="rate-notice">Rate: 1 USD = 140 BDT</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Amount You Want to Get (USD)</label>
                    <input type="number" step="0.01" min="1" id="get-amount" class="form-input" placeholder="e.g. 5.00" required>
                </div>

                <div class="form-group" id="send-amount-group">
                    <label class="form-label" id="send-label">You Need to Send (BDT)</label>
                    <input type="text" id="send-amount-display" class="form-input" readonly style="background: rgba(0,0,0,0.6); font-weight: 700; color: #38bdf8;">
                </div>

                <div class="form-group">
                    <label class="form-label" id="txn-label">Transaction ID (TrxID / Hash)</label>
                    <input type="text" id="transaction-id" class="form-input" placeholder="Enter your transaction reference ID" required>
                </div>

                <button type="submit" class="btn-submit">Submit Deposit Request</button>
            </form>
        </div>
    </div>


    <div id="deposit-history-overlay" class="history-overlay" aria-hidden="true">
        <div class="history-modal" role="dialog" aria-modal="true" aria-labelledby="deposit-history-title">
            <div class="history-head">
                <div id="deposit-history-title" class="history-title">DEPOSIT HISTORY</div>
                <button type="button" id="deposit-history-close" class="history-close" aria-label="Close">&times;</button>
            </div>
            <div id="deposit-history-body" class="history-body">
                <div class="history-loading">Loading deposit history...</div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script>
        fetch('/includes/header.html').then(res => res.text()).then(data => document.getElementById('site-header').innerHTML = data);
        fetch('/includes/footer.html').then(res => res.text()).then(data => document.getElementById('site-footer').innerHTML = data);

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let activeMethodsData = {};

        async function loadPaymentMethods() {
            try {
                const res = await fetch('/api/get-deposit-methods');
                const data = await res.json();
                if (data.success) {
                    activeMethodsData = data.methods;
                }
            } catch (e) {
                console.error("Failed to load methods");
            }
        }
        loadPaymentMethods();

        const methodSelect = document.getElementById('deposit-method');
        const instructionBox = document.getElementById('payment-instruction-box');
        const targetNumSpan = document.getElementById('target-account-number');
        const getAmountInput = document.getElementById('get-amount');
        const sendAmountDisplay = document.getElementById('send-amount-display');
        const sendLabel = document.getElementById('send-label');
        const txnLabel = document.getElementById('txn-label');

        methodSelect.addEventListener('change', function() {
            const selectedMethod = this.value;
            if (!selectedMethod) {
                instructionBox.style.display = 'none';
                return;
            }

            instructionBox.style.display = 'block';
            const accNum = activeMethodsData[selectedMethod] || "Contact Admin";
            targetNumSpan.innerText = accNum;

            if (selectedMethod.includes('USDT')) {
                sendLabel.innerText = "You Need to Send (USDT)";
                txnLabel.innerText = "Blockchain Transaction Hash";
                document.getElementById('rate-info-text').innerText = "Crypto Direct 1:1 Deposit";
                calculateUsdt();
            } else {
                sendLabel.innerText = "You Need to Send (BDT)";
                txnLabel.innerText = "Transaction ID (TrxID)";
                document.getElementById('rate-info-text').innerText = "Exchange Rate: 1 USD = 140 BDT (Min 1 USD)";
                calculateBdt();
            }
        });

        function calculateBdt() {
            const usd = parseFloat(getAmountInput.value) || 0;
            const bdt = usd * 140;
            sendAmountDisplay.value = `${bdt.toFixed(2)} BDT`;
        }

        function calculateUsdt() {
            const usd = parseFloat(getAmountInput.value) || 0;
            sendAmountDisplay.value = `${usd.toFixed(2)} USDT`;
        }

        getAmountInput.addEventListener('input', function() {
            const selectedMethod = methodSelect.value;
            if (selectedMethod.includes('USDT')) {
                calculateUsdt();
            } else {
                calculateBdt();
            }
        });

        document.getElementById('copy-target-btn').addEventListener('click', () => {
            const num = targetNumSpan.innerText;
            navigator.clipboard.writeText(num);
            const btn = document.getElementById('copy-target-btn');
            btn.innerText = "Copied!";
            setTimeout(() => { btn.innerText = "Copy"; }, 2000);
        });

        document.getElementById('deposit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const tgUser = tg.initDataUnsafe?.user;
            if (!tgUser) {
                alert("Open through Telegram Bot!");
                return;
            }

            const method = methodSelect.value;
            const getAmount = parseFloat(getAmountInput.value);
            const txnId = document.getElementById('transaction-id').value.trim();

            if (!method || !getAmount || !txnId) {
                alert("Please fill all fields properly.");
                return;
            }

            if (!method.includes('USDT') && getAmount < 1) {
                alert("Minimum deposit amount is 1 USD for Mobile Banking.");
                return;
            }

            let sendAmount = method.includes('USDT') ? getAmount : (getAmount * 140);

            try {
                const res = await fetch('/api/submit-deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        telegram_id: tgUser.id,
                        method: method,
                        send_amount: sendAmount,
                        get_amount: getAmount,
                        transaction_id: txnId
                    })
                });
                const result = await res.json();
                if (result.success) {
                    alert("Deposit request submitted successfully! Pending admin approval.");
                    window.location.reload();
                } else {
                    alert(result.message || "Submission failed.");
                }
            } catch (err) {
                alert("Network error. Try again.");
            }
        });

        const historyOverlay = document.getElementById('deposit-history-overlay');
        const historyBody = document.getElementById('deposit-history-body');
        const historyBtn = document.getElementById('deposit-history-btn');
        const historyClose = document.getElementById('deposit-history-close');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>'"]/g, char => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[char]));
        }

        function formatHistoryDate(value) {
            if (!value) return '—';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return escapeHtml(value);
            return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
        }

        function renderDepositHistory(items) {
            if (!Array.isArray(items) || items.length === 0) {
                historyBody.innerHTML = '<div class="history-empty">No deposit history found.</div><button type="button" class="history-refresh" id="history-refresh-btn">Refresh</button>';
                document.getElementById('history-refresh-btn').onclick = loadDepositHistory;
                return;
            }

            historyBody.innerHTML = items.map(item => {
                const status = String(item.status || 'pending').toLowerCase();
                const method = escapeHtml(item.method || 'Unknown');
                const transactionId = escapeHtml(item.transaction_id || '—');
                const sendAmount = Number(item.send_amount);
                const getAmount = Number(item.get_amount);
                const sendText = Number.isFinite(sendAmount) ? sendAmount.toFixed(2) : escapeHtml(item.send_amount || '—');
                const getText = Number.isFinite(getAmount) ? getAmount.toFixed(2) : escapeHtml(item.get_amount || '—');
                return `
                    <div class="history-item">
                        <div class="history-top">
                            <div class="history-method">${method}</div>
                            <div class="history-status ${escapeHtml(status)}">${escapeHtml(status)}</div>
                        </div>
                        <div class="history-row"><span>You Send</span><strong>${sendText} ${method.includes('USDT') ? 'USDT' : 'BDT'}</strong></div>
                        <div class="history-row"><span>You Get</span><strong>${getText} USD</strong></div>
                        <div class="history-row"><span>Transaction ID</span><strong>${transactionId}</strong></div>
                        <div class="history-row"><span>Date</span><strong>${formatHistoryDate(item.created_at)}</strong></div>
                    </div>`;
            }).join('') + '<button type="button" class="history-refresh" id="history-refresh-btn">Refresh</button>';
            document.getElementById('history-refresh-btn').onclick = loadDepositHistory;
        }

        async function loadDepositHistory() {
            const tgUser = tg.initDataUnsafe?.user;
            if (!tgUser) {
                historyBody.innerHTML = '<div class="history-error">Please open this page through Telegram.</div>';
                return;
            }

            historyBody.innerHTML = '<div class="history-loading">Loading deposit history...</div>';
            try {
                const res = await fetch(`/api/submit-deposit?telegram_id=${encodeURIComponent(tgUser.id)}`, { cache: 'no-store' });
                const data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.message || 'Failed to load history.');
                renderDepositHistory(data.deposits);
            } catch (error) {
                console.error('Deposit history error:', error);
                historyBody.innerHTML = `<div class="history-error">${escapeHtml(error.message || 'Unable to load deposit history.')}</div><button type="button" class="history-refresh" id="history-refresh-btn">Try Again</button>`;
                document.getElementById('history-refresh-btn').onclick = loadDepositHistory;
            }
        }

        function openDepositHistory() {
            historyOverlay.classList.add('show');
            historyOverlay.setAttribute('aria-hidden', 'false');
            loadDepositHistory();
        }

        function closeDepositHistory() {
            historyOverlay.classList.remove('show');
            historyOverlay.setAttribute('aria-hidden', 'true');
        }

        historyBtn.addEventListener('click', openDepositHistory);
        historyClose.addEventListener('click', closeDepositHistory);
        historyOverlay.addEventListener('click', (event) => {
            if (event.target === historyOverlay) closeDepositHistory();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeDepositHistory();
        });
    </script>
</body>
</html>
