<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Dashboard - AL-HUDA TECH GLOBAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#050914;
    --panel:#0c1424;
    --panel2:#101b2e;
    --panel3:#14233a;
    --border:#20314b;
    --border-light:#29405e;
    --primary:#38bdf8;
    --primary-dark:#0284c7;
    --success:#34d399;
    --danger:#f43f5e;
    --warning:#fbbf24;
    --text:#f8fafc;
    --muted:#94a3b8;
    --muted2:#64748b;
    --white:#ffffff;
}

html{
    min-height:100%;
    background:var(--bg);
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(14,165,233,.12),
            transparent 32%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(30,64,175,.10),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:
        "Segoe UI",
        Tahoma,
        Geneva,
        Verdana,
        sans-serif;
    padding:16px;
    -webkit-font-smoothing:antialiased;
}

button,
input,
textarea{
    font-family:inherit;
}

button,
a{
    -webkit-tap-highlight-color:transparent;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

.admin-shell{
    width:100%;
    max-width:760px;
    margin:0 auto;
}

.top-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:17px;
    margin-bottom:14px;
    background:rgba(12,20,36,.94);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:
        0 14px 35px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.brand-area{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.brand-icon{
    width:43px;
    height:43px;
    flex:0 0 43px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    background:
        linear-gradient(
            145deg,
            rgba(56,189,248,.16),
            rgba(2,132,199,.06)
        );
    border:1px solid rgba(56,189,248,.22);
    border-radius:13px;
}

.brand-icon svg{
    width:23px;
    height:23px;
}

.brand-title{
    font-size:18px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:.2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand-subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:11px;
    font-weight:500;
}

.logout-btn{
    border:1px solid rgba(244,63,94,.35);
    background:rgba(244,63,94,.12);
    color:#fb7185;
    padding:10px 14px;
    border-radius:10px;
    font-size:12px;
    font-weight:700;
    transition:.2s ease;
}

.logout-btn:hover{
    background:var(--danger);
    color:var(--white);
}

.welcome-card{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
    padding:22px;
    margin-bottom:14px;
    background:
        linear-gradient(
            135deg,
            rgba(15,35,59,.98),
            rgba(10,22,39,.98)
        );
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 14px 32px rgba(0,0,0,.22);
}

.welcome-label{
    color:var(--primary);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.3px;
    margin-bottom:7px;
}

.welcome-title{
    font-size:26px;
    line-height:1.2;
    font-weight:800;
}

.welcome-text{
    max-width:520px;
    margin-top:8px;
    color:var(--muted);
    font-size:13px;
    line-height:1.65;
}

.admin-status{
    display:flex;
    align-items:center;
    gap:7px;
    flex-shrink:0;
    padding:7px 10px;
    border-radius:999px;
    color:#6ee7b7;
    background:rgba(52,211,153,.08);
    border:1px solid rgba(52,211,153,.18);
    font-size:11px;
    font-weight:700;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 10px rgba(52,211,153,.75);
    animation:statusPulse 1.8s infinite;
}

@keyframes statusPulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }
    50%{
        opacity:.45;
        transform:scale(.8);
    }
}

.balance-card{
    position:relative;
    overflow:hidden;
    padding:22px;
    margin-bottom:14px;
    background:
        linear-gradient(
            135deg,
            #0b2740,
            #0b182b 58%,
            #08111f
        );
    border:1px solid rgba(56,189,248,.23);
    border-radius:18px;
    box-shadow:
        0 18px 40px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.balance-card::before{
    content:"";
    position:absolute;
    width:170px;
    height:170px;
    right:-70px;
    top:-85px;
    border-radius:50%;
    background:rgba(56,189,248,.08);
}

.balance-card-top{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.balance-label{
    color:#93c5fd;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.9px;
}

.balance-value{
    margin-top:7px;
    font-size:38px;
    line-height:1;
    font-weight:850;
    letter-spacing:-1px;
}

.balance-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    color:var(--primary);
    background:rgba(56,189,248,.10);
    border:1px solid rgba(56,189,248,.20);
}

.balance-icon svg{
    width:25px;
    height:25px;
}

.balance-footer{
    position:relative;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    padding-top:13px;
    border-top:1px solid rgba(148,163,184,.13);
    color:var(--muted);
    font-size:11px;
}

.balance-footer strong{
    color:#bae6fd;
    font-size:11px;
}
    .section-heading{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:15px;
}

.section-heading-icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.16);
    border-radius:11px;
}

.section-heading-icon svg{
    width:19px;
    height:19px;
}

.section-heading h2{
    font-size:15px;
    font-weight:800;
}

.section-heading p{
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

.info-card,
.actions-section{
    padding:20px;
    margin-bottom:14px;
    background:rgba(12,20,36,.94);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 12px 30px rgba(0,0,0,.20);
}

.info-list{
    overflow:hidden;
    border:1px solid rgba(148,163,184,.10);
    border-radius:13px;
}

.info-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:14px;
    background:rgba(15,23,42,.62);
    border-bottom:1px solid rgba(148,163,184,.08);
}

.info-row:last-child{
    border-bottom:0;
}

.info-label{
    color:var(--muted);
    font-size:11px;
    font-weight:600;
}

.info-value{
    max-width:60%;
    color:var(--text);
    font-size:12px;
    font-weight:700;
    text-align:right;
    word-break:break-word;
}

.role-value{
    color:#7dd3fc;
}

.status-value{
    color:#6ee7b7;
}

.referral-card{
    position:relative;
    overflow:hidden;
    padding:20px;
    margin-bottom:14px;
    background:
        linear-gradient(
            145deg,
            rgba(14,34,54,.98),
            rgba(9,19,34,.98)
        );
    border:1px solid rgba(56,189,248,.24);
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.referral-card::after{
    content:"";
    position:absolute;
    width:190px;
    height:190px;
    right:-110px;
    bottom:-120px;
    border-radius:50%;
    background:rgba(14,165,233,.08);
    pointer-events:none;
}

.referral-card-top{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:12px;
}

.referral-icon{
    width:44px;
    height:44px;
    flex:0 0 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#67e8f9;
    background:rgba(34,211,238,.08);
    border:1px solid rgba(34,211,238,.18);
    border-radius:13px;
}

.referral-icon svg{
    width:22px;
    height:22px;
}

.referral-title{
    font-size:17px;
    font-weight:800;
}

.referral-subtitle{
    margin-top:4px;
    color:var(--muted);
    font-size:10px;
}

.referral-stat{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:17px;
    padding:17px;
    background:rgba(5,14,26,.55);
    border:1px solid rgba(56,189,248,.14);
    border-radius:14px;
}

.referral-stat span{
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.6px;
}

.referral-stat strong{
    display:block;
    margin-top:5px;
    color:#67e8f9;
    font-size:30px;
    line-height:1;
    font-weight:850;
}

.referral-stat-icon{
    width:43px;
    height:43px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#38bdf8;
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.15);
    border-radius:12px;
}

.referral-stat-icon svg{
    width:21px;
    height:21px;
}

.referral-notice-display{
    position:relative;
    z-index:1;
    margin-top:12px;
    padding:15px;
    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.09),
            rgba(56,189,248,.025)
        );
    border-left:3px solid var(--primary);
    border-top:1px solid rgba(56,189,248,.12);
    border-right:1px solid rgba(56,189,248,.12);
    border-bottom:1px solid rgba(56,189,248,.12);
    border-radius:11px;
}

.referral-notice-label{
    color:#7dd3fc;
    font-size:9px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:7px;
}

.referral-notice-text{
    color:#e2e8f0;
    font-size:12px;
    line-height:1.65;
    white-space:pre-wrap;
    word-break:break-word;
}

.referral-settings-btn{
    position:relative;
    z-index:1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:13px;
    padding:13px;
    border:1px solid rgba(56,189,248,.28);
    border-radius:11px;
    background:
        linear-gradient(
            135deg,
            rgba(14,165,233,.22),
            rgba(2,132,199,.12)
        );
    color:#bae6fd;
    font-size:12px;
    font-weight:800;
    transition:.2s ease;
}

.referral-settings-btn:hover{
    background:var(--primary-dark);
    color:#fff;
}

.referral-settings-btn svg{
    width:17px;
    height:17px;
}

.actions-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.admin-action{
    position:relative;
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
    padding:16px 14px;
    background:rgba(15,23,42,.72);
    border:1px solid rgba(148,163,184,.13);
    border-radius:14px;
    transition:.2s ease;
}

.admin-action:hover{
    transform:translateY(-1px);
    border-color:rgba(56,189,248,.30);
    background:rgba(17,36,57,.92);
}

.settings-action{
    border-color:rgba(56,189,248,.20);
    background:
        linear-gradient(
            135deg,
            rgba(14,165,233,.10),
            rgba(15,23,42,.72)
        );
}

.admin-action-icon{
    width:40px;
    height:40px;
    flex:0 0 40px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.15);
    border-radius:11px;
}

.admin-action-icon svg{
    width:19px;
    height:19px;
}

.admin-action strong{
    display:block;
    font-size:12px;
    font-weight:800;
}

.admin-action span{
    display:block;
    margin-top:4px;
    color:var(--muted);
    font-size:9px;
    line-height:1.3;
}

.arrow-icon{
    width:16px;
    height:16px;
    margin-left:auto;
    flex:0 0 16px;
    color:var(--muted2);
}

.admin-footer{
    padding:20px 10px 8px;
    text-align:center;
}

.footer-brand{
    color:#7dd3fc;
    font-size:11px;
    font-weight:800;
    letter-spacing:.6px;
}

.footer-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    color:var(--muted);
    font-size:9px;
}

.footer-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--success);
}

.footer-copy{
    margin-top:6px;
    color:var(--muted2);
    font-size:8px;
    }
    .loading{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:var(--muted);
    font-size:12px;
}

.loading-spinner{
    width:34px;
    height:34px;
    border:3px solid rgba(56,189,248,.14);
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.error-screen{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px 20px;
}

.error-icon{
    width:64px;
    height:64px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:15px;
    color:var(--warning);
    background:rgba(251,191,36,.08);
    border:1px solid rgba(251,191,36,.16);
    border-radius:18px;
}

.error-icon.danger{
    color:#fb7185;
    background:rgba(244,63,94,.08);
    border-color:rgba(244,63,94,.16);
}

.error-icon svg{
    width:30px;
    height:30px;
}

.error-screen h2{
    font-size:20px;
    font-weight:800;
}

.error-screen p{
    max-width:340px;
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
}

.action-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:180px;
    margin-top:18px;
    padding:12px 17px;
    border-radius:11px;
    font-size:12px;
    font-weight:800;
    border:1px solid transparent;
}

.action-btn.primary{
    background:var(--primary-dark);
    color:#fff;
}

.action-btn.secondary{
    background:rgba(51,65,85,.45);
    color:#e2e8f0;
    border-color:rgba(148,163,184,.15);
}

body.modal-open{
    overflow:hidden;
}

.modal-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    background:rgba(1,5,12,.78);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

.modal-overlay.active{
    display:flex;
    animation:fadeIn .18s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

.modal{
    width:100%;
    max-width:520px;
    max-height:90vh;
    overflow-y:auto;
    background:#0b1424;
    border:1px solid var(--border-light);
    border-radius:18px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.015);
    animation:modalUp .22s ease;
}

@keyframes modalUp{
    from{
        opacity:0;
        transform:translateY(12px) scale(.98);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px;
    border-bottom:1px solid rgba(148,163,184,.10);
}

.modal-title-area{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.modal-icon{
    width:42px;
    height:42px;
    flex:0 0 42px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--primary);
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.16);
    border-radius:12px;
}

.modal-icon svg{
    width:21px;
    height:21px;
}

.modal-title{
    font-size:15px;
    font-weight:800;
}

.modal-subtitle{
    margin-top:3px;
    color:var(--muted);
    font-size:9px;
}

.modal-close{
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 34px;
    border:1px solid rgba(148,163,184,.12);
    border-radius:9px;
    background:rgba(51,65,85,.30);
    color:var(--muted);
}

.modal-close:hover{
    color:#fff;
    background:rgba(244,63,94,.15);
}

.modal-close svg{
    width:17px;
    height:17px;
}

.modal-body{
    padding:18px;
}

.setting-highlight{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px;
    margin-bottom:17px;
    background:
        linear-gradient(
            135deg,
            rgba(56,189,248,.10),
            rgba(56,189,248,.025)
        );
    border:1px solid rgba(56,189,248,.15);
    border-radius:13px;
}

.setting-highlight-icon{
    width:38px;
    height:38px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#67e8f9;
    background:rgba(34,211,238,.08);
    border:1px solid rgba(34,211,238,.14);
    border-radius:10px;
}

.setting-highlight-icon svg{
    width:18px;
    height:18px;
}

.setting-highlight > div:last-child{
    flex:1;
}

.setting-highlight span{
    display:block;
    color:var(--muted);
    font-size:9px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.7px;
}

.setting-highlight strong{
    display:block;
    margin-top:3px;
    color:#67e8f9;
    font-size:23px;
    line-height:1;
}

.form-group{
    margin-top:15px;
}

.form-group:first-of-type{
    margin-top:0;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#cbd5e1;
    font-size:11px;
    font-weight:700;
}

.input-wrapper{
    position:relative;
}

.form-input,
.form-textarea{
    width:100%;
    outline:none;
    color:#f8fafc;
    background:#07101e;
    border:1px solid #22354e;
    border-radius:11px;
    transition:.2s ease;
}

.form-input{
    height:44px;
    padding:0 43px 0 13px;
    font-size:13px;
}

.form-textarea{
    min-height:110px;
    resize:vertical;
    padding:12px 13px;
    font-size:12px;
    line-height:1.55;
}

.form-input:focus,
.form-textarea:focus{
    border-color:rgba(56,189,248,.60);
    box-shadow:0 0 0 3px rgba(56,189,248,.08);
}

.input-suffix{
    position:absolute;
    top:50%;
    right:14px;
    transform:translateY(-50%);
    color:#67e8f9;
    font-size:13px;
    font-weight:800;
    pointer-events:none;
}

.form-group small{
    display:block;
    margin-top:6px;

<script>

const tg = window.Telegram.WebApp;

tg.expand();

const urlParams =
    new URLSearchParams(window.location.search);

let tgId =
    urlParams.get('tg_id');

if (
    !tgId &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
) {
    tgId =
        tg.initDataUnsafe.user.id;
    }
    function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){
        return '';
    }

    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}


function formatBalance(value){

    const number =
        parseFloat(value);

    if(
        Number.isNaN(number)
    ){
        return '$0.00';
    }

    return '$' +
        number.toFixed(2);
}


function formatPercentage(value){

    const number =
        parseFloat(value);

    if(
        Number.isNaN(number)
    ){
        return '5%';
    }

    if(
        Number.isInteger(number)
    ){
        return number + '%';
    }

    return number.toFixed(2) + '%';
}


function openReferralModal(){

    const modal =
        document.getElementById(
            'referralModal'
        );

    if(!modal){
        return;
    }

    modal.classList.add('active');

    document.body.classList.add(
        'modal-open'
    );

    updateNoticePreview();
}


function closeReferralModal(){

    const modal =
        document.getElementById(
            'referralModal'
        );

    if(!modal){
        return;
    }

    modal.classList.remove(
        'active'
    );

    document.body.classList.remove(
        'modal-open'
    );
}


function updateNoticePreview(){

    const input =
        document.getElementById(
            'refNotice'
        );

    const preview =
        document.getElementById(
            'refNoticePreview'
        );

    if(
        !input ||
        !preview
    ){
        return;
    }

    const value =
        input.value.trim();

    preview.textContent =
        value ||
        'Your referral notice will appear here.';
}

/* ==========================================
   SAVE REFERRAL SETTINGS
========================================== */

async function saveReferralSettings(){

    const percentageInput =
        document.getElementById(
            'refPercentage'
        );

    const noticeInput =
        document.getElementById(
            'refNotice'
        );

    const saveButton =
        document.getElementById(
            'saveReferralBtn'
        );


    if(
        !percentageInput ||
        !noticeInput
    ){
        return;
    }


    const percentage =
        percentageInput.value.trim();

    const notice =
        noticeInput.value.trim();


    if(
        percentage === '' ||
        Number.isNaN(
            parseFloat(percentage)
        )
    ){

        alert(
            'Please enter a valid referral commission percentage.'
        );

        percentageInput.focus();

        return;
    }


    const percentageNumber =
        parseFloat(percentage);


    if(
        percentageNumber < 0 ||
        percentageNumber > 100
    ){

        alert(
            'Referral commission must be between 0% and 100%.'
        );

        percentageInput.focus();

        return;
    }


    const originalButtonHTML =
        saveButton
            ? saveButton.innerHTML
            : 'Save Changes';


    if(saveButton){

        saveButton.disabled =
            true;

        saveButton.innerHTML = `

            <span class="button-spinner"></span>

            Saving...

        `;

    }
        try{

        const res =
            await fetch(
                '/api/action',
                {
                    method:'POST',

                    headers:{
                        'Content-Type':
                            'application/json'
                    },

                    body:JSON.stringify({

                        action:
                            'update_referral_settings',

                        tg_id:
                            tgId,

                        referral_percentage:
                            percentage,

                        referral_notice:
                            notice

                    })
                }
            );


        const result =
            await res.json();


        if(result.success){

            const formattedPercentage =
                formatPercentage(
                    percentageNumber
                );


            const dashboardPercentage =
                document.getElementById(
                    'dashboardReferralPercentage'
                );


            const currentPercentage =
                document.getElementById(
                    'currentReferralPercentage'
                );


            const dashboardNotice =
                document.getElementById(
                    'dashboardReferralNotice'
                );


            if(dashboardPercentage){

                dashboardPercentage.textContent =
                    formattedPercentage;

            }


            if(currentPercentage){

                currentPercentage.textContent =
                    formattedPercentage;

            }


            if(dashboardNotice){

                dashboardNotice.textContent =
                    notice ||
                    'No referral notice has been configured.';

            }


            alert(
                'Referral settings updated successfully.'
            );


            closeReferralModal();


        }else{

            alert(
                'Failed: ' +
                (
                    result.message ||
                    'Unknown error'
                )
            );

        }


    }catch(error){

        console.error(
            'Referral settings update error:',
            error
        );


        alert(
            'Server error while updating referral settings.'
        );


    }finally{

        if(saveButton){

            saveButton.disabled =
                false;

            saveButton.innerHTML =
                originalButtonHTML;

        }

    }

}


/* ==========================================
   MODAL INITIALIZATION
========================================== */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        const modal =
            document.getElementById(
                'referralModal'
            );


        if(!modal){
            return;
        }


        modal.addEventListener(
            'click',
            function(event){

                if(
                    event.target === modal
                ){

                    closeReferralModal();

                }

            }
        );


        const notice =
            document.getElementById(
                'refNotice'
            );


        if(notice){

            notice.addEventListener(
                'input',
                updateNoticePreview
            );

        }

    }
);

verifyAdmin();

</script>
