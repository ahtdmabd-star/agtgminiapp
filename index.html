<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification - AL-HUDA TASK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; width: 90%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .loader { font-size: 16px; color: #38bdf8; font-weight: bold; margin-bottom: 15px; }
        .btn { display: block; background: #2563eb; color: #fff; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <div class="loader" id="loadingText">Verifying your account... 🚀</div>
        
        <div id="verifyBox" class="hidden">
            <h3 style="color: #f87171; margin-top:0;">Subscription Required!</h3>
            <p style="font-size: 14px; color: #94a3b8;">You must join our official Channel and Group to use this Mini App.</p>
            <a href="https://t.me/AHTG_OFFICIAL" target="_blank" class="btn">📢 Join Official Channel</a>
            <a href="https://t.me/ahtgofic" target="_blank" class="btn">💬 Join Official Group</a>
            <button onclick="checkUserAccess()" class="btn btn-success" style="width:100%; border:none; cursor:pointer; font-size:15px; margin-top: 15px;">✅ Verify & Enter</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        function checkUserAccess() {
            if (!user || !user.id) {
                document.getElementById('loadingText').innerText = "Please open this app from the official Telegram Bot!";
                return;
            }

            document.getElementById('loadingText').innerText = "Checking membership...";
            document.getElementById('verifyBox').classList.add('hidden');

            fetch(`check_user.php?telegram_id=${user.id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('loadingText').innerText = "Access granted! Redirecting...";
                        setTimeout(() => {
                            if (data.role === 'admin') {
                                window.location.href = `admin/index.php?telegram_id=${user.id}`;
                            } else {
                                window.location.href = `dashboard.php?telegram_id=${user.id}`;
                            }
                        }, 500);
                    } else {
                        if (data.redirect === 'join_required') {
                            document.getElementById('loadingText').innerText = "Verification Failed!";
                            document.getElementById('verifyBox').classList.remove('hidden');
                        } else {
                            document.getElementById('loadingText').innerText = "❌ " + data.message;
                        }
                    }
                })
                .catch(err => {
                    document.getElementById('loadingText').innerText = "Connection Error! Please retry.";
                });
        }

        // পেজ লোড হওয়ার সাথে সাথে প্রথম চেক
        checkUserAccess();
    </script>
</body>
</html>
