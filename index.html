<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HUDA TECH GLOBAL - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .card {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid #1e293b;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .label {
            color: #94a3b8;
        }
        .value {
            color: #f1f5f9;
            font-weight: 600;
        }
        .balance-box {
            text-align: center;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .balance-box h3 {
            font-size: 28px;
            margin-top: 5px;
        }
        .ref-box {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #38bdf8;
            word-break: break-all;
            margin-top: 5px;
            border: 1px dashed #334155;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background: #334155;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.2s;
        }
        .btn:hover {
            background: #475569;
        }
        .btn-full {
            width: 100%;
            background: #2563eb;
        }
        .btn-full:hover {
            background: #1d4ed8;
        }
        .loading, .error-msg {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="loading">Loading your dashboard...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // URL থেকে tg_id নেওয়া অথবা Telegram WebApp থেকে নেওয়া
        const urlParams = new URLSearchParams(window.location.search);
        let tgId = urlParams.get('tg_id');

        if (!tgId && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgId = tg.initDataUnsafe.user.id;
        }

        async function fetchUserData() {
            const appContainer = document.getElementById('app');

            if (!tgId) {
                appContainer.innerHTML = `
                    <div class="error-msg">
                        <h3>⚠️ Access Denied</h3>
                        <p>Please open this Mini App directly from the Telegram Bot using the official link.</p>
                    </div>
                `;
                return;
            }

            try {
                // নেটিফাই ফাংশন বা আপনার ব্যাকএন্ড এপিআই যেখান থেকে ডাটা ফেচ হবে
                const response = await fetch(`/api/get-user?tg_id=${tgId}`);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    appContainer.innerHTML = `
                        <div class="error-msg">
                            <h3>⚠️ Verification Required</h3>
                            <p>${data.message || 'Please join our channel and verify your account via the bot first.'}</p>
                        </div>
                    `;
                    return;
                }

                const user = data.user;

                // যদি ইউজার এডমিন হয়, তবে এডমিন ড্যাশবোর্ড বা সাধারণ ড্যাশবোর্ড দেখানোর লজিক
                appContainer.innerHTML = `
                    <div class="header">
                        <h2>AL-HUDA TECH GLOBAL</h2>
                        <p>Welcome, ${user.first_name || 'User'}!</p>
                    </div>

                    <div class="balance-box">
                        <span class="label">Total Balance</span>
                        <h3>$${parseFloat(user.balance).toFixed(2)} USD</h3>
                    </div>

                    <div class="card">
                        <div class="info-row">
                            <span class="label">Telegram ID:</span>
                            <span class="value">${user.telegram_id}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Referred By:</span>
                            <span class="value">${user.referred_by || 'None (Direct)'}</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Total Referrals:</span>
                            <span class="value">${user.referrals || 0} Users</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Account Role:</span>
                            <span class="value" style="text-transform: uppercase; color: #38bdf8;">${user.role}</span>
                        </div>
                    </div>

                    <div class="card">
                        <span class="label">Your Referral Link:</span>
                        <div class="ref-box">https://t.me/ahtgearnbdbot?start=${user.referral_code}</div>
                    </div>

                    <div class="btn-grid">
                        <a href="deposit.html" class="btn">💳 Deposit</a>
                        <a href="withdraw.html" class="btn">🏦 Withdraw</a>
                    </div>

                    <a href="tasks.html" class="btn btn-full" style="display: block; text-align: center;">🚀 Go to Tasks / Earn More</a>
                `;

            } catch (error) {
                console.error('Error fetching user data:', error);
                appContainer.innerHTML = `
                    <div class="error-msg">
                        <h3>❌ Connection Error</h3>
                        <p>Failed to load user data. Please try again later.</p>
                    </div>
                `;
            }
        }

        fetchUserData();
    </script>
</body>
  </html>
