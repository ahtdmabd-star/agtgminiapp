্<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HUDA TECH GLOBAL - Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>AL-HUDA TECH GLOBAL</h2>
        <div id="loading-section">
            <div class="loader"></div>
            <p>Logging into your account...</p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://ahtdmabd-star-github-io.vercel.app';

        window.onload = async function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            const user = tg.initDataUnsafe?.user;
            
            if (!user) {
                alert("Please open this mini app from the official Telegram bot!");
                return;
            }

            try {
                let response = await fetch(`${BACKEND_URL}/api/check-user?telegram_id=${user.id}`);
                let data = await response.json();

                if (data.success) {
                    if (data.role === 'admin') {
                        window.location.href = 'admin/index.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                // কোনো কারণে এপিআই স্লো হলে বা এরর দিলে সরাসরি ড্যাশবোর্ডে প্রবেশ করিয়ে দেবে
                window.location.href = 'dashboard.html';
            }
        };
    </script>
</body>
</html>
