<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HUDA TECH GLOBAL - Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>অ্যাকাউন্ট ভেরিফিকেশন</h2>
        <div id="loading-section">
            <div class="loader"></div>
            <p>আপনার অ্যাকাউন্ট ও মেম্বারশিপ চেক করা হচ্ছে...</p>
        </div>

        <div id="verify-section" class="hidden">
            <p style="color: #f87171;">⚠️ আপনি আমাদের অফিসিয়াল চ্যানেল ও গ্রুপে জয়েন করেননি!</p>
            <p>মিনি অ্যাপ ব্যবহার করতে হলে নিচের চ্যানেল ও গ্রুপে জয়েন করুন:</p>
            <a href="https://t.me/AHTG_OFFICIAL" target="_blank" class="btn">📢 Official Channel</a>
            <a href="https://t.me/ahtgofic" target="_blank" class="btn">💬 Official Group</a>
            <button class="btn btn-success" onclick="checkMembershipAndLogin()">✅ আমি জয়েন করেছি, ভেরিফাই করুন</button>
        </div>
    </div>

    <script>
        let userTelegramId = null;

        window.onload = async function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            const user = tg.initDataUnsafe?.user;
            
            if (!user) {
                alert("দয়া করে টেলিগ্রাম বট থেকে মিনি অ্যাপটি ওপেন করুন!");
                return;
            }

            userTelegramId = user.id;
            verifyUserSession(userTelegramId);
        };

        async function verifyUserSession(telegramId) {
            try {
                // ডাটাবেজ বা ব্যাকএন্ড থেকে ইউজারের স্ট্যাটাস চেক করার রিকোয়েস্ট
                // এখানে আপনার বটের ব্যাকএন্ড বা ডাটাবেজ এপিআই লিংক বসবে
                let response = await fetch(`https://your-bot-domain.com/api/check-user?telegram_id=${telegramId}`);
                let data = await response.json();

                if (data.exists && data.isJoined) {
                    redirectToPanel(data.role);
                } else {
                    document.getElementById('loading-section').classList.add('hidden');
                    document.getElementById('verify-section').classList.remove('hidden');
                }
            } catch (err) {
                // যদি সরাসরি এপিআই কানেক্ট করা না থাকে, তবে বাইপাস রোধ করার জন্য ভেরিফাই সেকশন দেখাবে
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('verify-section').classList.remove('hidden');
            }
        }

        async function checkMembershipAndLogin() {
            const btn = document.querySelector('.btn-success');
            btn.innerText = "যাচাই করা হচ্ছে...";
            btn.disabled = true;

            try {
                // সার্ভারে রিকোয়েস্ট পাঠিয়ে রিয়েল-টাইম চেক করা যে ইউজার জয়েন করেছে কিনা
                let response = await fetch(`https://your-bot-domain.com/api/verify-membership?telegram_id=${userTelegramId}`);
                let data = await response.json();

                if (data.success && data.isJoined) {
                    alert('ভেরিফিকেশন সফল হয়েছে!');
                    redirectToPanel(data.role);
                } else {
                    alert('⚠️ আপনি এখনো চ্যানেল বা গ্রুপে জয়েন করেননি! দয়া করে জয়েন করে আবার ভেরিফাই করুন।');
                    btn.innerText = "✅ আমি জয়েন করেছি, ভেরিফাই করুন";
                    btn.disabled = false;
                }
            } catch (err) {
                alert('সার্ভারে সমস্যা হচ্ছে। দয়া করে কিছুক্ষণ পর আবার চেষ্টা করুন।');
                btn.innerText = "✅ আমি জয়েন করেছি, ভেরিফাই করুন";
                btn.disabled = false;
            }
        }

        function redirectToPanel(role) {
            if (role === 'admin') {
                window.location.href = 'admin/index.html';
            } else {
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
