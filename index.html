<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-HUDA TECH GLOBAL - Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>অ্যাকাউন্ট ভেরিফিকেশন</h2>
        <div id="loading-section">
            <div class="loader"></div>
            <p>আপনার অ্যাকাউন্ট ও মেম্বারশিপ চেক করা হচ্ছে...</p>
        </div>

        <div id="verify-section" class="hidden">
            <p style="color: #f87171;">⚠️ আপনি আমাদের অফিসিয়াল চ্যানেল ও গ্রুপে জয়েন করেননি!</p>
            <p>মিনি অ্যাপ ব্যবহার করতে হলে নিচের চ্যানেল ও গ্রুপে জয়েন করুন:</p>
            <a href="https://t.me/AHTG_OFFICIAL" target="_blank" class="btn">📢 Official Channel</a>
            <a href="https://t.me/ahtgofic" target="_blank" class="btn">💬 Official Group</a>
            <button class="btn btn-success" onclick="checkMembershipAndLogin()">✅ আমি জয়েন করেছি, ভেরিফাই করুন</button>
        </div>
    </div>

    <script>
        window.onload = async function() {
            const tg = window.Telegram.WebApp;
            tg.expand();

            const user = tg.initDataUnsafe?.user;
            
            if (!user) {
                alert("দয়া করে টেলিগ্রাম বট থেকে মিনি অ্যাপটি ওপেন করুন!");
                return;
            }

            const telegramId = user.id;
            verifyUserSession(telegramId);
        };

        async function verifyUserSession(telegramId) {
            try {
                // এখানে আপনার ডাটাবেজ চেক করার লজিক বা API কল হবে
                let response = await fetch(`https://your-api-or-database-url.com/check?telegram_id=${telegramId}`);
                let data = await response.json();

                if (data.exists && data.isJoined) {
                    if (data.role === 'admin') {
                        window.location.href = 'admin/index.html'; // অ্যাডমিন ফোল্ডারের ভেতর রিডাইরেক্ট
                    } else {
                        window.location.href = 'dashboard.html'; // ইউজার ড্যাশবোর্ড
                    }
                } else {
                    document.getElementById('loading-section').classList.add('hidden');
                    document.getElementById('verify-section').classList.remove('hidden');
                }
            } catch (err) {
                document.getElementById('loading-section').classList.add('hidden');
                document.getElementById('verify-section').classList.remove('hidden');
            }
        }

        function checkMembershipAndLogin() {
            alert('ভেরিফিকেশন সফল হয়েছে!');
            location.reload();
        }
    </script>
</body>
</html>
