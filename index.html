<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL-HUDA TECH GLOBAL - Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }
      50% { box-shadow: 0 0 25px rgba(56, 189, 248, 0.4); }
    }
    .glow-card { animation: pulseGlow 3s infinite ease-in-out; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- ফিক্সড হেডার -->
  <header class="bg-[#111827]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3.5 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-sky-600 to-indigo-600 flex items-center justify-center shadow-inner">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      </div>
      <h1 class="font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 text-sm tracking-wider">AL-HUDA TECH GLOBAL</h1>
    </div>
    <div id="headerTelegramId" class="bg-slate-900 px-3 py-1 rounded-full border border-slate-800 text-[11px] font-mono text-sky-400 flex items-center space-x-1.5 shadow-inner">
      <svg class="w-3.5 h-3.5 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
      <span id="tgIdText">Checking...</span>
    </div>
  </header>

  <!-- মূল কন্টেন্ট এরিয়া -->
  <main class="p-4 max-w-md mx-auto w-full space-y-4 my-auto">
    
    <!-- ব্যালেন্স কার্ড -->
    <div class="bg-gradient-to-br from-slate-900 to-[#151c2f] border border-slate-800/80 p-5 rounded-2xl glow-card space-y-4 shadow-2xl relative overflow-hidden">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-sky-500/10 rounded-full blur-2xl"></div>
      <div class="flex justify-between items-center">
        <div>
          <p class="text-[11px] text-slate-400 uppercase tracking-wider font-medium">Available Balance</p>
          <h2 id="userBalance" class="text-2xl font-extrabold text-emerald-400 mt-0.5">$0.00</h2>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-slate-800/60">
        <button onclick="location.href='deposit.html'" class="bg-sky-600 hover:bg-sky-500 py-2 px-3 rounded-xl font-semibold text-xs transition flex items-center justify-center space-x-1.5 shadow-md cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          <span>Deposit</span>
        </button>
        <button onclick="location.href='withdraw.html'" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2 px-3 rounded-xl font-semibold text-xs transition flex items-center justify-center space-x-1.5 shadow-md cursor-pointer text-slate-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/></svg>
          <span>Withdraw</span>
        </button>
      </div>
    </div>

    <!-- রেফারেল ইনফো কার্ড -->
    <div class="bg-slate-900/90 border border-slate-800/80 p-4 rounded-2xl space-y-3 shadow-lg">
      <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center space-x-1.5">
        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span>Referral Center</span>
      </h3>
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/60">
          <span class="text-slate-500 block text-[10px]">Total Referrals</span>
          <span id="totalRefs" class="font-bold text-sky-400 text-sm">0</span>
        </div>
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/60">
          <span class="text-slate-500 block text-[10px]">Referred By</span>
          <span id="referredBy" class="font-bold text-amber-400 text-xs truncate block">None</span>
        </div>
      </div>
      <div class="space-y-1">
        <label class="text-[10px] text-slate-400 font-medium">Your Referral Link</label>
        <div class="flex space-x-1.5">
          <input id="refLinkInput" type="text" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-[11px] text-slate-300 font-mono focus:outline-none">
          <button onclick="copyRefLink()" class="bg-sky-600 hover:bg-sky-500 px-3 py-2 rounded-xl text-xs font-semibold transition cursor-pointer shadow-md flex items-center justify-center">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ড্যাশবোর্ডে যাওয়ার হাইলাইটেড বাটন -->
    <button onclick="goToDashboard()" class="w-full bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 py-3.5 rounded-2xl font-bold text-xs transition shadow-xl flex items-center justify-center space-x-2 cursor-pointer group">
      <span>Go To Dashboard</span>
      <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
    </button>
  </main>

  <!-- ফিক্সড ফুটার (নেভিগেশন বার - হোম, ওয়ালেট, হিস্টরি, সাপোর্ট) -->
  <footer class="bg-[#111827]/90 backdrop-blur-md border-t border-slate-800/80 p-2.5 sticky bottom-0 z-50">
    <div class="flex justify-around items-center max-w-md mx-auto text-[11px]">
      <a href="index.html" class="text-sky-400 font-bold flex flex-col items-center space-y-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        <span>Home</span>
      </a>
      <a href="wallet.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center space-y-1 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
        <span>Wallet</span>
      </a>
      <a href="history.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center space-y-1 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>History</span>
      </a>
      <a href="support.html" class="text-slate-400 hover:text-slate-200 flex flex-col items-center space-y-1 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
        <span>Support</span>
      </a>
    </div>
  </footer>

  <!-- চ্যানেল ও গ্রুপ জয়েনিং ভেরিফিকেশন পপআপ মোডাল -->
  <div id="verifyModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-sm w-full space-y-4 shadow-2xl text-center">
      <div class="w-12 h-12 bg-sky-500/10 border border-sky-500/20 text-sky-400 rounded-2xl mx-auto flex items-center justify-center">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <div class="space-y-1">
        <h3 class="font-bold text-white text-sm">Channel Verification Required</h3>
        <p class="text-[11px] text-slate-400">মিনি অ্যাপে প্রবেশ করতে আমাদের অফিশিয়াল চ্যানেল এবং গ্রুপে জয়েন থাকা বাধ্যতামূলক।</p>
      </div>
      <div class="space-y-2 pt-1">
        <a href="https://t.me/AHTG_OFFICIAL" target="_blank" class="block bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2.5 rounded-xl text-xs font-semibold text-sky-400 transition">Join Official Channel</a>
        <a href="https://t.me/ahtgofic" target="_blank" class="block bg-slate-800 hover:bg-slate-700 border border-slate-700 py-2.5 rounded-xl text-xs font-semibold text-sky-400 transition">Join Official Group</a>
      </div>
      <button onclick="verifyMembership()" class="w-full bg-sky-600 hover:bg-sky-500 py-3 rounded-xl font-bold text-xs transition shadow-lg cursor-pointer">
        I Have Joined, Verify Now
      </button>
    </div>
  </div>

  <script>
    // টেলিগ্রাম ওয়েব অ্যাপ থেকে আইডি নেওয়া, না পেলে টেস্টিংয়ের জন্য ডেটাবেজের ইউজার আইডি (যেমন: 7689311203) ব্যবহার হবে
    const botToken = "8332234102:AAEn-gW1WCbt4_a7od8sCvysndE2u3nZtNc";
    const channelUsername = "@AHTG_OFFICIAL";
    const groupUsername = "@ahtgofic";
    
    let currentTelegramId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "7689311203";
    let currentUserData = null;

    window.onload = () => {
      initUserSession();
    };

    async function initUserSession() {
      document.getElementById('tgIdText').innerText = currentTelegramId;
      
      // লোকাল স্টোরেজ থেকে ইউজারের ডাটা চেক করা বা সিমুলেট করা (গিটহাব পেজের জন্য)
      // স্ক্রিনশটের ডাটা অনুযায়ী ডেমো ডাটা সেটআপ
      currentUserData = {
        telegram_id: currentTelegramId,
        first_name: currentTelegramId === "7689311203" ? "Owner" : "Raja",
        role: currentTelegramId === "7689311203" ? "admin" : "user",
        balance: currentTelegramId === "7689311203" ? "10.50" : "5.00",
        referred_by: "7689311203",
        referrals: currentTelegramId === "7689311203" ? 2 : 0,
        telegram_status: "verified" // অথবা unverified
      };

      // টেলিগ্রাম বট এপিআই দিয়ে চ্যানেল ও গ্রুপ মেম্বারশিপ চেক করার ফাংশন
      await checkTelegramVerification();
    }

    async function checkTelegramVerification() {
      try {
        const channelRes = await fetch(`https://api.telegram.org/bot${botToken}/getChatMember?chat_id=${channelUsername}&user_id=${currentTelegramId}`);
        const channelData = await channelRes.json();

        const groupRes = await fetch(`https://api.telegram.org/bot${botToken}/getChatMember?chat_id=${groupUsername}&user_id=${currentTelegramId}`);
        const groupData = await groupRes.json();

        const validStatuses = ['creator', 'administrator', 'member'];
        const isChannelJoined = channelData.ok && validStatuses.includes(channelData.result.status);
        const isGroupJoined = groupData.ok && validStatuses.includes(groupData.result.status);

        if (isChannelJoined && isGroupJoined) {
          currentUserData.telegram_status = 'verified';
          document.getElementById('verifyModal').classList.add('hidden');
          renderUserData();
        } else {
          currentUserData.telegram_status = 'unverified';
          document.getElementById('verifyModal').classList.remove('hidden');
        }
      } catch (err) {
        console.error("Verification check error, allowing bypass for offline/testing:", err);
        // নেটওয়ার্ক সমস্যা বা ফেচ এরর হলে ডেমো হিসেবে ভেরিফাইড ধরে রান করবে
        renderUserData();
      }
    }

    async function verifyMembership() {
      await checkTelegramVerification();
      if (currentUserData.telegram_status === 'verified') {
        document.getElementById('verifyModal').classList.add('hidden');
        renderUserData();
      } else {
        alert('আপনি এখনো চ্যানেল অথবা গ্রুপে সম্পূর্ণভাবে জয়েন করেননি! দয়া করে জয়েন করুন।');
      }
    }

    function renderUserData() {
      document.getElementById('userBalance').innerText = `$${parseFloat(currentUserData.balance).toFixed(2)}`;
      document.getElementById('totalRefs').innerText = currentUserData.referrals;
      document.getElementById('referredBy').innerText = currentUserData.referred_by || 'None';
      
      const botUsername = "alhuda_task_bot";
      const refLink = `https://t.me/${botUsername}?start=${currentUserData.telegram_id}`;
      document.getElementById('refLinkInput').value = refLink;
    }

    function copyRefLink() {
      const input = document.getElementById('refLinkInput');
      input.select();
      navigator.clipboard.writeText(input.value);
      alert('রেফারেল লিংক সফলভাবে কপি করা হয়েছে!');
    }

    // রোল সিস্টেম ও ড্যাশবোর্ড রিডাইরেক্ট লজিক
    function goToDashboard() {
      if (!currentUserData) return;
      
      if (currentUserData.role === 'admin') {
        // এডমিন হলে এডমিন ফোল্ডারের ইনডেক্স পেজে রিডাইরেক্ট হবে
        window.location.href = 'admin/index.html';
      } else {
        // সাধারণ ইউজার হলে ইউজার ড্যাশবোর্ড পেজে যাবে
        window.location.href = 'dashboard.html';
      }
    }
  </script>
</body>
</html>
