<header style="position: fixed; top: 0; left: 0; width: 100%; height: 65px; background: radial-gradient(circle at top, #1e1b4b, #0f172a); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-shadow: 0 4px 25px rgba(0,0,0,0.5);">
    
    <!-- বাম পাশের থ্রি-লাইন মেনু বাটন -->
    <div style="display: flex; align-items: center; cursor: pointer; padding: 8px;" onclick="toggleSidebar()">
        <div style="width: 24px; display: flex; flex-direction: column; gap: 5px;">
            <span style="height: 2.5px; width: 100%; background: #38bdf8; border-radius: 2px; box-shadow: 0 0 8px rgba(56,189,248,0.5);"></span>
            <span style="height: 2.5px; width: 75%; background: #38bdf8; border-radius: 2px; box-shadow: 0 0 8px rgba(56,189,248,0.5);"></span>
            <span style="height: 2.5px; width: 100%; background: #38bdf8; border-radius: 2px; box-shadow: 0 0 8px rgba(56,189,248,0.5);"></span>
        </div>
    </div>

    <!-- মাঝখানের বড় এবং ক্লাসিক ডিজাইনের নাম -->
    <div style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: 800; color: #f8fafc; font-size: 0.95rem; letter-spacing: 1px; text-transform: uppercase; font-family: 'Cinzel', 'Times New Roman', serif; text-shadow: 0 2px 12px rgba(56,189,248,0.4); white-space: nowrap; text-align: center; display: flex; align-items: center; gap: 6px;">
        <span>AL-HUDA</span> <span style="color: #38bdf8;">TECH GLOBAL</span>
    </div>

    <!-- ডান পাশের ব্যালেন্স অপশন বাদ দিয়ে ব্যালেন্স করার জন্য ফাঁকা স্পেস -->
    <div style="width: 32px;"></div>
</header>

<!-- স্লাইডিং সাইডবার (Drawer Menu) -->
<div id="app-sidebar" style="position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: #0f172a; border-right: 1px solid rgba(255,255,255,0.1); z-index: 2000; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.6);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
        <span style="font-weight: 800; color: #38bdf8; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;">Navigation Menu</span>
        <span style="color: #94a3b8; font-size: 1.2rem; cursor: pointer; font-weight: bold;" onclick="toggleSidebar()">✕</span>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="privacy.html" style="background: rgba(56, 189, 248, 0.1); color: #f8fafc; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.2); display: flex; align-items: center; gap: 10px; transition: background 0.2s;">
            🔒 Privacy Policy
        </a>
        <button onclick="logoutUser()" style="background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; width: 100%;">
            🚪 Logout
        </button>
    </div>
</div>

<!-- সাইডবার ব্যাকগ্রাউন্ড ওভারলে -->
<div id="sidebar-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1500; display: none; opacity: 0; transition: opacity 0.3s ease;" onclick="toggleSidebar()"></div>

<div style="height: 75px;"></div>

<script>
    // সাইডবার ওপেন ও ক্লোজ করার ফাংশন
    function toggleSidebar() {
        const sidebar = document.getElementById('app-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar.style.left === '0px') {
            sidebar.style.left = '-260px';
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        } else {
            overlay.style.display = 'block';
            setTimeout(() => { overlay.style.opacity = '1'; }, 10);
            sidebar.style.left = '0px';
        }
    }

    // লগআউট ফাংশন
    function logoutUser() {
        if(confirm('Are you sure you want to logout?')) {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    }
</script>
