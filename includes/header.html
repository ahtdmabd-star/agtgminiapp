<header style="position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
    
    <!-- বাম পাশের অংশ (ব্যালেন্সের জন্য জায়গা ব্যালেন্স করার লজিক) -->
    <div style="width: 80px; display: flex; align-items: center;"></div>

    <!-- মাঝখানের ক্লাসিক ও বড় নাম -->
    <div style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: 800; color: #f8fafc; font-size: 1.05rem; letter-spacing: 1px; text-transform: uppercase; font-family: 'Cinzel', 'Times New Roman', serif; text-shadow: 0 2px 10px rgba(56,189,248,0.3); white-space: nowrap;">
        AL-HUDA <span style="color: #38bdf8;">TECH</span>
    </div>

    <!-- ডান পাশের ব্যালেন্স বক্স -->
    <div style="background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 1px 4px rgba(56,189,248,0.2);">
        <span id="header-balance" style="color: #38bdf8;">0.00</span> <span style="color: #94a3b8; font-size: 0.72rem;">USD</span>
    </div>
</header>
<div style="height: 75px;"></div>

<script>
    (async function() {
        // লোকাল স্টোরেজ থেকে তাৎক্ষণিকভাবে আগের ব্যালেন্স দেখাবে যাতে লোডিংয়ের সময় ০ না দেখায়
        const cachedBalance = localStorage.getItem('user_balance');
        if (cachedBalance !== null) {
            document.getElementById('header-balance').innerText = parseFloat(cachedBalance).toFixed(2);
        }

        try {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
            }
            const telegramId = tg?.initDataUnsafe?.user?.id;

            if (telegramId) {
                // সার্ভার থেকে ইউজারের রিয়েল-টাইম ব্যালেন্স ফেচ করা
                const response = await fetch('/api/get-user-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                
                if (data.success && data.balance !== undefined) {
                    const currentBalance = parseFloat(data.balance);
                    document.getElementById('header-balance').innerText = currentBalance.toFixed(2);
                    // পরবর্তী পেজগুলোর জন্য লোকাল স্টোরেজে সেভ করে রাখা
                    localStorage.setItem('user_balance', currentBalance);
                }
            }
        } catch (error) {
            console.error("Failed to sync header balance:", error);
        }
    })();
</script>
