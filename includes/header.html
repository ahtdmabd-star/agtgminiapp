<header style="position: fixed; top: 0; left: 0; width: 100%; height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);">
    
    <!-- বাম পাশের থ্রি-লাইন মেনু বাটন -->
    <div style="display: flex; align-items: center; cursor: pointer;" onclick="toggleSidebar()">
        <div style="width: 24px; display: flex; flex-direction: column; gap: 5px;">
            <span style="height: 2.5px; width: 100%; background: #38bdf8; border-radius: 2px;"></span>
            <span style="height: 2.5px; width: 75%; background: #38bdf8; border-radius: 2px;"></span>
            <span style="height: 2.5px; width: 100%; background: #38bdf8; border-radius: 2px;"></span>
        </div>
    </div>

    <!-- মাঝখানের সম্পূর্ণ ও ক্লাসিক সাইজের নাম -->
    <div style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: 800; color: #f8fafc; font-size: 0.85rem; letter-spacing: 0.5px; text-transform: uppercase; font-family: 'Cinzel', 'Times New Roman', sans-serif; text-shadow: 0 2px 10px rgba(56,189,248,0.3); white-space: nowrap; text-align: center;">
        AL-HUDA <span style="color: #38bdf8;">TECH GLOBAL</span>
    </div>

    <!-- ডান পাশের ব্যালেন্স বক্স -->
    <div style="background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.3); padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; color: #f8fafc; display: flex; align-items: center; gap: 4px; box-shadow: inset 0 1px 4px rgba(56,189,248,0.2);">
        <span id="header-balance" style="color: #38bdf8;">0.00</span> <span style="color: #94a3b8; font-size: 0.68rem;">USD</span>
    </div>
</header>

<!-- স্লাইডিং সাইডবার (Drawer Menu) -->
<div id="app-sidebar" style="position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: #0f172a; border-right: 1px solid rgba(255,255,255,0.1); z-index: 2000; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.5);">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
        <span style="font-weight: 800; color: #38bdf8; font-size: 0.9rem; text-transform: uppercase;">Menu Options</span>
        <span style="color: #94a3b8; font-size: 1.2rem; cursor: pointer; font-weight: bold;" onclick="toggleSidebar()">✕</span>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 12px;">
        <a href="privacy.html" style="background: rgba(56, 189, 248, 0.1); color: #f8fafc; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(56, 189, 248, 0.2); display: flex; align-items: center; gap: 10px;">
            🔒 Privacy Policy
        </a>
        <button onclick="logoutUser()" style="background: rgba(239, 68, 68, 0.12); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px;">
            🚪 Logout
        </button>
    </div>
</div>

<!-- সাইডবার ব্যাকগ্রাউন্ড ওভারলে -->
<div id="sidebar-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1500; display: none; opacity: 0; transition: opacity 0.3s ease;" onclick="toggleSidebar()"></div>

<div style="height: 75px;"></div>

<script>
    // সাইডবার ওপেন/ক্লোজ করার ফাংশন
    function toggleSidebar() {
        const sidebar = document.getElementById('app-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        if (sidebar.style.left === '0px') {
            sidebar.style.left = '-260px';
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);
        } else {
            overlay.style.display = 'block';
            setTimeout(() => { overlay.style.opacity = '1'; }, 10);
            sidebar.style.left = '0px';
        }
    }

    // লগআউট ফাংশন
    function logoutUser() {
        if(confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('user_balance');
            localStorage.clear();
            window.location.href = 'index.html'; // লগআউটের পর রিডাইরেক্ট পেজ
        }
    }

    // ব্যালেন্স সিংক্রোনাইজেশন লজিক
    (async function() {
        // প্রথমে লোকাল স্টোরেজ থেকে ইনস্ট্যান্ট ব্যালেন্স লোড করা যাতে পেজ পাল্টানোর সময় জিরো না দেখায়
        const cachedBalance = localStorage.getItem('user_balance');
        if (cachedBalance !== null) {
            document.getElementById('header-balance').innerText = parseFloat(cachedBalance).toFixed(2);
        }

        try {
            const tg = window.Telegram?.WebApp;
            if (tg) {
                tg.ready();
            }
            const telegramId = tg?.initDataUnsafe?.user?.id;

            if (telegramId) {
                const response = await fetch('/api/get-user-balance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: telegramId })
                });
                const data = await response.json();
                
                if (data.success && data.balance !== undefined) {
                    const currentBalance = parseFloat(data.balance);
                    document.getElementById('header-balance').innerText = currentBalance.toFixed(2);
                    // সব পেজে সঠিক ব্যালেন্স দেখানোর জন্য লোকাল স্টোরেজে আপডেট করে রাখা
                    localStorage.setItem('user_balance', currentBalance);
                }
            }
        } catch (error) {
            console.error("Balance sync failed:", error);
        }
    })();
</script>
