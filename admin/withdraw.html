<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AL-HUDA TECH GLOBAL - Withdrawal Management</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#050914;
    color:#fff;
    min-height:100vh;
}

.container{
    max-width:850px;
    width:100%;
    margin:auto;
    padding:14px;
}

.header{
    background:rgba(17,28,50,.95);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:15px;
}

.logo{
    width:45px;
    height:45px;
    border-radius:13px;
    background:linear-gradient(135deg,#0c9de5,#086fa8);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    font-weight:800;
}

.title{
    flex:1;
}

.title h1{
    color:#48bbff;
    font-size:17px;
}

.title p{
    color:#8393a8;
    font-size:11px;
    margin-top:4px;
}

.back-btn,
.settings-btn{
    border:0;
    border-radius:10px;
    color:#fff;
    padding:10px 12px;
    cursor:pointer;
    font-weight:700;
}

.back-btn{
    background:#253248;
}

.settings-btn{
    background:#087eb9;
}

.toolbar{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.toolbar button{
    flex:1;
}

.card{
    background:rgba(17,28,50,.94);
    border:1px solid rgba(255,255,255,.07);
    border-radius:18px;
    padding:16px;
    margin-bottom:13px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.user-name{
    color:#fff;
    font-size:15px;
    font-weight:700;
}

.user-id{
    color:#74869c;
    font-size:11px;
    margin-top:4px;
}

.status{
    padding:5px 9px;
    border-radius:7px;
    background:#493811;
    color:#ffd86d;
    font-size:10px;
    text-transform:uppercase;
}

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:13px;
}

.info{
    background:#0a1423;
    border:1px solid #213249;
    border-radius:10px;
    padding:10px;
}

.info span{
    display:block;
    color:#73869d;
    font-size:10px;
    margin-bottom:4px;
}

.info strong{
    color:#dce7f4;
    font-size:12px;
    word-break:break-word;
}

.amount-box{
    margin-top:10px;
    background:#09273b;
    border:1px solid #15506f;
    border-radius:11px;
    padding:12px;
}

.amount-row{
    display:flex;
    justify-content:space-between;
    padding:5px 0;
    color:#93a8bc;
    font-size:12px;
}

.amount-row strong{
    color:#fff;
}

.net strong{
    color:#4bc4ff;
    font-size:15px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.actions button{
    flex:1;
    height:42px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

.approve{
    background:#108252;
}

.reject{
    background:#a8333c;
}

.actions button:disabled{
    opacity:.5;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#718399;
    font-size:13px;
}

.loading{
    text-align:center;
    color:#7e90a7;
    padding:25px;
}

.message{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:13px;
    font-size:13px;
}

.success{
    display:block;
    color:#65e4a1;
    background:#103b2a;
    border:1px solid #1f7651;
}

.error{
    display:block;
    color:#ff8d8d;
    background:#421b1b;
    border:1px solid #753333;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:999;
    overflow:auto;
    padding:18px;
}

.modal-box{
    max-width:520px;
    margin:35px auto;
    background:#101a2c;
    border:1px solid #283b55;
    border-radius:18px;
    padding:18px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-title{
    font-size:17px;
    font-weight:800;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:9px;
    background:#27364c;
    color:#fff;
    font-size:18px;
}

label{
    display:block;
    color:#9eafc2;
    font-size:12px;
    margin-bottom:7px;
}

input{
    width:100%;
    height:46px;
    border-radius:10px;
    border:1px solid #263852;
    background:#0a1423;
    color:#fff;
    padding:0 12px;
    outline:none;
    margin-bottom:14px;
}

input:focus{
    border-color:#159ddd;
}

.save-btn{
    width:100%;
    height:47px;
    border:0;
    border-radius:11px;
    background:#098bc9;
    color:#fff;
    font-weight:800;
}

.settings-note{
    background:#0a1423;
    border:1px solid #23344b;
    border-radius:10px;
    padding:11px;
    color:#788ba2;
    font-size:11px;
    line-height:1.5;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">A</div>

        <div class="title">
            <h1>AL-HUDA TECH GLOBAL</h1>
            <p>Withdrawal Management</p>
        </div>

        <button class="back-btn" onclick="goBack()">
            Back
        </button>

    </div>

    <div class="toolbar">

        <button class="settings-btn" onclick="openSettings()">
            Settings
        </button>

        <button class="back-btn" onclick="loadWithdrawals()">
            Refresh
        </button>

    </div>

    <div id="message" class="message"></div>

    <div id="withdrawalList">
        <div class="loading">
            Loading withdrawals...
        </div>
    </div>

</div>

<div id="settingsModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Withdrawal Settings
            </div>

            <button class="close" onclick="closeSettings()">
                ×
            </button>

        </div>

        <div class="settings-note">
            Changes made here will apply to new withdrawal requests.
            Existing withdrawal records keep their original rate and charge.
        </div>

        <label>Minimum Withdrawal (USD)</label>

        <input
            type="number"
            id="minWithdraw"
            min="0.01"
            step="0.01"
        >

        <label>USD to BDT Rate</label>

        <input
            type="number"
            id="usdRate"
            min="0.01"
            step="0.01"
        >

        <label>Withdrawal Charge (%)</label>

        <input
            type="number"
            id="chargePercent"
            min="0"
            max="100"
            step="0.01"
        >

        <button class="save-btn" onclick="saveSettings()">
            Save Settings
        </button>

    </div>

</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;

if (tg){
    tg.ready();
    tg.expand();
}

const telegramId =
    tg && tg.initDataUnsafe && tg.initDataUnsafe.user
        ? String(tg.initDataUnsafe.user.id)
        : "";

let currentSettings = {
    min_withdraw_usd:1,
    usd_to_bdt_rate:100,
    withdraw_charge_percent:5
};

function goBack(){

    if (history.length > 1){
        history.back();
    }else if(tg){
        tg.close();
    }
}

function showMessage(text,type){

    const box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.textContent = text;
}

function clearMessage(){

    const box =
        document.getElementById("message");

    box.className = "message";
    box.textContent = "";
}

async function api(url,options={}){

    const response =
        await fetch(url,{
            ...options,
            headers:{
                "Content-Type":"application/json",
                ...(options.headers || {})
            }
        });

    let data;

    try{
        data = await response.json();
    }catch(e){
        throw new Error("Invalid server response.");
    }

    if (!response.ok || data.success === false){
        throw new Error(
            data.message || "Request failed."
        );
    }

    return data;
}

async function loadWithdrawals(){

    clearMessage();

    const box =
        document.getElementById("withdrawalList");

    box.innerHTML =
        '<div class="loading">Loading withdrawals...</div>';

    try{

        const data =
            await api(
                "/api/admin/withdraw?action=list&telegram_id="
                + encodeURIComponent(telegramId)
            );

        const list =
            Array.isArray(data.withdrawals)
                ? data.withdrawals
                : [];

        if (data.settings){

            currentSettings = {
                min_withdraw_usd:
                    Number(data.settings.min_withdraw_usd) || 1,

                usd_to_bdt_rate:
                    Number(data.settings.usd_to_bdt_rate) || 100,

                withdraw_charge_percent:
                    Number(data.settings.withdraw_charge_percent) || 5
            };

            fillSettings();
        }

        if (!list.length){

            box.innerHTML =
                '<div class="card">' +
                '<div class="empty">No withdrawal requests found.</div>' +
                '</div>';

            return;
        }

        box.innerHTML =
            list.map(renderWithdrawal).join("");

    }catch(error){

        box.innerHTML = "";

        showMessage(error.message,"error");
    }
}

function renderWithdrawal(item){

    const status =
        String(item.status || "pending").toLowerCase();

    const isPending =
        status === "pending";

    const actionHtml =
        isPending
        ? `
            <div class="actions">

                <button
                    class="approve"
                    onclick="processWithdrawal(${Number(item.id)},'approve')"
                >
                    Approve
                </button>

                <button
                    class="reject"
                    onclick="processWithdrawal(${Number(item.id)},'reject')"
                >
                    Reject
                </button>

            </div>
          `
        : `
            <div style="
                margin-top:12px;
                text-align:center;
                color:#71849a;
                font-size:12px;
            ">
                This request has already been ${escapeHtml(status)}.
            </div>
          `;

    return `
        <div class="card">

            <div class="card-top">

                <div>
                    <div class="user-name">
                        ${escapeHtml(
                            item.username ||
                            item.first_name ||
                            "User"
                        )}
                    </div>

                    <div class="user-id">
                        Telegram ID:
                        ${escapeHtml(item.telegram_id || "")}
                    </div>
                </div>

                <div class="status">
                    ${escapeHtml(status)}
                </div>

            </div>

            <div class="info-grid">

                <div class="info">
                    <span>Method</span>
                    <strong>
                        ${escapeHtml(item.method || "")}
                    </strong>
                </div>

                <div class="info">
                    <span>Account / Wallet</span>
                    <strong>
                        ${escapeHtml(item.account_number || "")}
                    </strong>
                </div>

                <div class="info">
                    <span>USD Amount</span>
                    <strong>
                        $${Number(item.amount_usd || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="info">
                    <span>USD → BDT Rate</span>
                    <strong>
                        ৳${Number(item.usd_to_bdt_rate || 0).toFixed(2)}
                    </strong>
                </div>

            </div>

            <div class="amount-box">

                <div class="amount-row">
                    <span>Gross BDT</span>
                    <strong>
                        ৳${Number(item.gross_bdt || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="amount-row">
                    <span>
                        Charge (${Number(item.charge_percent || 0).toFixed(2)}%)
                    </span>

                    <strong>
                        ৳${Number(item.charge_bdt || 0).toFixed(2)}
                    </strong>
                </div>

                <div class="amount-row net">
                    <span>Net Amount</span>
                    <strong>
                        ৳${Number(item.net_bdt || 0).toFixed(2)}
                    </strong>
                </div>

            </div>

            ${actionHtml}

        </div>
    `;
}

async function processWithdrawal(id,action){

    if (!id){
        return;
    }

    const text =
        action === "approve"
            ? "Approve this withdrawal request?"
            : "Reject this withdrawal request?";

    if (!confirm(text)){
        return;
    }

    try{

        await api("/api/admin/withdraw",{
            method:"POST",

            body:JSON.stringify({
                action:"process",
                telegram_id:telegramId,
                withdrawal_id:id,
                decision:action
            })
        });

        showMessage(
            action === "approve"
                ? "Withdrawal approved successfully."
                : "Withdrawal rejected successfully.",
            "success"
        );

        await loadWithdrawals();

    }catch(error){

        showMessage(error.message,"error");
    }
}

function fillSettings(){

    document.getElementById("minWithdraw").value =
        Number(
            currentSettings.min_withdraw_usd
        ).toFixed(2);

    document.getElementById("usdRate").value =
        Number(
            currentSettings.usd_to_bdt_rate
        ).toFixed(2);

    document.getElementById("chargePercent").value =
        Number(
            currentSettings.withdraw_charge_percent
        ).toFixed(2);
}

async function openSettings(){

    try{

        const data =
            await api(
                "/api/admin/withdraw?action=settings&telegram_id="
                + encodeURIComponent(telegramId)
            );

        if (data.settings){

            currentSettings = data.settings;
            fillSettings();
        }

        document.getElementById("settingsModal")
            .style.display = "block";

    }catch(error){

        showMessage(error.message,"error");
    }
}

function closeSettings(){

    document.getElementById("settingsModal")
        .style.display = "none";
}

async function saveSettings(){

    const min =
        Number(
            document.getElementById("minWithdraw").value
        );

    const rate =
        Number(
            document.getElementById("usdRate").value
        );

    const charge =
        Number(
            document.getElementById("chargePercent").value
        );

    if (!Number.isFinite(min) || min <= 0){
        showMessage(
            "Minimum withdrawal must be greater than 0.",
            "error"
        );
        return;
    }

    if (!Number.isFinite(rate) || rate <= 0){
        showMessage(
            "USD to BDT rate must be greater than 0.",
            "error"
        );
        return;
    }

    if (
        !Number.isFinite(charge) ||
        charge < 0 ||
        charge > 100
    ){
        showMessage(
            "Charge must be between 0 and 100.",
            "error"
        );
        return;
    }

    try{

        await api("/api/admin/withdraw",{
            method:"POST",

            body:JSON.stringify({
                action:"settings",
                telegram_id:telegramId,
                min_withdraw_usd:min,
                usd_to_bdt_rate:rate,
                withdraw_charge_percent:charge
            })
        });

        currentSettings = {
            min_withdraw_usd:min,
            usd_to_bdt_rate:rate,
            withdraw_charge_percent:charge
        };

        closeSettings();

        showMessage(
            "Withdrawal settings updated successfully.",
            "success"
        );

        await loadWithdrawals();

    }catch(error){

        showMessage(error.message,"error");
    }
}

function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

document.getElementById("settingsModal")
    .addEventListener("click",function(e){

        if (e.target === this){
            closeSettings();
        }

    });

loadWithdrawals();
</script>

</body>
</html>
