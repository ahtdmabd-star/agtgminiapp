<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AL-HUDA TECH GLOBAL - Withdrawal Management</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050914;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

.container{
    max-width:850px;
    margin:auto;
    padding:30px 18px;
}

.header-card{
    background:#101a2e;
    border:1px solid #253652;
    border-radius:20px;
    padding:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:56px;
    height:56px;
    border-radius:16px;
    background:linear-gradient(
        135deg,
        #0ba6e7,
        #087fc0
    );
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
}

.brand h1{
    font-size:20px;
    color:#38baff;
}

.brand p{
    color:#8593a8;
    font-size:13px;
    margin-top:5px;
}

.back{
    background:#29374e;
    color:#fff;
    border:0;
    padding:11px 18px;
    border-radius:12px;
    font-weight:700;
    cursor:pointer;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0;
}

.action{
    height:50px;
    border:0;
    border-radius:13px;
    background:#28364d;
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
}

.action.primary{
    background:#099bd5;
}

.message{
    display:none;
    padding:14px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:14px;
}

.message.error{
    display:block;
    background:#481f24;
    border:1px solid #79343b;
    color:#ff9da4;
}

.message.success{
    display:block;
    background:#103b2d;
    border:1px solid #1d6a4e;
    color:#69e5b0;
}

.card{
    background:#101a2e;
    border:1px solid #263753;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
}

.method{
    color:#32baff;
    font-size:17px;
    font-weight:800;
}

.pending{
    background:#493d12;
    color:#ffd95d;
    padding:6px 10px;
    border-radius:8px;
    font-size:11px;
    font-weight:800;
}

.info{
    background:#0a1322;
    border:1px solid #243550;
    border-radius:13px;
    padding:12px;
}

.line{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:6px 0;
    color:#8e9caf;
    font-size:13px;
}

.line strong{
    color:#fff;
    text-align:right;
    word-break:break-word;
}

.actions-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:13px;
}

.approve,
.reject{
    height:45px;
    border:0;
    border-radius:11px;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

.approve{
    background:#087e58;
}

.reject{
    background:#a92e3c;
}

.empty{
    text-align:center;
    padding:50px 20px;
    color:#8492a6;
}

.loading{
    text-align:center;
    padding:40px;
    color:#8595aa;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.78);
    padding:18px;
    overflow:auto;
}

.modal-box{
    width:100%;
    max-width:520px;
    margin:30px auto;
    background:#101a2e;
    border:1px solid #2a3d5a;
    border-radius:20px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.modal-header h2{
    font-size:19px;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#29374e;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#ccd7e4;
    font-size:13px;
    font-weight:700;
}

.form-group input,
.form-group textarea{
    width:100%;
    border:1px solid #30415d;
    background:#0a1322;
    color:#fff;
    border-radius:11px;
    padding:13px;
    outline:none;
    font-size:14px;
}

.form-group textarea{
    min-height:85px;
    resize:vertical;
}

.save{
    width:100%;
    height:48px;
    border:0;
    border-radius:12px;
    background:#099bd4;
    color:#fff;
    font-weight:800;
    cursor:pointer;
}

@media(max-width:550px){

    .container{
        padding:18px 12px;
    }

    .header-card{
        padding:15px;
    }

    .brand h1{
        font-size:17px;
    }

    .logo{
        width:48px;
        height:48px;
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:15px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header-card">

        <div class="brand">

            <div class="logo">
                A
            </div>

            <div>
                <h1>
                    AL-HUDA TECH GLOBAL
                </h1>

                <p>
                    Withdrawal Management
                </p>
            </div>

        </div>

        <button
            class="back"
            onclick="goBack()">
            Back
        </button>

    </div>


    <div class="actions">

        <button
            class="action primary"
            onclick="openSettings()">
            Settings
        </button>

        <button
            class="action"
            onclick="loadWithdrawals()">
            Refresh
        </button>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <div id="withdrawals">
        <div class="loading">
            Loading withdrawal requests...
        </div>
    </div>

</div>


<!-- SETTINGS MODAL -->

<div
    id="settingsModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>
                Withdrawal Settings
            </h2>

            <button
                class="close"
                onclick="closeSettings()">
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                Minimum Withdrawal (USD)
            </label>

            <input
                id="minimum"
                type="number"
                min="0.01"
                step="0.01">

        </div>


        <div class="form-group">

            <label>
                USD to BDT Rate
            </label>

            <input
                id="rate"
                type="number"
                min="0.01"
                step="0.01">

        </div>


        <div class="form-group">

            <label>
                Withdrawal Charge (%)
            </label>

            <input
                id="charge"
                type="number"
                min="0"
                max="100"
                step="0.01">

        </div>


        <button
            class="save"
            onclick="saveSettings()">
            Save Settings
        </button>

    </div>

</div>


<!-- PROCESS MODAL -->

<div
    id="processModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2 id="processTitle">
                Process Withdrawal
            </h2>

            <button
                class="close"
                onclick="closeProcess()">
                ×
            </button>

        </div>


        <div class="form-group">

            <label>
                Admin Note
            </label>

            <textarea
                id="adminNote"
                placeholder="Optional note">
            </textarea>

        </div>


        <button
            id="processButton"
            class="save">
            Confirm
        </button>

    </div>

</div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if(tg){
    tg.ready();
    tg.expand();
}


const API =
    "/api/withdraw";


let adminId = "";

let selectedWithdrawalId = 0;

let selectedAction = "";


function getTelegramId(){

    if(
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ){
        return String(
            tg.initDataUnsafe.user.id
        );
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("telegram_id") ||
        ""
    );
}


function goBack(){

    if(
        document.referrer &&
        new URL(
            document.referrer
        ).origin ===
        window.location.origin
    ){
        window.history.back();
        return;
    }

    window.location.href = "/";
}


function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;
}


async function loadWithdrawals(){

    const box =
        document.getElementById(
            "withdrawals"
        );

    box.innerHTML =
        `<div class="loading">
            Loading withdrawal requests...
        </div>`;


    try {

        if(!adminId){

            throw new Error(
                "Admin Telegram account was not found."
            );
        }


        const response =
            await fetch(
                `${API}?action=admin-list&telegram_id=${encodeURIComponent(adminId)}`,
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                `Server returned HTTP ${response.status}.`
            );
        }


        renderWithdrawals(
            data.withdrawals || []
        );


    } catch(error){

        box.innerHTML =
            `<div class="message error">
                ${escapeHtml(
                    error.message
                )}
            </div>`;
    }
}


function renderWithdrawals(rows){

    const box =
        document.getElementById(
            "withdrawals"
        );

    if(!rows.length){

        box.innerHTML =
            `<div class="empty">
                No pending withdrawal requests.
            </div>`;

        return;
    }


    box.innerHTML =
        rows.map(row => {

            const crypto =
                row.method ===
                    "USDT-BEP20" ||
                row.method ===
                    "USDT-TRC20";


            return `
                <div
                    class="card"
                    id="withdrawal-${Number(row.id)}">

                    <div class="card-top">

                        <div class="method">
                            ${escapeHtml(
                                row.method
                            )}
                        </div>

                        <div class="pending">
                            PENDING
                        </div>

                    </div>


                    <div class="info">

                        <div class="line">
                            <span>User ID</span>
                            <strong>
                                ${escapeHtml(
                                    row.telegram_id
                                )}
                            </strong>
                        </div>

                        <div class="line">
                            <span>
                                ${crypto
                                    ? "Wallet Address"
                                    : "Account Number"}
                            </span>

                            <strong>
                                ${escapeHtml(
                                    row.account_number
                                )}
                            </strong>
                        </div>

                        <div class="line">
                            <span>USD Amount</span>

                            <strong>
                                $${Number(
                                    row.amount_usd
                                ).toFixed(2)}
                            </strong>
                        </div>

                        <div class="line">
                            <span>Rate</span>

                            <strong>
                                1 USD = ৳${Number(
                                    row.usd_to_bdt_rate
                                ).toFixed(2)}
                            </strong>
                        </div>

                        <div class="line">
                            <span>Gross BDT</span>

                            <strong>
                                ৳${Number(
                                    row.gross_bdt
                                ).toFixed(2)}
                            </strong>
                        </div>

                        <div class="line">
                            <span>Charge</span>

                            <strong>
                                ${Number(
                                    row.charge_percent
                                ).toFixed(2)}%
                                -
                                ৳${Number(
                                    row.charge_bdt
                                ).toFixed(2)}
                            </strong>
                        </div>

                        <div class="line">
                            <span>Net BDT</span>

                            <strong>
                                ৳${Number(
                                    row.net_bdt
                                ).toFixed(2)}
                            </strong>
                        </div>

                        <div class="line">
                            <span>Created</span>

                            <strong>
                                ${escapeHtml(
                                    formatDate(
                                        row.created_at
                                    )
                                )}
                            </strong>
                        </div>

                    </div>


                    <div class="actions-row">

                        <button
                            class="approve"
                            onclick="openProcess(
                                ${Number(row.id)},
                                'approve'
                            )">
                            Approve
                        </button>

                        <button
                            class="reject"
                            onclick="openProcess(
                                ${Number(row.id)},
                                'reject'
                            )">
                            Reject
                        </button>

                    </div>

                </div>
            `;

        }).join("");
}


function openProcess(
    id,
    action
){

    selectedWithdrawalId =
        Number(id);

    selectedAction =
        action;


    document.getElementById(
        "processTitle"
    ).textContent =
        action === "approve"
            ? "Approve Withdrawal"
            : "Reject Withdrawal";


    document.getElementById(
        "processButton"
    ).textContent =
        action === "approve"
            ? "Confirm Approval"
            : "Confirm Rejection";


    document.getElementById(
        "adminNote"
    ).value = "";


    document.getElementById(
        "processModal"
    ).style.display =
        "block";
}


function closeProcess(){

    document.getElementById(
        "processModal"
    ).style.display =
        "none";

    selectedWithdrawalId = 0;
    selectedAction = "";
}


document.getElementById(
    "processButton"
).addEventListener(
    "click",
    processWithdrawal
);


async function processWithdrawal(){

    if(
        !selectedWithdrawalId ||
        !selectedAction
    ){
        return;
    }


    const button =
        document.getElementById(
            "processButton"
        );

    const note =
        document.getElementById(
            "adminNote"
        ).value.trim();


    button.disabled = true;
    button.textContent =
        "Processing...";


    try {

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        action:
                            "admin-process",

                        telegram_id:
                            adminId,

                        withdrawal_id:
                            selectedWithdrawalId,

                        process_action:
                            selectedAction,

                        admin_note:
                            note
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                `Server returned HTTP ${response.status}.`
            );
        }


        closeProcess();


        showMessage(
            data.message ||
            "Withdrawal processed successfully.",
            "success"
        );


        /*
        Reload the pending list.
        Because the processed request is no longer
        pending, its buttons disappear automatically.
        */

        await loadWithdrawals();


    } catch(error){

        showMessage(
            error.message ||
            "Unable to process withdrawal.",
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            selectedAction === "approve"
                ? "Confirm Approval"
                : "Confirm Rejection";
    }
}


async function openSettings(){

    try {

        const response =
            await fetch(
                `${API}?action=admin-settings-get&telegram_id=${encodeURIComponent(adminId)}`,
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load settings."
            );
        }


        document.getElementById(
            "minimum"
        ).value =
            Number(
                data.settings.min_withdraw_usd
            ).toFixed(2);


        document.getElementById(
            "rate"
        ).value =
            Number(
                data.settings.usd_to_bdt_rate
            ).toFixed(2);


        document.getElementById(
            "charge"
        ).value =
            Number(
                data.settings.withdraw_charge_percent
            ).toFixed(2);


        document.getElementById(
            "settingsModal"
        ).style.display =
            "block";


    } catch(error){

        showMessage(
            error.message ||
            "Unable to load settings.",
            "error"
        );
    }
}


function closeSettings(){

    document.getElementById(
        "settingsModal"
    ).style.display =
        "none";
}


async function saveSettings(){

    const minimum =
        Number(
            document.getElementById(
                "minimum"
            ).value
        );

    const rate =
        Number(
            document.getElementById(
                "rate"
            ).value
        );

    const charge =
        Number(
            document.getElementById(
                "charge"
            ).value
        );


    if(
        !Number.isFinite(minimum) ||
        minimum <= 0
    ){

        showMessage(
            "Invalid minimum withdrawal.",
            "error"
        );

        return;
    }


    if(
        !Number.isFinite(rate) ||
        rate <= 0
    ){

        showMessage(
            "Invalid USD to BDT rate.",
            "error"
        );

        return;
    }


    if(
        !Number.isFinite(charge) ||
        charge < 0 ||
        charge > 100
    ){

        showMessage(
            "Charge must be between 0 and 100.",
            "error"
        );

        return;
    }


    const button =
        document.querySelector(
            ".save"
        );

    button.disabled = true;
    button.textContent =
        "Saving...";


    try {

        const response =
            await fetch(
                API,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        action:
                            "admin-settings-update",

                        telegram_id:
                            adminId,

                        min_withdraw_usd:
                            minimum,

                        usd_to_bdt_rate:
                            rate,

                        withdraw_charge_percent:
                            charge
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                `Server returned HTTP ${response.status}.`
            );
        }


        closeSettings();


        showMessage(
            "Withdrawal settings updated successfully.",
            "success"
        );


        await loadWithdrawals();


    } catch(error){

        showMessage(
            error.message ||
            "Unable to save settings.",
            "error"
        );

    } finally {

        button.disabled = false;
        button.textContent =
            "Save Settings";
    }
}


function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return String(value);
    }

    return date.toLocaleString();
}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


window.addEventListener(
    "click",
    function(event){

        const settings =
            document.getElementById(
                "settingsModal"
            );

        const process =
            document.getElementById(
                "processModal"
            );

        if(event.target === settings){
            closeSettings();
        }

        if(event.target === process){
            closeProcess();
        }
    }
);


adminId =
    getTelegramId();

loadWithdrawals();

</script>

</body>
</html>
