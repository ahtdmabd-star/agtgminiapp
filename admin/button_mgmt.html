<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AL-HUDA TECH GLOBAL | Button Management</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#071321;--card:#0d1d30;--card2:#10243b;--blue:#2f81ff;--green:#22c55e;--red:#ef4444;--text:#f5f8fc;--muted:#718198;--border:rgba(148,163,184,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg)}body{font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow-x:hidden}.app{max-width:560px;min-height:100vh;margin:auto;padding:10px 14px 28px;background:radial-gradient(circle at 10% 0%,rgba(47,129,255,.08),transparent 30%),linear-gradient(180deg,#071321,#081726)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;padding:7px 0 10px;background:rgba(7,19,33,.94);backdrop-filter:blur(12px)}.navbtn{width:36px;height:36px;flex:0 0 36px;display:flex;align-items:center;justify-content:center;color:#dceaff;background:#0c2037;border:1px solid rgba(47,129,255,.18);border-radius:10px;text-decoration:none;cursor:pointer}.navbtn:active{transform:scale(.985)}.navbtn svg{width:18px;height:18px;stroke:currentColor}.brand{min-width:0;flex:1}.brand b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:7px}

.header-action{display:flex;justify-content:space-between;align-items:center;margin:12px 0;}
.btn-primary{background:linear-gradient(135deg,#2878e8,#165fc4);color:#fff;border:none;padding:9px 14px;border-radius:10px;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn-primary:active{transform:scale(.98)}

.list-container{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.item-card{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:linear-gradient(145deg,rgba(14,31,51,.98),rgba(9,24,41,.98));border:1px solid var(--border);border-radius:14px;gap:10px}
.item-info{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.item-icon{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;background:#0d2746;border:1px solid rgba(47,129,255,.16);border-radius:11px;color:#62a6ff;font-size:16px}
.item-details{min-width:0;flex:1}
.item-details strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-details span{display:block;margin-top:2px;color:var(--muted);font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.item-actions{display:flex;align-items:center;gap:6px}
.action-btn{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:#0b1e33;color:#dceaff;cursor:pointer;font-size:12px}
.action-btn.edit{color:#3b82f6}
.action-btn.delete{color:#ef4444}
.action-btn:active{transform:scale(.95)}

/* Modal Styles */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(4px)}
.modal.active{display:flex}
.modal-content{width:100%;max-width:440px;background:#0d1d30;border:1px solid rgba(47,129,255,.25);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-header h3{margin:0;font-size:14px}
.close-modal{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}

.form-group{margin-bottom:11px}
.form-group label{display:block;font-size:9px;font-weight:800;color:var(--muted);margin-bottom:4px;text-transform:uppercase}
.form-control{width:100%;background:#071321;border:1px solid var(--border);border-radius:10px;padding:10px;color:#fff;font-size:11px}
.form-control:focus{border-color:var(--blue);outline:none}

.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn-secondary{background:#10243b;border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:9px;font-size:11px;cursor:pointer}
.footer{text-align:center;padding:18px 0 5px;margin-top:20px}.line{height:1px;margin-bottom:10px;background:linear-gradient(90deg,transparent,rgba(75,110,145,.25),transparent)}.footer b{color:#8ebcff;font-size:7.5px}.footer span{display:block;margin-top:4px;color:#62758b;font-size:6.5px}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="navbtn" onclick="goBack()" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
<div class="brand"><b>Button Management</b><span>Admin Control Center</span></div>
</header>

<div class="header-action">
  <div style="font-size:11px; color:var(--muted);">Manage user dashboard buttons & tasks</div>
  <button class="btn-primary" onclick="openAddModal()"><i class="fa-solid fa-plus"></i> Add New Button</button>
</div>

<div class="list-container" id="buttonList">
  <!-- Dynamic buttons list loaded via JS -->
</div>

<footer class="footer"><div class="line"></div><b>AL-HUDA TECH GLOBAL</b><span>Admin Management Panel</span></footer>
</div>

<!-- Add/Edit Modal -->
<div class="modal" id="buttonModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Add New Button</h3>
      <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="buttonForm" onsubmit="saveButton(event)">
      <input type="hidden" id="buttonId">
      <div class="form-group">
        <label>Button Name</label>
        <input type="text" class="form-control" id="buttonName" placeholder="e.g. Daily Tasks" required>
      </div>
      <div class="form-group">
        <label>FontAwesome Icon Class</label>
        <input type="text" class="form-control" id="buttonIcon" placeholder="e.g. fa-solid fa-bolt" required>
      </div>
      <div class="form-group">
        <label>Action Link / URL</label>
        <input type="text" class="form-control" id="buttonAction" placeholder="e.g. /tasks.html" required>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save Button</button>
      </div>
    </form>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
if(tg.setHeaderColor) tg.setHeaderColor('#071321');
if(tg.setBackgroundColor) tg.setBackgroundColor('#071321');

const params = new URLSearchParams(window.location.search);
let tgId = params.get('tg_id');
if(!tgId && tg.initDataUnsafe && tg.initDataUnsafe.user) tgId = tg.initDataUnsafe.user.id;

function goBack(){
    window.location.href = `dashboard.html?tg_id=${tgId||''}`;
}

if(tg.BackButton){
    tg.BackButton.show();
    tg.BackButton.onClick(goBack);
}

// Fetch and load buttons
async function loadButtons() {
    const listContainer = document.getElementById('buttonList');
    listContainer.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;">Loading buttons...</div>';
    
    try {
        const response = await fetch(`/api/buttons/list?tg_id=${tgId}`);
        const result = await response.json();
        
        if(result.success && result.data && result.data.length > 0){
            listContainer.innerHTML = result.data.map(btn => `
                <div class="item-card">
                    <div class="item-info">
                        <div class="item-icon"><i class="${btn.button_icon || 'fa-solid fa-bolt'}"></i></div>
                        <div class="item-details">
                            <strong>${escapeHtml(btn.button_name)}</strong>
                            <span>Action: ${escapeHtml(btn.button_action)}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn edit" onclick='editButton(${JSON.stringify(btn)})' title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button class="action-btn delete" onclick="deleteButton('${btn.id}')" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        } else {
            listContainer.innerHTML = '<div style="text-align:center;color:var(--muted);padding:20px;font-size:11px;">No buttons found. Add your first button!</div>';
        }
    } catch(e) {
        console.error(e);
        listContainer.innerHTML = '<div style="text-align:center;color:var(--red);padding:20px;font-size:11px;">Failed to load buttons.</div>';
    }
}

function openAddModal() {
    document.getElementById('modalTitle').textContent = 'Add New Button';
    document.getElementById('buttonId').value = '';
    document.getElementById('buttonName').value = '';
    document.getElementById('buttonIcon').value = '';
    document.getElementById('buttonAction').value = '';
    document.getElementById('buttonModal').classList.add('active');
}

function editButton(btn) {
    document.getElementById('modalTitle').textContent = 'Edit Button';
    document.getElementById('buttonId').value = btn.id;
    document.getElementById('buttonName').value = btn.button_name;
    document.getElementById('buttonIcon').value = btn.button_icon;
    document.getElementById('buttonAction').value = btn.button_action;
    document.getElementById('buttonModal').classList.add('active');
}

function closeModal() {
    document.getElementById('buttonModal').classList.remove('active');
}

async function saveButton(e) {
    e.preventDefault();
    const id = document.getElementById('buttonId').value;
    const button_name = document.getElementById('buttonName').value;
    const button_icon = document.getElementById('buttonIcon').value;
    const button_action = document.getElementById('buttonAction').value;

    const endpoint = id ? '/api/buttons/update' : '/api/buttons/add';
    
    try {
        const res = await fetch(endpoint, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ tg_id: tgId, id, button_name, button_icon, button_action })
        });
        const result = await res.json();
        if(result.success) {
            closeModal();
            loadButtons();
        } else {
            alert(result.message || 'Operation failed');
        }
    } catch(err) {
        console.error(err);
        alert('Server communication error.');
    }
}

async function deleteButton(id) {
    if(!confirm('Are you sure you want to delete this button?')) return;
    
    try {
        const res = await fetch('/api/buttons/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ tg_id: tgId, id })
        });
        const result = await res.json();
        if(result.success) {
            loadButtons();
        } else {
            alert(result.message || 'Failed to delete');
        }
    } catch(err) {
        console.error(err);
        alert('Server communication error.');
    }
}

function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', loadButtons);
</script>
</body>
</html>
