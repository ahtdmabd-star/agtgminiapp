<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#071321">
<title>Account Management | AL-HUDA TECH GLOBAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#071321;--card:#0d1d30;--card2:#10243b;--input:#071522;--primary:#2f81ff;--blue:#62a6ff;--green:#35d39a;--red:#ff6472;--text:#f5f8fc;--muted:#718399;--muted2:#9aabc0;--border:rgba(148,163,184,.14);--blueborder:rgba(47,129,255,.2);--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}html,body{min-height:100%;background:var(--bg)}body{color:var(--text);font-family:Arial,"Segoe UI",sans-serif;overflow-x:hidden}button,input{font:inherit}button{border:0;outline:0}.app{width:100%;max-width:560px;min-height:100vh;margin:auto;padding:10px 14px 24px;background:radial-gradient(circle at 15% 0%,rgba(47,129,255,.09),transparent 30%),linear-gradient(180deg,#071321,#081725)}
.top-header{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:9px;padding:7px 0 11px;background:rgba(7,19,33,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.header-btn{width:37px;height:37px;flex:0 0 37px;display:flex;align-items:center;justify-content:center;color:#dceaff;background:#0c2037;border:1px solid var(--blueborder);border-radius:11px;cursor:pointer;text-decoration:none;transition:.18s}.header-btn:hover{background:#122c49}.header-btn:active{transform:scale(.95)}.header-btn svg{width:18px;height:18px;stroke:currentColor}.brand{min-width:0;flex:1}.brand-title{color:#f7fbff;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand-subtitle{margin-top:3px;color:var(--muted);font-size:7px}
.page-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.page-btn{min-height:38px;display:flex;align-items:center;justify-content:center;gap:7px;color:#dceaff;background:#0b1e33;border:1px solid var(--border);border-radius:10px;text-decoration:none;cursor:pointer;font-size:8px;font-weight:800;transition:.18s}.page-btn:hover{background:#102844;border-color:rgba(47,129,255,.3)}.page-btn:active{transform:scale(.985)}.page-btn.primary{color:#fff;background:linear-gradient(135deg,#2878e8,#165fc4);border-color:rgba(115,174,255,.22)}.page-btn svg{width:15px;height:15px;stroke:currentColor}
.page-heading{display:flex;align-items:center;gap:10px;margin:3px 0 12px}.page-heading-icon{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;background:#0d2746;border:1px solid rgba(47,129,255,.18);border-radius:12px}.page-heading-icon svg{width:21px;height:21px;stroke:var(--blue)}.page-heading h1{font-size:15px;font-weight:800}.page-heading p{margin-top:4px;color:var(--muted);font-size:7px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.stat-card{min-height:86px;display:flex;align-items:center;gap:10px;padding:11px;background:linear-gradient(145deg,rgba(15,35,58,.98),rgba(9,25,42,.98));border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 22px rgba(0,0,0,.13)}.stat-icon{width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:rgba(47,129,255,.09);border:1px solid rgba(47,129,255,.16);border-radius:11px}.stat-icon svg{width:18px;height:18px;stroke:var(--blue)}.stat-content{min-width:0}.stat-label{color:var(--muted);font-size:6.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}.stat-value{margin-top:4px;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-description{margin-top:5px;color:#718399;font-size:6.2px}
.profit-card{position:relative;overflow:hidden;padding:13px;margin-bottom:14px;background:linear-gradient(135deg,rgba(19,42,70,.98),rgba(10,26,44,.98));border:1px solid var(--border);border-radius:var(--radius)}.profit-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--primary)}.profit-top{display:flex;align-items:center;justify-content:space-between}.profit-label{color:var(--muted2);font-size:7px;font-weight:800;text-transform:uppercase}.profit-status{padding:4px 7px;color:#79b4ff;background:rgba(47,129,255,.07);border:1px solid rgba(47,129,255,.14);border-radius:7px;font-size:6px;font-weight:800}.profit-value{margin-top:6px;font-size:21px;font-weight:800}.profit{color:var(--green)}.loss{color:var(--red)}
.section-title{display:flex;align-items:center;gap:8px;margin:16px 0 9px}.section-title-icon{width:31px;height:31px;display:flex;align-items:center;justify-content:center;background:#0c2340;border:1px solid rgba(47,129,255,.15);border-radius:9px}.section-title-icon svg{width:15px;height:15px;stroke:var(--blue)}.section-title-text strong{display:block;font-size:10px;font-weight:800}.section-title-text span{display:block;margin-top:3px;color:var(--muted);font-size:6.5px}
.wallet-list{display:flex;flex-direction:column;gap:8px}.wallet-card{min-height:66px;display:flex;align-items:center;gap:9px;padding:9px 10px;background:linear-gradient(145deg,rgba(14,31,51,.98),rgba(9,24,41,.98));border:1px solid var(--border);border-radius:13px;box-shadow:0 7px 19px rgba(0,0,0,.1)}.wallet-icon{width:37px;height:37px;flex:0 0 37px;display:flex;align-items:center;justify-content:center;background:#0d2746;border:1px solid rgba(47,129,255,.15);border-radius:10px}.wallet-icon svg{width:18px;height:18px;stroke:#62a6ff}.wallet-info{min-width:0;flex:1}.wallet-info h4{font-size:9px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wallet-info span{display:block;margin-top:4px;color:#62a6ff;font-size:10px;font-weight:800}.wallet-actions{display:flex;gap:5px}.action-btn{width:33px;height:33px;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;transition:.18s}.action-btn:active{transform:scale(.94)}.action-btn svg{width:16px;height:16px;stroke:currentColor}.btn-plus{color:#54dfaa;background:rgba(53,211,154,.13);border:1px solid rgba(53,211,154,.2)}.btn-minus{color:#ff7180;background:rgba(255,100,114,.11);border:1px solid rgba(255,100,114,.19)}
.total-box{min-height:63px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;margin-top:10px;margin-bottom:15px;background:#0b1d31;border:1px solid var(--border);border-radius:13px}.total-left{display:flex;align-items:center;gap:8px;min-width:0}.total-icon{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;background:rgba(53,211,154,.08);border:1px solid rgba(53,211,154,.13);border-radius:9px}.total-icon svg{width:15px;height:15px;stroke:#52dda8}.total-label{color:var(--muted2);font-size:7px;font-weight:800}.total-sub{margin-top:3px;color:var(--muted);font-size:6px}.total-value{color:var(--green);font-size:15px;font-weight:800;white-space:nowrap}
.loading,.error-msg{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:#0c1d30;border:1px solid var(--border);border-radius:var(--radius)}.loading-spinner{width:34px;height:34px;margin-bottom:11px;border:3px solid rgba(98,166,255,.14);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;background:rgba(255,100,114,.07);border:1px solid rgba(255,100,114,.14);border-radius:13px}.error-icon svg{width:21px;height:21px;stroke:var(--red)}.error-msg h3{font-size:13px;margin-bottom:5px}.error-msg p{max-width:270px;color:var(--muted);font-size:7.5px;line-height:1.45}
.modal{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.68);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.modal.show{display:flex}.modal-content{width:100%;max-width:350px;padding:18px;background:linear-gradient(145deg,#10243b,#0a1b2d);border:1px solid rgba(148,163,184,.18);border-radius:17px;box-shadow:0 22px 55px rgba(0,0,0,.4)}.modal-header{display:flex;align-items:center;gap:9px;margin-bottom:14px}.modal-icon{width:37px;height:37px;display:flex;align-items:center;justify-content:center;background:#0d2746;border:1px solid rgba(47,129,255,.17);border-radius:10px}.modal-icon svg{width:18px;height:18px;stroke:var(--blue)}.modal-title-wrap{min-width:0;flex:1}.modal-title{font-size:11px;font-weight:800}.modal-subtitle{margin-top:3px;color:var(--muted);font-size:6.5px}.modal-close{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:#9cafc3;background:#0b1d31;border:1px solid var(--border);border-radius:8px;cursor:pointer}.modal-close svg{width:14px;height:14px;stroke:currentColor}.modal-input-label{display:block;margin-bottom:6px;color:#c9d7e6;font-size:7px;font-weight:800}.modal-input{width:100%;height:42px;padding:0 12px;color:#f5f8fc;background:var(--input);border:1px solid rgba(92,120,150,.25);border-radius:9px;outline:none;font-size:10px}.modal-input:focus{border-color:rgba(47,129,255,.65);box-shadow:0 0 0 3px rgba(47,129,255,.08)}.modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal-btn{min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;cursor:pointer;font-size:8px;font-weight:800}.modal-btn svg{width:14px;height:14px;stroke:currentColor}.btn-confirm{color:#fff;background:linear-gradient(135deg,#2878e8,#165fc4)}.btn-cancel{color:#c6d3e1;background:#26384c;border:1px solid rgba(148,163,184,.12)}.modal-note{margin-top:9px;color:#61758c;font-size:6px;line-height:1.4;text-align:center}
.footer{text-align:center;padding:18px 0 3px}.footer-line{height:1px;margin-bottom:10px;background:linear-gradient(90deg,transparent,rgba(75,110,145,.24),transparent)}.footer-brand{color:#8ebcff;font-size:7px;font-weight:800;letter-spacing:.4px}.footer-text{margin-top:3px;color:#60748a;font-size:6px}
@media(max-width:380px){.app{padding-left:10px;padding-right:10px}.header-btn{width:34px;height:34px;flex-basis:34px}.brand-title{font-size:12px}.stats-grid{gap:7px}.stat-card{min-height:78px;padding:9px}.stat-icon{width:34px;height:34px;flex-basis:34px}.stat-value{font-size:16px}.wallet-card{min-height:62px;padding:8px}.wallet-icon{width:34px;height:34px;flex-basis:34px}.action-btn{width:31px;height:31px}.page-btn{min-height:36px;font-size:7px}}
</style>
</head>
<body>
<div class="app">
<header class="top-header">
<button type="button" class="header-btn" onclick="goBack()" title="Back" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
<div class="brand"><div class="brand-title">AL-HUDA TECH GLOBAL</div><div class="brand-subtitle">Account Management</div></div>
<a class="header-btn" id="headerHome" href="#" title="Home" aria-label="Home"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-7h5v7"/></svg></a>
</header>
<div class="page-actions">
<button type="button" class="page-btn" onclick="goBack()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg><span>Back</span></button>
<a class="page-btn primary" id="pageHome" href="#"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-7h5v7"/></svg><span>Home</span></a>
</div>
<main id="accounts-app"><div class="loading"><div class="loading-spinner"></div><div>Loading Accounts Data...</div></div></main>
<div class="modal" id="txModal" aria-hidden="true">
<div class="modal-content">
<div class="modal-header"><div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M8 7h7a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h7"/></svg></div><div class="modal-title-wrap"><div class="modal-title" id="modalTitle">Add Amount</div><div class="modal-subtitle">Update wallet balance</div></div><button type="button" class="modal-close" onclick="closeModal()" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg></button></div>
<label for="txAmount" class="modal-input-label">Transaction Amount</label>
<input type="number" id="txAmount" class="modal-input" placeholder="Enter amount" step="0.01" min="0" inputmode="decimal">
<div class="modal-btns"><button type="button" class="modal-btn btn-cancel" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg><span>Cancel</span></button><button type="button" class="modal-btn btn-confirm" id="submitTxBtn" onclick="submitTransaction()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg><span>Submit</span></button></div>
<div class="modal-note">Only enter a positive amount. The server will validate the transaction.</div>
</div></div>
<footer class="footer"><div class="footer-line"></div><div class="footer-brand">AL-HUDA TECH GLOBAL</div><div class="footer-text">Account Management Panel</div></footer>
</div>
<script>
const tg=window.Telegram.WebApp;tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#071321');if(tg.setBackgroundColor)tg.setBackgroundColor('#071321');
const urlParams=new URLSearchParams(window.location.search);let tgId=urlParams.get('tg_id');if(!tgId&&tg.initDataUnsafe&&tg.initDataUnsafe.user)tgId=tg.initDataUnsafe.user.id;
const homeUrl=`dashboard.html?tg_id=${tgId||''}`;document.getElementById('headerHome').href=homeUrl;document.getElementById('pageHome').href=homeUrl;
function goBack(){if(window.history.length>1&&document.referrer){window.history.back();return}window.location.href=homeUrl}
if(tg.BackButton){tg.BackButton.show();tg.BackButton.onClick(goBack)}
let currentWallet='',currentType='';
function formatBDT(value){return '৳'+parseFloat(value||0).toFixed(2)}
function escapeHtml(value){return String(value??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function showLoading(){document.getElementById('accounts-app').innerHTML='<div class="loading"><div class="loading-spinner"></div><div>Loading Accounts Data...</div></div>'}
function showError(title,message){document.getElementById('accounts-app').innerHTML=`<div class="error-msg"><div class="error-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg></div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(message)}</p></div>`}
function walletIcon(){return '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 12h5"/><circle cx="16" cy="12" r="1"/><path d="M6 9h7"/></svg>'}
async function fetchAccountsData(){const container=document.getElementById('accounts-app');showLoading();try{const res=await fetch(`/api/action?action=get_admin_accounts&tg_id=${tgId}`);const data=await res.json();if(!res.ok||!data.success){showError('Access Denied',data.message||'Unauthorized access.');return}const stats=data.stats||{};const wallets=Array.isArray(stats.wallets)?stats.wallets:[];let walletsHtml='';if(wallets.length){wallets.forEach(w=>{const safeName=escapeHtml(w.wallet_name);const rawName=String(w.wallet_name??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");walletsHtml+=`<div class="wallet-card"><div class="wallet-icon">${walletIcon()}</div><div class="wallet-info"><h4>${safeName}</h4><span>${formatBDT(w.balance)}</span></div><div class="wallet-actions"><button type="button" class="action-btn btn-plus" onclick="openModal('${rawName}','add')" title="Add balance" aria-label="Add balance"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></button><button type="button" class="action-btn btn-minus" onclick="openModal('${rawName}','sub')" title="Subtract balance" aria-label="Subtract balance"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button></div></div>`})}else{walletsHtml='<div class="error-msg" style="min-height:140px"><div class="error-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M7 10h10"/><path d="M7 14h6"/></svg></div><h3>No Wallets Found</h3><p>No wallet records are currently available.</p></div>'}const pl=parseFloat(stats.profit_loss||0),plClass=pl>=0?'profit':'loss',plText=pl>=0?`+${formatBDT(pl)}`:`-${formatBDT(Math.abs(pl))}`,status=pl>=0?'Net Profit':'Net Deficit';container.innerHTML=`<div class="page-heading"><div class="page-heading-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 12h5"/><circle cx="16" cy="12" r="1"/><path d="M6 9h7"/></svg></div><div><h1>Accounts & Ledger</h1><p>Manage personal wallets and system balance</p></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"/><path d="M3 20c.7-3.1 2.7-4.8 6-4.8s5.3 1.7 6 4.8"/><circle cx="17" cy="9" r="2.5"/><path d="M14 20c.5-2.5 1.6-4 3.5-4s3 1.5 3.5 4"/></svg></div><div class="stat-content"><div class="stat-label">Total Users</div><div class="stat-value">${escapeHtml(stats.total_users||0)}</div><div class="stat-description">Registered platform users</div></div></div><div class="stat-card"><div class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 8.5c-.8-.7-1.8-1-3-1-1.8 0-3 .9-3 2.2 0 3.1 6 1.4 6 4.3 0 1.3-1.2 2.2-3 2.2-1.3 0-2.5-.4-3.3-1.2"/><path d="M12 6v12"/></svg></div><div class="stat-content"><div class="stat-label">User Wallets</div><div class="stat-value">${formatBDT(stats.total_user_balance)}</div><div class="stat-description">Total user balance</div></div></div></div><div class="profit-card"><div class="profit-top"><div class="profit-label">Net Profit / Deficit</div><div class="profit-status">${status}</div></div><div class="profit-value ${plClass}">${plText}</div></div><div class="section-title"><div class="section-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M16 12h5"/><circle cx="16" cy="12" r="1"/></svg></div><div class="section-title-text"><strong>Personal Wallets Ledger</strong><span>Add or subtract wallet balances</span></div></div><div class="wallet-list">${walletsHtml}</div><div class="total-box"><div class="total-left"><div class="total-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M6 7V5h12v2"/><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M8 11h8"/></svg></div><div><div class="total-label">Total Cash in Wallets</div><div class="total-sub">Combined wallet balance</div></div></div><div class="total-value">${formatBDT(stats.total_wallet_balance)}</div></div>`}catch(err){console.error(err);showError('Connection Error','Failed to load accounts data. Please try again.')}}
function openModal(walletName,type){currentWallet=walletName;currentType=type;document.getElementById('modalTitle').textContent=`${type==='add'?'Add to':'Subtract from'} ${walletName}`;const input=document.getElementById('txAmount');input.value='';const modal=document.getElementById('txModal');modal.classList.add('show');modal.setAttribute('aria-hidden','false');setTimeout(()=>input.focus(),100)}
function closeModal(){const modal=document.getElementById('txModal');modal.classList.remove('show');modal.setAttribute('aria-hidden','true');document.getElementById('txAmount').value=''}
document.getElementById('txModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
async function submitTransaction(){const input=document.getElementById('txAmount'),button=document.getElementById('submitTxBtn'),amount=parseFloat(input.value);if(!amount||isNaN(amount)||amount<=0){alert('Please enter a valid positive amount.');input.focus();return}try{button.disabled=true;button.innerHTML='<span>Processing...</span>';const res=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'update_wallet_balance',tg_id:tgId,wallet_name:currentWallet,type:currentType,amount:amount})});const result=await res.json();if(result.success){closeModal();await fetchAccountsData()}else{alert('Failed: '+(result.message||'Unknown error'))}}catch(err){console.error(err);alert('Server error while processing transaction.')}finally{button.disabled=false;button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg><span>Submit</span>'}}
fetchAccountsData();
</script>
</body>
</html>
