<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Hub - Admin Control</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 p-4 md:p-8 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <h1 class="text-xl font-bold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-500"></i> Gmail Hub Control Center
            </h1>
            <span class="bg-indigo-950 text-indigo-400 text-xs px-3 py-1 rounded-full border border-indigo-800">
                Admin Panel
            </span>
        </div>

        <!-- ১. হেডলাইন ও সাবটাইটেল সেটিং -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-heading text-indigo-400"></i> ১. পেজ হেডলাইন ও বিবরণ
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">মেন হেডলাইন</label>
                    <input type="text" id="input-headline" placeholder="যেমন: Gmail Hub Center" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">সাব-টাইটেল / বিবরণ</label>
                    <input type="text" id="input-subheadline" placeholder="যেমন: Select your preferred service below" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <button onclick="updateSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> হেডলাইন সেভ করুন
            </button>
        </div>

        <!-- ২. বাটন তৈরি ও এডিট ফর্ম -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2" id="form-title">
                <i class="fa-solid fa-plus-circle text-emerald-400"></i> ২. নতুন বাটন যোগ করুন
            </h2>
            <input type="hidden" id="btn-id">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">বাটনের নাম</label>
                    <input type="text" id="btn-name" placeholder="যেমন: Buy Gmail Account" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">বাটন লিংক (URL / Route)</label>
                    <input type="text" id="btn-action" placeholder="যেমন: buy_gmail.html" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1 font-medium">কাস্টম আইকন HTML কোড</label>
                    <input type="text" id="btn-icon" placeholder='যেমন: <i class="fa-solid fa-cart-shopping"></i>' class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div class="flex items-center space-x-3 pt-2">
                <button onclick="saveButton()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-5 py-2.5 rounded-lg transition flex items-center gap-2">
                    <i class="fa-solid fa-check"></i> বাটন সেভ করুন
                </button>
                <button onclick="resetForm()" class="bg-slate-800 hover:bg-slate-700 text-xs px-4 py-2.5 rounded-lg text-slate-300 transition">
                    রিসেট
                </button>
            </div>
        </div>

        <!-- ৩. বাটন টেবিল তালিকা -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-list-check text-purple-400"></i> ৩. বর্তমান বাটন তালিকা
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] tracking-wider border-b border-slate-800">
                        <tr>
                            <th class="p-3">আইকন</th>
                            <th class="p-3">বাটনের নাম</th>
                            <th class="p-3">লিংক / একশন</th>
                            <th class="p-3 text-right">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="admin-btn-rows" class="divide-y divide-slate-800/60">
                        <!-- এপিআই থেকে ডাটা আসবে -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let hubButtons = [];

        // ডাটা লোড করার ফাংশন
        async function loadAdminData() {
            try {
                const res = await fetch('/api/hub/data');
                const data = await res.json();
                if(data.success) {
                    document.getElementById('input-headline').value = data.settings.page_headline || '';
                    document.getElementById('input-subheadline').value = data.settings.page_subheadline || '';
                    
                    hubButtons = data.buttons || [];
                    renderRows();
                }
            } catch (err) {
                console.error("Data Load Error:", err);
            }
        }

        // টেবিল রেন্ডার
        function renderRows() {
            const tbody = document.getElementById('admin-btn-rows');
            tbody.innerHTML = '';
            
            if (hubButtons.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500 italic">কোনো বাটন তৈরি করা হয়নি।</td></tr>`;
                return;
            }

            hubButtons.forEach(btn => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-950/40 transition';
                tr.innerHTML = `
                    <td class="p-3 font-mono text-indigo-400 text-sm">${btn.button_icon}</td>
                    <td class="p-3 font-semibold text-slate-200">${btn.button_name}</td>
                    <td class="p-3 font-mono text-slate-400 text-[11px]">${btn.button_action}</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="editBtn(${btn.id})" class="px-2.5 py-1 bg-indigo-950 hover:bg-indigo-900 text-indigo-300 border border-indigo-800/50 rounded transition">এডিট</button>
                        <button onclick="deleteBtn(${btn.id})" class="px-2.5 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 border border-rose-800/50 rounded transition">ডিলিট</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // সেটিংস আপডেট (হেডলাইন ও সাব-টাইটেল)
        async function updateSettings() {
            const headline = document.getElementById('input-headline').value;
            const subheadline = document.getElementById('input-subheadline').value;

            try {
                const res = await fetch('/api/hub/settings/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ page_headline: headline, page_subheadline: subheadline })
                });
                const data = await res.json();
                if(data.success) {
                    alert('হেডলাইন সফলভাবে পরিবর্তিত হয়েছে!');
                }
            } catch(e) {
                alert('আপডেট করতে সমস্যা হয়েছে!');
            }
        }

        // বাটন সেভ/আপডেট
        async function saveButton() {
            const id = document.getElementById('btn-id').value;
            const name = document.getElementById('btn-name').value;
            const action = document.getElementById('btn-action').value;
            const icon = document.getElementById('btn-icon').value;

            if(!name || !action) {
                alert('বাটনের নাম এবং লিংক দেওয়া আবশ্যক!');
                return;
            }

            const endpoint = id ? '/api/hub/buttons/update' : '/api/hub/buttons/add';
            const payload = id 
                ? { id, button_name: name, button_action: action, button_icon: icon } 
                : { button_name: name, button_action: action, button_icon: icon };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if(data.success) {
                    resetForm();
                    loadAdminData();
                }
            } catch(e) {
                alert('বাটন সেভ করতে সমস্যা হয়েছে!');
            }
        }

        // বাটন এডিট মোড
        function editBtn(id) {
            const btn = hubButtons.find(b => b.id === id);
            if(!btn) return;

            document.getElementById('btn-id').value = btn.id;
            document.getElementById('btn-name').value = btn.button_name;
            document.getElementById('btn-action').value = btn.button_action;
            document.getElementById('btn-icon').value = btn.button_icon;
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-indigo-400"></i> বাটন এডিট করুন';
        }

        // বাটন ডিলিট
        async function deleteBtn(id) {
            if(!confirm('আপনি কি নিশ্চিতভাবে এই বাটনটি ডিলিট করতে চান?')) return;

            try {
                const res = await fetch('/api/hub/buttons/delete', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                if(data.success) {
                    loadAdminData();
                }
            } catch(e) {
                alert('বাটন ডিলিট করতে সমস্যা হয়েছে!');
            }
        }

        // ফর্ম রিসেট
        function resetForm() {
            document.getElementById('btn-id').value = '';
            document.getElementById('btn-name').value = '';
            document.getElementById('btn-action').value = '';
            document.getElementById('btn-icon').value = '';
            document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle text-emerald-400"></i> ২. নতুন বাটন যোগ করুন';
        }

        // শুরুর সময় ডাটা লোড
        loadAdminData();
    </script>
</body>
</html>
