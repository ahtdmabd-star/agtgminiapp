<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Index | AL-HUDA TECH GLOBAL</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f4f7f6;
            color: #101828;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #ffffff;
            border: 1px solid #e4e7ec;
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(16, 24, 40, .08);
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #e9f5ef;
            color: #176b4d;
            display: grid;
            place-items: center;
        }

        .icon svg {
            width: 32px;
            height: 32px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        p {
            margin: 0 0 24px;
            color: #667085;
            font-size: 14px;
            line-height: 1.6;
        }

        .button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            width: 100%;
            border-radius: 14px;
            background: #176b4d;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }

        .button:hover {
            background: #0e513a;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 20V9.5L12 4l8 5.5V20"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linejoin="round"/>

            <path d="M8 20v-5h8v5"
                  stroke="currentColor"
                  stroke-width="1.7"/>

            <path d="M12 9v3M9 10.5h6"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"/>
        </svg>
    </div>

    <h1>Admin Index</h1>

    <p>
        Access the administration dashboard
        from the button below.
    </p>

    <!-- পরে এখানে Admin Dashboard-এর আসল URL বসাবো -->
    <a
        class="button"
        href="/admin/index.html"
    >
        Go to Admin Dashboard
    </a>

</div>

</body>
</html>
