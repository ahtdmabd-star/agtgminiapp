<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TECH GLOBAL - Admin Portal</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .admin-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 24px; padding: 32px 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .admin-title { font-size: 1.25rem; font-weight: 800; color: var(--accent-color); margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
        .admin-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
        
        .admin-btn-group { display: flex; flex-direction: column; gap: 12px; }
        
        .btn-manage { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #0f172a; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 700; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: block; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3); transition: transform 0.2s; }
        .btn-manage:active { transform: scale(0.97); }

        .btn-user-index { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-main); padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 0.9rem; cursor: pointer; text-decoration: none; display: block; transition: 0.2s; }
        .btn-user-index:hover { border-color: var(--accent-color); background: rgba(56, 189, 248, 0.1); }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="admin-card">
        <div style="width: 50px; height: 50px; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.3); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; color: var(--accent-color);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="admin-title">Admin Management Portal</div>
        <div class="admin-desc">Manage your entire website infrastructure, user balances, security controls, and system configurations from the master administration panel.</div>
        
        <div class="admin-btn-group">
            <a href="/admin/dashboard.html" class="btn-manage">Go to Admin Management Panel</a>
            <a href="/app/index.html" class="btn-user-index">Go to User Index</a>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function protectAdminPage() {
            const tgUser = tg.initDataUnsafe?.user;
            if (!tgUser || !tgUser.id) {
                alert("Unauthorized Access!");
                window.location.href = '/app/index.html';
                return;
            }

            try {
                const res = await fetch(`/api/check-verification?telegram_id=${tgUser.id}`);
                const data = await res.json();

                if (!data.success || data.role !== 'admin') {
                    alert("Access Denied! Administrators only.");
                    window.location.href = '/app/index.html';
                }
            } catch (err) {
                window.location.href = '/app/index.html';
            }
        }
        protectAdminPage();
    </script>
</body>
</html>
