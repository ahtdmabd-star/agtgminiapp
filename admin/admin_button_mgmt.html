<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল বাটন ম্যানেজমেন্ট</title>
    <!-- FontAwesome & Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-md-12 d-flex justify-content-between align-items-center">
                <h2><i class="fa-solid fa-sliders"></i> এডমিন প্যানেল বাটন ম্যানেজমেন্ট</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addButtonModal">
                    <i class="fa-solid fa-plus"></i> নতুন এডমিন বাটন যোগ করুন
                </button>
            </div>
        </div>

        <!-- অ্যালার্ট ম্যাসেজ দেখানোর জন্য -->
        <div id="alertBox"></div>

        <!-- এডমিন বাটনগুলোর লিস্ট টেবিল -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>#ID</th>
                                <th>বাটনের নাম</th>
                                <th>কী (Key)</th>
                                <th>বিবরণ (Description)</th>
                                <th>অ্যাকশন/লিংক</th>
                                <th>স্ট্যাটাস</th>
                                <th>কার্যক্রম</th>
                            </tr>
                        </thead>
                        <tbody id="adminButtonTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-4">ডাটা লোড হচ্ছে...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- নতুন বাটন যোগ করার মডাল -->
    <div class="modal fade" id="addButtonModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="addAdminButtonForm">
                    <div class="modal-header">
                        <h5 class="modal-title"><i class="fa-solid fa-plus-circle"></i> নতুন এডমিন বাটন যুক্ত করুন</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">বাটনের নাম (Name)</label>
                            <input type="text" class="form-control" id="button_name" required placeholder="যেমন: Report Management">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">বাটন কি (Unique Key)</label>
                            <input type="text" class="form-control" id="button_key" placeholder="যেমন: report_mgmt">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">বিবরণ (Description)</label>
                            <textarea class="form-control" id="button_desc" rows="2" placeholder="বাটনের কাজের সংক্ষিপ্ত বিবরণ"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">অ্যাকশন লিংক বা পেজ (Action)</label>
                            <input type="text" class="form-control" id="button_action" required placeholder="যেমন: reports.html">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বাতিল</button>
                        <button type="submit" class="btn btn-success">সংরক্ষণ করুন</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript লজিক -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // পেজ লোড হলে এডমিন বাটনগুলো ফেচ করা
        document.addEventListener('DOMContentLoaded', fetchAdminButtons);

        async function fetchAdminButtons() {
            try {
                const response = await fetch('/api/admin/buttons/list');
                const result = await response.json();
                
                const tbody = document.getElementById('adminButtonTableBody');
                tbody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(btn => {
                        let isFixedBadge = btn.is_fixed === 1 
                            ? '<span class="badge bg-danger">সংরক্ষিত (Fixed)</span>' 
                            : '<span class="badge bg-success">কাস্টম</span>';

                        let deleteBtn = btn.is_fixed === 1 
                            ? '<button class="btn btn-sm btn-secondary" disabled title="এই বাটনটি ডিলিট করা নিষেধ"><i class="fa-solid fa-lock"></i></button>' 
                            : `<button class="btn btn-sm btn-danger" onclick="deleteAdminButton(${btn.id})"><i class="fa-solid fa-trash"></i> ডিলিট</button>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>${btn.id}</td>
                                <td><strong>${btn.button_name}</strong></td>
                                <td><code>${btn.button_key}</code></td>
                                <td>${btn.button_desc || '-'}</td>
                                <td>${btn.button_action}</td>
                                <td>${isFixedBadge}</td>
                                <td>${deleteBtn}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">কোনো ডাটা পাওয়া যায়নি!</td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching admin buttons:', error);
            }
        }

        // নতুন বাটন সাবমিট করার হ্যান্ডלার
        document.getElementById('addAdminButtonForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const button_name = document.getElementById('button_name').value;
            const button_key = document.getElementById('button_key').value;
            const button_desc = document.getElementById('button_desc').value;
            const button_action = document.getElementById('button_action').value;

            try {
                const response = await fetch('/api/admin/buttons/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ button_name, button_key, button_desc, button_action })
                });
                const result = await response.json();

                if (result.success) {
                    // মডাল বন্ধ করা এবং ফর্ম রিসেট করা
                    let modalEl = document.getElementById('addButtonModal');
                    let modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                    this.reset();

                    // লিস্ট রিফ্রেশ করা
                    fetchAdminButtons();
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error adding button:', error);
            }
        });

        // বাটন ডিলিট করার ফাংশন
        async function deleteAdminButton(id) {
            if (!confirm('আপনি কি নিশ্চিতভাবে এই এডমিন বাটনটি মুছে ফেলতে চান?')) return;

            try {
                const response = await fetch('/api/admin/buttons/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const result = await response.json();

                if (result.success) {
                    fetchAdminButtons();
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error deleting button:', error);
            }
        }

        // অ্যালার্ট দেখানোর ফাংশন
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => { alertBox.innerHTML = ''; }, 4000);
        }
    </script>
</body>
</html>
