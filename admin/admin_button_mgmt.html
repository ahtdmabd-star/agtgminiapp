<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>এডমিন প্যানেল বাটন ম্যানেজমেন্ট</title>
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- টেলিগ্রাম মিনি অ্যাপ গ্লাস ডিজাইন স্টাইল -->
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-table {
            color: #ffffff !important;
        }

        .glass-table th, .glass-table td {
            background: transparent !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        .glass-modal {
            background: rgba(30, 30, 47, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-glass-primary {
            background: rgba(13, 110, 253, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        .btn-glass-primary:hover {
            background: rgba(13, 110, 253, 1);
            color: #fff;
        }

        code {
            color: #ffc107 !important;
        }
    </style>
</head>
<body>

    <div class="container py-4">
        <!-- হেডার অংশ -->
        <div class="row mb-4 align-items-center">
            <div class="col-md-12 d-flex justify-content-between align-items-center glass-container p-3">
                <h4 class="m-0"><i class="fa-solid fa-sliders text-info"></i> এডমিন বাটন ম্যানেজমেন্ট</h4>
                <button class="btn btn-glass-primary btn-sm px-3 py-2" data-bs-toggle="modal" data-bs-target="#addButtonModal">
                    <i class="fa-solid fa-plus"></i> নতুন বাটন যোগ করুন
                </button>
            </div>
        </div>

        <!-- অ্যালার্ট ম্যাসেজ বক্স -->
        <div id="alertBox"></div>

        <!-- গ্লাস কার্ড ও টেবিল -->
        <div class="glass-container p-3">
            <div class="table-responsive">
                <table class="table glass-table align-middle">
                    <thead>
                        <tr>
                            <th>#ID</th>
                            <th>বাটনের নাম</th>
                            <th>কী (Key)</th>
                            <th>বিবরণ</th>
                            <th>অ্যাকশন</th>
                            <th>স্ট্যাটাস</th>
                            <th>কার্যক্রম</th>
                        </tr>
                    </thead>
                    <tbody id="adminButtonTableBody">
                        <tr>
                            <td colspan="7" class="text-center py-4">ডাটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- নতুন বাটন যোগ করার গ্লাস মডাল -->
    <div class="modal fade" id="addButtonModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-modal">
                <form id="addAdminButtonForm">
                    <div class="modal-header border-bottom border-secondary">
                        <h5 class="modal-title"><i class="fa-solid fa-plus-circle text-info"></i> নতুন এডমিন বাটন যুক্ত করুন</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">বাটনের নাম (Name)</label>
                            <input type="text" class="form-control" id="button_name" required placeholder="যেমন: Report Management">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">বাটন কি (Unique Key)</label>
                            <input type="text" class="form-control" id="button_key" placeholder="যেমন: report_mgmt">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">বিবরণ (Description)</label>
                            <textarea class="form-control" id="button_desc" rows="2" placeholder="বাটনের কাজের সংক্ষিপ্ত বিবরণ"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">অ্যাকশন লিংক বা পেজ (Action)</label>
                            <input type="text" class="form-control" id="button_action" required placeholder="যেমন: reports.html">
                        </div>
                    </div>
                    <div class="modal-footer border-top border-secondary">
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">বাতিল</button>
                        <button type="submit" class="btn btn-success btn-sm">সংরক্ষণ করুন</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript লজিক -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', fetchAdminButtons);

        async function fetchAdminButtons() {
            try {
                const response = await fetch('/api/admin/buttons/list');
                const result = await response.json();
                
                const tbody = document.getElementById('adminButtonTableBody');
                tbody.innerHTML = '';

                if (result.success && result.data.length > 0) {
                    result.data.forEach(btn => {
                        let isFixedBadge = btn.is_fixed === 1 
                            ? '<span class="badge bg-danger bg-opacity-75">সংরক্ষিত</span>' 
                            : '<span class="badge bg-info bg-opacity-75">কাস্টম</span>';

                        let deleteBtn = btn.is_fixed === 1 
                            ? '<button class="btn btn-sm btn-secondary opacity-50" disabled title="নিরাপত্তার জন্য এটি ডিলিট করা নিষেধ"><i class="fa-solid fa-lock"></i></button>' 
                            : `<button class="btn btn-sm btn-danger px-2 py-1" onclick="deleteAdminButton(${btn.id})"><i class="fa-solid fa-trash"></i></button>`;

                        tbody.innerHTML += `
                            <tr>
                                <td>${btn.id}</td>
                                <td><strong>${btn.button_name}</strong></td>
                                <td><code>${btn.button_key}</code></td>
                                <td>${btn.button_desc || '-'}</td>
                                <td>${btn.button_action}</td>
                                <td>${isFixedBadge}</td>
                                <td>${deleteBtn}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-warning">কোনো ডাটা পাওয়া যায়নি!</td></tr>`;
                }
            } catch (error) {
                console.error('Error fetching admin buttons:', error);
            }
        }

        document.getElementById('addAdminButtonForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const button_name = document.getElementById('button_name').value;
            const button_key = document.getElementById('button_key').value;
            const button_desc = document.getElementById('button_desc').value;
            const button_action = document.getElementById('button_action').value;

            try {
                const response = await fetch('/api/admin/buttons/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ button_name, button_key, button_desc, button_action })
                });
                const result = await response.json();

                if (result.success) {
                    let modalEl = document.getElementById('addButtonModal');
                    let modal = bootstrap.Modal.getInstance(modalEl);
                    modal.hide();
                    this.reset();
                    fetchAdminButtons();
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error adding button:', error);
            }
        });

        async function deleteAdminButton(id) {
            if (!confirm('আপনি কি নিশ্চিতভাবে এই এডমিন বাটনটি মুছে ফেলতে চান?')) return;

            try {
                const response = await fetch('/api/admin/buttons/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id })
                });
                const result = await response.json();

                if (result.success) {
                    fetchAdminButtons();
                    showAlert(result.message, 'success');
                } else {
                    showAlert(result.message, 'danger');
                }
            } catch (error) {
                console.error('Error deleting button:', error);
            }
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show bg-opacity-75 text-white border-0" role="alert" style="background: rgba(${type === 'success' ? '25, 135, 84' : '220, 53, 69'}, 0.8);">
                    ${message}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>
            `;
            setTimeout(() => { alertBox.innerHTML = ''; }, 4000);
        }
    </script>
</body>
</html>
