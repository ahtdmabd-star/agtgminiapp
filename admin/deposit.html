<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TECH GLOBAL - Deposit Management</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.85);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 600px; margin: 0 auto; }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 14px 18px; border-radius: 16px; }
        .brand-title { font-size: 0.95rem; font-weight: 800; color: var(--accent-color); }
        .btn-action-top { background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-color); color: var(--accent-color); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; cursor: pointer; text-decoration: none; }

        .section-title { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 10px 4px; }
        
        /* Deposit Request Card */
        .deposit-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
        .deposit-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.82rem; }
        .label { color: var(--text-muted); }
        .val { font-weight: 700; color: var(--text-main); }
        .trx-id { background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 6px; font-family: monospace; color: var(--accent-color); font-size: 0.85rem; }

        .action-btns { display: flex; gap: 8px; margin-top: 12px; }
        .btn-approve { background: #10b981; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; cursor: pointer; flex: 1; }
        .btn-reject { background: #ef4444; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 0.78rem; cursor: pointer; flex: 1; }

        /* Modal Popup */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 16px; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--glass-border); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; display: block; }
        .form-input { width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: var(--text-main); padding: 10px; border-radius: 8px; font-size: 0.85rem; outline: none; }
        .btn-save { background: var(--accent-color); color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-close { background: rgba(255,255,255,0.1); color: var(--text-main); border: none; padding: 10px; border-radius: 10px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 6px; }
        
        .spinner { width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="app-container">
        
        <div class="header-box">
            <div class="brand-title">DEPOSIT MANAGEMENT</div>
            <div style="display: flex; gap: 8px;">
                <button id="open-settings-btn" class="btn-action-top">Manage Numbers</button>
                <a href="/admin/dashboard.html" class="btn-action-top">&larr; Back</a>
            </div>
        </div>

        <div class="section-title">Pending Deposit Requests</div>
        <div id="deposits-container">
            <div class="spinner"></div>
        </div>

    </div>

    <!-- Settings Modal for Updating Numbers -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-card">
            <div style="font-size: 1rem; font-weight: 800; color: var(--accent-color); margin-bottom: 14px; text-align: center;">Update Payment Numbers</div>
            <div id="methods-form-container">
                <div class="spinner"></div>
            </div>
            <button type="button" id="close-modal-btn" class="btn-close">Close</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const tgUser = tg.initDataUnsafe?.user;
        const adminId = tgUser ? tgUser.id : null;

        if (!adminId) {
            alert("Unauthorized Access!");
            window.location.href = '/index.html';
        }

        // Fetch Pending Deposits
        async function loadDeposits() {
            try {
                const res = await fetch(`/api/admin/get-deposits?telegram_id=${adminId}`);
                const data = await res.json();
                
                const container = document.getElementById('deposits-container');
                if (!data.success || data.deposits.length === 0) {
                    container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">No pending deposit requests.</div>`;
                    return;
                }

                let html = '';
                let pendingCount = 0;

                data.deposits.forEach(dep => {
                    // Only pending deposits can have action buttons.
                    const status = String(dep.status || 'pending').toLowerCase();

                    if (status !== 'pending') {
                        return;
                    }

                    pendingCount++;

                    html += `
                        <div class="deposit-card" id="deposit-card-${dep.id}">
                            <div class="deposit-row"><span class="label">User Telegram ID:</span><span class="val">${dep.telegram_id}</span></div>
                            <div class="deposit-row"><span class="label">Method:</span><span class="val" style="color: var(--accent-color);">${dep.method}</span></div>
                            <div class="deposit-row"><span class="label">Send Amount:</span><span class="val">${dep.send_amount}</span></div>
                            <div class="deposit-row"><span class="label">Will Get (USD):</span><span class="val" style="color: #34d399;">$${dep.get_amount}</span></div>
                            <div class="deposit-row"><span class="label">TrxID / Hash:</span><span class="trx-id">${dep.transaction_id}</span></div>
                            <div class="deposit-row"><span class="label">Time:</span><span class="val" style="font-size: 0.75rem; color: var(--text-muted);">${dep.created_at}</span></div>

                            <div class="action-btns" id="action-btns-${dep.id}">
                                <button class="btn-approve" onclick="processDeposit(${dep.id}, 'approve')">Approve</button>
                                <button class="btn-reject" onclick="processDeposit(${dep.id}, 'reject')">Reject</button>
                            </div>
                        </div>
                    `;
                });

                if (pendingCount === 0) {
                    container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">No pending deposit requests.</div>`;
                } else {
                    container.innerHTML = html;
                }
            } catch (err) {
                document.getElementById('deposits-container').innerHTML = `<div style="text-align: center; color: #ef4444;">Failed to load deposits.</div>`;
            }
        }

        // Approve or Reject Action
        async function processDeposit(depositId, action) {
            if (!confirm(`Are you sure you want to ${action} this deposit?`)) return;

            try {
                const res = await fetch('/api/admin/process-deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: adminId, deposit_id: depositId, action: action })
                });

                const result = await res.json();

                if (!res.ok || !result.success) {
                    alert(result.message || "Action failed.");
                    return;
                }

                alert(result.message || "Action completed successfully.");

                // Remove the whole deposit card immediately after a successful action.
                const card = document.getElementById(`deposit-card-${depositId}`);
                if (card) {
                    card.remove();
                }

                // If there are no pending cards left, show the empty message.
                const container = document.getElementById('deposits-container');
                if (!container.querySelector('.deposit-card')) {
                    container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">No pending deposit requests.</div>`;
                }

                // Sync again with the database.
                setTimeout(loadDeposits, 300);
            } catch (err) {
                alert("Action failed.");
            }
        }

        // Load Methods into Modal for Editing Numbers
        async function loadMethodSettings() {
            try {
                const res = await fetch(`/api/admin/get-methods?telegram_id=${adminId}`);
                const data = await res.json();
                
                const container = document.getElementById('methods-form-container');
                if (!data.success) {
                    container.innerHTML = "Failed to load methods.";
                    return;
                }

                let html = '';
                data.methods.forEach(m => {
                    html += `
                        <div class="form-group">
                            <label class="form-label">${m.method_name} (${m.account_type || 'Account'})</label>
                            <input type="text" id="method-input-${m.id}" class="form-input" value="${m.account_number}">
                            <button onclick="updateMethodNumber(${m.id}, '${m.method_name}')" style="margin-top: 4px; background: rgba(56,189,248,0.2); border: 1px solid var(--accent-color); color: var(--accent-color); padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; cursor: pointer;">Update Number</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error(err);
            }
        }

        async function updateMethodNumber(id, name) {
            const newNum = document.getElementById(`method-input-${id}`).value.trim();
            if (!newNum) {
                alert("Number cannot be empty");
                return;
            }

            try {
                const res = await fetch('/api/admin/update-method', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: adminId, method_id: id, account_number: newNum })
                });
                const result = await res.json();
                alert(result.message);
            } catch (err) {
                alert("Update failed.");
            }
        }

        document.getElementById('open-settings-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'flex';
            loadMethodSettings();
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            document.getElementById('settings-modal').style.display = 'none';
        });

        loadDeposits();
    </script>
</body>
</html>
