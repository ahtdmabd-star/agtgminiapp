<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TECH GLOBAL - Admin Deposit Management</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 14px; }
        .page-title { font-size: 1rem; font-weight: 800; color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-btn { background: rgba(56, 189, 248, 0.15); color: var(--accent-color); border: 1px solid var(--glass-border); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 0.75rem; cursor: pointer; text-decoration: none; }

        .section-header { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        
        .deposit-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .deposit-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 6px; }
        .deposit-row:last-of-type { border-bottom: none; margin-bottom: 12px; }
        .label { color: var(--text-muted); font-weight: 600; }
        .value { color: var(--text-main); font-weight: 700; text-align: right; word-break: break-all; }
        .value.highlight { color: var(--accent-color); }
        .value.trx { color: #facc15; font-family: monospace; font-size: 0.9rem; }

        .action-buttons { display: flex; gap: 10px; margin-top: 12px; }
        .btn { flex: 1; padding: 10px; border-radius: 10px; font-weight: 800; font-size: 0.85rem; border: none; cursor: pointer; transition: transform 0.1s; }
        .btn:active { transform: scale(0.97); }
        .btn-approve { background: var(--success-color); color: #fff; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        .btn-reject { background: var(--danger-color); color: #fff; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }

        .no-data { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 0.9rem; background: var(--glass-bg); border-radius: 16px; border: 1px solid var(--glass-border); }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="app-container">
        <div class="top-nav">
            <div class="page-title">Deposit Management</div>
            <div style="display: flex; gap: 8px;">
                <a href="numbers.html" class="nav-btn">Manage Numbers</a>
                <a href="index.html" class="nav-btn">← Back</a>
            </div>
        </div>

        <div class="section-header">Pending Deposit Requests</div>
        <div id="deposits-container">
            <div class="no-data">Loading pending requests...</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const adminId = tg.initDataUnsafe?.user?.id;

        // যদি ব্রাউজার থেকে টেস্ট করেন এবং টেলিগ্রাম অবজেক্ট না থাকে তবে লোকাল টেস্টিং আইডি সেট করতে পারেন
        const currentAdminId = adminId || 8191704137; 

        async function loadDeposits() {
            const container = document.getElementById('deposits-container');
            container.innerHTML = `<div class="no-data">Loading pending requests...</div>`;

            try {
                const res = await fetch('/api/admin/get-deposits', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: currentAdminId })
                });
                const data = await res.json();

                if (data.success && data.deposits && data.deposits.length > 0) {
                    container.innerHTML = '';
                    data.deposits.forEach(dep => {
                        const card = document.createElement('div');
                        card.className = 'deposit-card';
                        card.id = `deposit-card-${dep.id}`;
                        card.innerHTML = `
                            <div class="deposit-row"><span class="label">User Telegram ID:</span><span class="value">${dep.telegram_id}</span></div>
                            <div class="deposit-row"><span class="label">Method:</span><span class="value highlight">${dep.method}</span></div>
                            <div class="deposit-row"><span class="label">Send Amount:</span><span class="value">${dep.send_amount}</span></div>
                            <div class="deposit-row"><span class="label">Will Get (USD):</span><span class="value highlight">$${dep.get_amount}</span></div>
                            <div class="deposit-row"><span class="label">TrxID / Hash:</span><span class="value trx">${dep.transaction_id}</span></div>
                            <div class="deposit-row"><span class="label">Time:</span><span class="value" style="font-size: 0.75rem; color: #94a3b8;">${new Date(dep.created_at || Date.now()).toLocaleString()}</span></div>
                            <div class="action-buttons">
                                <button class="btn btn-approve" onclick="processDeposit(${dep.id}, 'approve')">Approve</button>
                                <button class="btn btn-reject" onclick="processDeposit(${dep.id}, 'reject')">Reject</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<div class="no-data">No pending deposit requests.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="no-data" style="color: #ef4444;">Failed to load requests.</div>`;
            }
        }

        async function processDeposit(depositId, action) {
            if (!confirm(`Are you sure you want to ${action} this deposit?`)) return;

            try {
                const res = await fetch('/api/admin/process-deposit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegram_id: currentAdminId, deposit_id: depositId, action: action })
                });
                const result = await res.json();

                if (result.success) {
                    alert(result.message);
                    // অ্যাকশন সফল হওয়ার সাথে সাথে নির্দিষ্ট কার্ডটি পেজ থেকে রিমুভ করে দেওয়া হবে
                    const cardElement = document.getElementById(`deposit-card-${depositId}`);
                    if (cardElement) {
                        cardElement.style.transition = 'all 0.3s ease';
                        cardElement.style.opacity = '0';
                        cardElement.style.transform = 'scale(0.9)';
                        setTimeout(() => cardElement.remove(), 300);
                    }
                    // তালিকা সম্পূর্ণ খালি হলে নো-ডাটা মেসেজ দেখাবে
                    setTimeout(() => {
                        const container = document.getElementById('deposits-container');
                        if (container.children.length === 0) {
                            container.innerHTML = `<div class="no-data">No pending deposit requests.</div>`;
                        }
                    }, 350);
                } else {
                    alert(result.message || "Action failed.");
                }
            } catch (err) {
                alert("Network error. Please try again.");
            }
        }

        loadDeposits();
    </script>
</body>
</html>
