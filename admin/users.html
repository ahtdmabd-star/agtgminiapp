<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - AL-HUDA TECH GLOBAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #090d16; color: #f8fafc; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
        .header h2 { color: #f43f5e; font-size: 20px; margin-bottom: 3px; }
        .header p { color: #94a3b8; font-size: 12px; }

        .search-box { width: 100%; background: #111827; border: 1px solid #374151; padding: 10px 14px; border-radius: 10px; color: white; font-size: 13px; outline: none; margin-bottom: 15px; }

        /* User Card */
        .user-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .user-name { font-size: 14px; font-weight: 600; color: #f8fafc; }
        .user-bal { font-size: 15px; font-weight: 700; color: #38bdf8; }
        
        .user-details { font-size: 11px; color: #94a3b8; margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        .badge { padding: 2px 6px; border-radius: 4px; font-weight: 600; font-size: 10px; }
        .badge-admin { background: #818cf8; color: #1e1b4b; }
        .badge-user { background: #334155; color: #cbd5e1; }
        .badge-active { background: #16a34a; color: white; }
        .badge-banned { background: #dc2626; color: white; }

        .user-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; border-top: 1px solid #1f2937; padding-top: 10px; }
        .u-btn { padding: 6px 4px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; color: white; }
        .btn-bal { background: #2563eb; }
        .btn-status { background: #d97706; }
        .btn-role { background: #7c3aed; }
        .btn-del { background: #dc2626; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #111827; border: 1px solid #374151; padding: 20px; border-radius: 14px; width: 100%; max-width: 350px; text-align: center; }
        .modal-content h3 { font-size: 15px; margin-bottom: 12px; color: #f8fafc; }
        .modal-input { width: 100%; background: #070a12; border: 1px solid #4b5563; padding: 10px; border-radius: 8px; color: white; font-size: 14px; outline: none; margin-bottom: 15px; text-align: center; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 9px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; }
        .btn-confirm { background: #2563eb; color: white; }
        .btn-cancel { background: #374151; color: #d1d5db; }

        .btn-back { display: block; width: 100%; background: #334155; color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; text-align: center; text-decoration: none; margin-top: 20px; font-size: 12px; }
        .loading, .error-msg { text-align: center; padding: 40px; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container" id="users-app">
        <div class="loading">Loading Users Data...</div>
    </div>

    <!-- Balance Modal -->
    <div class="modal" id="balModal">
        <div class="modal-content">
            <h3 id="balModalTitle">Edit Balance</h3>
            <input type="number" id="balInput" class="modal-input" placeholder="Enter amount" step="0.01">
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeBalModal()">Cancel</button>
                <button class="modal-btn btn-confirm" onclick="submitBalance()">Submit</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let tgId = urlParams.get('tg_id');
        if (!tgId && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgId = tg.initDataUnsafe.user.id;
        }

        let allUsersList = [];
        let selectedUserTgId = '';
        let balanceActionType = '';

        async function fetchUsers() {
            const container = document.getElementById('users-app');
            try {
                const res = await fetch(`/api/action?action=get_all_users&tg_id=${tgId}`);
                const data = await res.json();

                if (!res.ok || !data.success) {
                    container.innerHTML = `<div class="error-msg"><h3>Access Denied</h3><p>${data.message || 'Unauthorized'}</p></div>`;
                    return;
                }

                allUsersList = data.users;
                renderUsers(allUsersList);

            } catch (err) {
                console.error(err);
                document.getElementById('users-app').innerHTML = `<div class="error-msg"><h3>Connection Error</h3><p>Failed to load users data.</p></div>`;
            }
        }

        function renderUsers(users) {
            const container = document.getElementById('users-app');
            let html = `
                <div class="header">
                    <h2>👥 User Management</h2>
                    <p>Total Users: <b>${users.length}</b></p>
                </div>
                <input type="text" class="search-box" placeholder="Search by name, username or ID..." onkeyup="searchUsers(this.value)">
                <div id="usersListContainer">
            `;

            if (users.length === 0) {
                html += `<p style="text-align: center; color: #94a3b8; padding: 20px;">No users found.</p>`;
            } else {
                users.forEach(u => {
                    let statusBadge = u.status === 'banned' ? '<span class="badge badge-banned">Banned</span>' : '<span class="badge badge-active">Active</span>';
                    let roleBadge = u.role === 'admin' ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>';
                    let nextStatus = u.status === 'banned' ? 'active' : 'banned';
                    let nextRole = u.role === 'admin' ? 'user' : 'admin';

                    html += `
                        <div class="user-card">
                            <div class="user-header">
                                <span class="user-name">${u.first_name || 'No Name'} (${u.username ? '@'+u.username : 'No Username'})</span>
                                <span class="user-bal">৳${parseFloat(u.balance || 0).toFixed(2)}</span>
                            </div>
                            <div class="user-details">
                                <span>ID: ${u.telegram_id}</span>
                                ${roleBadge}
                                ${statusBadge}
                            </div>
                            <div class="user-actions">
                                <button class="u-btn btn-bal" onclick="openBalModal('${u.telegram_id}', 'balance_add')">+ Bal</button>
                                <button class="u-btn btn-bal" style="background: #1d4ed8;" onclick="openBalModal('${u.telegram_id}', 'balance_sub')">- Bal</button>
                                <button class="u-btn btn-status" onclick="updateUserAction('${u.telegram_id}', 'toggle_status', '${nextStatus}')">${u.status === 'banned' ? 'Unban' : 'Ban'}</button>
                                <button class="u-btn btn-role" onclick="updateUserAction('${u.telegram_id}', 'toggle_role', '${nextRole}')">${u.role === 'admin' ? 'Make User' : 'Make Admin'}</button>
                            </div>
                            <div style="margin-top: 6px;">
                                <button class="u-btn btn-del" style="width: 100%; padding: 5px;" onclick="deleteUser('${u.telegram_id}')">🗑 Delete User</button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div><a href="dashboard.html?tg_id=${tgId}" class="btn-back">⬅ Back to Admin Dashboard</a>`;
            container.innerHTML = html;
        }

        function searchUsers(query) {
            const q = query.toLowerCase();
            const filtered = allUsersList.filter(u => 
                (u.first_name && u.first_name.toLowerCase().includes(q)) ||
                (u.username && u.username.toLowerCase().includes(q)) ||
                String(u.telegram_id).includes(q)
            );
            
            const listContainer = document.getElementById('usersListContainer');
            if(!listContainer) return;

            let html = '';
            filtered.forEach(u => {
                let statusBadge = u.status === 'banned' ? '<span class="badge badge-banned">Banned</span>' : '<span class="badge badge-active">Active</span>';
                let roleBadge = u.role === 'admin' ? '<span class="badge badge-admin">Admin</span>' : '<span class="badge badge-user">User</span>';
                let nextStatus = u.status === 'banned' ? 'active' : 'banned';
                let nextRole = u.role === 'admin' ? 'user' : 'admin';

                html += `
                    <div class="user-card">
                        <div class="user-header">
                            <span class="user-name">${u.first_name || 'No Name'} (${u.username ? '@'+u.username : 'No Username'})</span>
                            <span class="user-bal">৳${parseFloat(u.balance || 0).toFixed(2)}</span>
                        </div>
                        <div class="user-details">
                            <span>ID: ${u.telegram_id}</span>
                            ${roleBadge}
                            ${statusBadge}
                        </div>
                        <div class="user-actions">
                            <button class="u-btn btn-bal" onclick="openBalModal('${u.telegram_id}', 'balance_add')">+ Bal</button>
                            <button class="u-btn btn-bal" style="background: #1d4ed8;" onclick="openBalModal('${u.telegram_id}', 'balance_sub')">- Bal</button>
                            <button class="u-btn btn-status" onclick="updateUserAction('${u.telegram_id}', 'toggle_status', '${nextStatus}')">${u.status === 'banned' ? 'Unban' : 'Ban'}</button>
                            <button class="u-btn btn-role" onclick="updateUserAction('${u.telegram_id}', 'toggle_role', '${nextRole}')">${u.role === 'admin' ? 'Make User' : 'Make Admin'}</button>
                        </div>
                        <div style="margin-top: 6px;">
                            <button class="u-btn btn-del" style="width: 100%; padding: 5px;" onclick="deleteUser('${u.telegram_id}')">🗑 Delete User</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html || '<p style="text-align: center; color: #94a3b8; padding: 20px;">No users found.</p>';
        }

        function openBalModal(targetId, type) {
            selectedUserTgId = targetId;
            balanceActionType = type;
            document.getElementById('balModalTitle').innerText = type === 'balance_add' ? 'Add Balance to User' : 'Subtract Balance from User';
            document.getElementById('balInput').value = '';
            document.getElementById('balModal').style.display = 'flex';
        }

        function closeBalModal() {
            document.getElementById('balModal').style.display = 'none';
        }

        async function submitBalance() {
            const amount = document.getElementById('balInput').value;
            if (!amount || isNaN(amount) || amount <= 0) {
                alert('Please enter a valid amount.');
                return;
            }

            await sendActionRequest({
                target_tg_id: selectedUserTgId,
                sub_action: balanceActionType,
                value: parseFloat(amount)
            });
            closeBalModal();
        }

        async function updateUserAction(targetId, subAction, val) {
            await sendActionRequest({
                target_tg_id: targetId,
                sub_action: subAction,
                value: val
            });
        }

        async function deleteUser(targetId) {
            if (!confirm('Are you sure you want to delete this user completely?')) return;
            await sendActionRequest({
                target_tg_id: targetId,
                sub_action: 'delete_user',
                value: ''
            });
        }

        async function sendActionRequest(payload) {
            try {
                const res = await fetch('/api/action', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'manage_user_action',
                        tg_id: tgId,
                        ...payload
                    })
                });
                const result = await res.json();
                if (result.success) {
                    fetchUsers();
                } else {
                    alert('Failed: ' + (result.message || 'Unknown error'));
                }
            } catch (err) {
                alert('Server error occurred.');
            }
        }

        fetchUsers();
    </script>
</body>
</html>
