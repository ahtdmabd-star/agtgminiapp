<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AL-HUDA TECH GLOBAL - Admin Dashboard</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.75);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 16px; }
        .app-container { width: 100%; max-width: 520px; margin: 0 auto; }
        
        .header-box { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 14px 18px; border-radius: 16px; }
        .brand-title { font-size: 0.95rem; font-weight: 800; color: var(--accent-color); letter-spacing: 0.5px; }
        .back-btn { background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; text-decoration: none; transition: 0.2s; }
        .back-btn:hover { border-color: var(--accent-color); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
        .stat-card { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); padding: 14px; border-radius: 16px; position: relative; overflow: hidden; }
        .stat-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.2rem; font-weight: 800; color: var(--text-main); }
        .currency-tag { font-size: 0.7rem; color: var(--accent-color); margin-left: 2px; }

        .section-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; margin-left: 4px; }
        
        /* প্রতি লাইনে একাধিক বাটন সুন্দরভাবে সাজানোর জন্য গ্রিড */
        .admin-menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
        
        .menu-btn { background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); color: var(--text-main); padding: 12px 10px; border-radius: 14px; font-weight: 600; font-size: 0.78rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; text-align: center; gap: 8px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); min-height: 85px; }
        .menu-btn:hover { border-color: var(--accent-color); transform: translateY(-2px); background: rgba(56, 189, 248, 0.08); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15); }
        
        .menu-icon { width: 32px; height: 32px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--accent-color); }
        
        .spinner { width: 24px; height: 24px; border: 2px solid rgba(255,255,255,0.1); border-top: 2px solid var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- Header Section -->
        <div class="header-box">
            <div class="brand-title">ADMIN DASHBOARD</div>
            <a href="/admin/index.html" class="back-btn">&larr; Back</a>
        </div>

        <!-- Total Stats Grid (Top Two Columns) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-value" id="total-users">
                    <div class="spinner" style="width:20px; height:20px; border-width:2px;"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Balance</div>
                <div class="stat-value" id="total-balance">
                    <div class="spinner" style="width:20px; height:20px; border-width:2px;"></div>
                </div>
            </div>
        </div>

        <div class="section-title">Management Modules</div>

        <!-- Management Buttons Grid with Professional Icons -->
        <div class="admin-menu-grid">
            
            <!-- User Management -->
            <a href="/admin/users.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                </div>
                <span>User Management</span>
            </a>

            <!-- Balance Management -->
            <a href="/admin/balance.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                </div>
                <span>Balance Management</span>
            </a>

            <!-- Deposit Management -->
            <a href="/admin/deposit.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/></svg>
                </div>
                <span>Deposit Management</span>
            </a>

            <!-- Withdraw Management -->
            <a href="/admin/withdraw.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v10m0 0l4-4m-4 4l-4-4"/><path d="M19 21H5a2 2 0 0 1-2-2v-3"/></svg>
                </div>
                <span>Withdraw Management</span>
            </a>

            <!-- Accounts / Ledger (হিসাব কিতাব) -->
            <a href="/admin/accounts.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10M6 14h6"/></svg>
                </div>
                <span>Accounts & Ledger</span>
            </a>

            <!-- Manage Gift Codes -->
            <a href="/admin/gift-codes.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                </div>
                <span>Manage Gift Codes</span>
            </a>

            <!-- Micro Task Management -->
            <a href="/admin/micro-task.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                </div>
                <span>Micro Tasks</span>
            </a>

            <!-- Referral Management -->
            <a href="/admin/referral.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                </div>
                <span>Referral Control</span>
            </a>

            <!-- Gmail Verification Tasks -->
            <a href="/admin/social-gmail.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <span>Gmail Tasks</span>
            </a>

            <!-- Telegram Force-Sub Control -->
            <a href="/admin/social-telegram.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2l-19 9 7 3.5L18 7l-7.5 9.5L14 22l7.5-20z"></path></svg>
                </div>
                <span>Telegram Sub</span>
            </a>

            <!-- Facebook Task Management -->
            <a href="/admin/social-facebook.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                </div>
                <span>Facebook Tasks</span>
            </a>

            <!-- Instagram Task Management -->
            <a href="/admin/social-instagram.html" class="menu-btn">
                <div class="menu-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </div>
                <span>Instagram Tasks</span>
            </a>

            <!-- Global System Settings -->
            <a href="/admin/settings.html" class="menu-btn" style="grid-column: span 2;">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div class="menu-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </div>
                    <span>Global System Settings</span>
                </div>
            </a>

        </div>

    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        async function loadAdminStats() {
            const tgUser = tg.initDataUnsafe?.user;
            const telegramId = tgUser ? tgUser.id : null;

            if (!telegramId) {
                alert("Unauthorized Access!");
                window.location.href = '/app/index.html';
                return;
            }

            try {
                const response = await fetch(`/api/admin-stats?telegram_id=${telegramId}`);
                const result = await response.json();

                if (result.success) {
                    document.getElementById('total-users').innerText = result.totalUsers;
                    document.getElementById('total-balance').innerHTML = `${result.totalBalance}<span class="currency-tag">USD</span>`;
                } else {
                    alert(result.message || "Access Denied");
                    window.location.href = '/app/index.html';
                }

            } catch (err) {
                console.error(err);
                document.getElementById('total-users').innerText = "0";
                document.getElementById('total-balance').innerHTML = `0.00<span class="currency-tag">USD</span>`;
            }
        }

        loadAdminStats();
    </script>
</body>
</html>
