<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Referral Settings - AL-HUDA TECH GLOBAL</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(0, 180, 255, .12), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 255, 170, .10), transparent 35%),
                #07111f;
            color: #fff;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 14px;
            background: rgba(255,255,255,.06);
            color: #fff;
            cursor: pointer;
            font-size: 20px;
        }

        .title-area h1 {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .title-area p {
            font-size: 13px;
            color: #8fa2b8;
        }

        .card {
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.10);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,.20);
        }

        .rate-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rate-label {
            color: #9eb0c4;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .rate-value {
            font-size: 30px;
            font-weight: 700;
        }

        .rate-badge {
            padding: 9px 14px;
            border-radius: 12px;
            background: rgba(0, 220, 160, .12);
            border: 1px solid rgba(0, 220, 160, .25);
            color: #4ff0bd;
            font-weight: 700;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: #b7c5d6;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid rgba(255,255,255,.12);
            outline: none;
            border-radius: 14px;
            background: rgba(0,0,0,.20);
            color: #fff;
            padding: 14px;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(0, 210, 255, .55);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.5;
        }

        .save-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #00b8ff, #00d79b);
            color: #001018;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-btn:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: rgba(0, 220, 150, .10);
            border: 1px solid rgba(0, 220, 150, .25);
            color: #5af2bd;
        }

        .message.error {
            display: block;
            background: rgba(255, 70, 90, .10);
            border: 1px solid rgba(255, 70, 90, .25);
            color: #ff8b9a;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat {
            padding: 15px;
            border-radius: 16px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.08);
        }

        .stat-label {
            font-size: 12px;
            color: #91a3b7;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .loading {
            opacity: .55;
            pointer-events: none;
        }

        @media (max-width: 420px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 16px;
            }

            .rate-value {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="topbar">
        <button class="back-btn" onclick="goBack()">‹</button>

        <div class="title-area">
            <h1>Referral Settings</h1>
            <p>Manage referral commission settings</p>
        </div>
    </div>

    <!-- Current Rate -->
    <div class="card">
        <div class="rate-box">
            <div>
                <div class="rate-label">Current Commission</div>
                <div class="rate-value" id="currentRate">Loading...</div>
            </div>

            <div class="rate-badge">REFERRAL</div>
        </div>
    </div>

    <!-- Settings -->
    <div class="card">

        <div class="field">
            <label for="percentage">
                Commission Percentage
            </label>

            <input
                type="number"
                id="percentage"
                min="0"
                max="100"
                step="0.01"
                placeholder="5.00"
            >
        </div>

        <div class="field">
            <label for="description">
                Referral Description
            </label>

            <textarea
                id="description"
                placeholder="Enter referral description..."
            ></textarea>
        </div>

        <button
            class="save-btn"
            id="saveBtn"
            onclick="saveSettings()"
        >
            Save Referral Settings
        </button>

        <div id="message" class="message"></div>

    </div>

    <!-- Statistics -->
    <div class="card">

        <div class="rate-label" style="margin-bottom:14px;">
            Referral Statistics
        </div>

        <div class="stats-grid">

            <div class="stat">
                <div class="stat-label">
                    Total Referrals
                </div>

                <div
                    class="stat-value"
                    id="totalReferrals"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Total Commission
                </div>

                <div
                    class="stat-value"
                    id="totalCommission"
                >
                    0.00
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Commission Records
                </div>

                <div
                    class="stat-value"
                    id="commissionCount"
                >
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Status
                </div>

                <div
                    class="stat-value"
                    id="statusText"
                >
                    Active
                </div>
            </div>

        </div>

    </div>

</div>


<script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();
    }


    // --------------------------------------------------
    // Telegram User
    // --------------------------------------------------

    function getTelegramId() {

        if (
            tg &&
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user &&
            tg.initDataUnsafe.user.id
        ) {
            return String(tg.initDataUnsafe.user.id);
        }

        return null;
    }


    // --------------------------------------------------
    // Elements
    // --------------------------------------------------

    const percentageInput =
        document.getElementById("percentage");

    const descriptionInput =
        document.getElementById("description");

    const currentRate =
        document.getElementById("currentRate");

    const saveBtn =
        document.getElementById("saveBtn");

    const message =
        document.getElementById("message");

    const totalReferrals =
        document.getElementById("totalReferrals");

    const totalCommission =
        document.getElementById("totalCommission");

    const commissionCount =
        document.getElementById("commissionCount");

    const statusText =
        document.getElementById("statusText");


    // --------------------------------------------------
    // Message
    // --------------------------------------------------

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    // --------------------------------------------------
    // Load Settings
    // --------------------------------------------------

    async function loadSettings() {

        const telegramId = getTelegramId();

        if (!telegramId) {

            showMessage(
                "Telegram user information was not found.",
                "error"
            );

            return;
        }

        try {

            const response = await fetch(
                `/api/referral?action=admin-get&telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {

                throw new Error(
                    result.message ||
                    "Failed to load referral settings."
                );
            }

            const settings = result.settings;

            const percentage =
                Number(settings.percentage || 0);

            percentageInput.value =
                percentage.toFixed(2);

            descriptionInput.value =
                settings.description || "";

            currentRate.textContent =
                percentage.toFixed(2) + "%";

            await loadStatistics();

        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Failed to load referral settings.",
                "error"
            );
        }
    }


    // --------------------------------------------------
    // Load Statistics
    // --------------------------------------------------

    async function loadStatistics() {

        const telegramId = getTelegramId();

        if (!telegramId) return;

        try {

            const response = await fetch(
                `/api/referral?action=admin-stats&telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );

            const result = await response.json();

            if (!response.ok || !result.success) {
                return;
            }

            const stats =
                result.statistics || {};

            totalReferrals.textContent =
                Number(stats.total_referrals || 0);

            totalCommission.textContent =
                Number(stats.total_commissions || 0)
                    .toFixed(2);

            commissionCount.textContent =
                Number(stats.commission_count || 0);

            statusText.textContent = "Active";

        } catch (error) {

            console.error(
                "Statistics error:",
                error
            );
        }
    }


    // --------------------------------------------------
    // Save Settings
    // --------------------------------------------------

    async function saveSettings() {

        const telegramId = getTelegramId();

        if (!telegramId) {

            showMessage(
                "Telegram user information was not found.",
                "error"
            );

            return;
        }

        const percentage =
            Number(percentageInput.value);

        const description =
            descriptionInput.value.trim();


        // Validation

        if (
            !Number.isFinite(percentage) ||
            percentage < 0 ||
            percentage > 100
        ) {

            showMessage(
                "Commission percentage must be between 0 and 100.",
                "error"
            );

            return;
        }


        if (!description) {

            showMessage(
                "Referral description is required.",
                "error"
            );

            return;
        }


        if (description.length > 2000) {

            showMessage(
                "Referral description is too long.",
                "error"
            );

            return;
        }


        // Loading state

        saveBtn.disabled = true;

        saveBtn.textContent =
            "Saving...";

        message.className =
            "message";

        try {

            const response = await fetch(
                "/api/referral?action=admin-update",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({

                        telegram_id:
                            telegramId,

                        percentage:
                            percentage,

                        description:
                            description

                    })
                }
            );


            const result =
                await response.json();


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.message ||
                    "Failed to save referral settings."
                );
            }


            // Update UI

            const saved =
                result.settings || {};

            const savedPercentage =
                Number(
                    saved.percentage ??
                    percentage
                );

            percentageInput.value =
                savedPercentage.toFixed(2);

            descriptionInput.value =
                saved.description ??
                description;

            currentRate.textContent =
                savedPercentage.toFixed(2) + "%";


            showMessage(
                result.message ||
                "Referral settings updated successfully.",
                "success"
            );


            await loadStatistics();


        } catch (error) {

            console.error(error);

            showMessage(
                error.message ||
                "Failed to save referral settings.",
                "error"
            );

        } finally {

            saveBtn.disabled = false;

            saveBtn.textContent =
                "Save Referral Settings";
        }
    }


    // --------------------------------------------------
    // Back
    // --------------------------------------------------

    function goBack() {

        window.location.href =
            "/admin/index.html";
    }


    // --------------------------------------------------
    // Start
    // --------------------------------------------------

    loadSettings();

</script>

</body>
</html>
