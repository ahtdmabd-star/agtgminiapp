<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AL-HUDA TECH GLOBAL - Withdraw</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#050914;
    color:#ffffff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

#header{
    width:100%;
}

#footer{
    width:100%;
    margin-top:30px;
}

.container{
    width:100%;
    max-width:720px;
    margin:auto;
    padding:20px 16px 30px;
}

.page-card{
    background:#101a2e;
    border:1px solid #243552;
    border-radius:22px;
    padding:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.title-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:20px;
}

.title-left{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#08a4e5,#087dc0);
    font-size:24px;
    font-weight:800;
}

.title h1{
    font-size:20px;
    color:#31b9ff;
    margin-bottom:5px;
}

.title p{
    color:#8997aa;
    font-size:13px;
}

.back-btn{
    border:0;
    background:#26344d;
    color:#fff;
    padding:11px 17px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.balance-card{
    background:linear-gradient(135deg,#102c43,#102039);
    border:1px solid #1c4c69;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
}

.balance-label{
    color:#93a4b8;
    font-size:13px;
}

.balance{
    font-size:30px;
    font-weight:800;
    margin-top:5px;
    color:#39c0ff;
}

.section{
    margin-top:18px;
}

label{
    display:block;
    color:#dbe5f1;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    height:50px;
    border:1px solid #30415d;
    background:#0b1322;
    color:#fff;
    border-radius:12px;
    padding:0 14px;
    outline:none;
    font-size:15px;
}

select:focus,
input:focus{
    border-color:#12a8e8;
}

.info-box{
    background:#0a1322;
    border:1px solid #263853;
    border-radius:15px;
    padding:15px;
    margin-top:15px;
}

.info-line{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:6px 0;
    font-size:14px;
}

.info-line span:first-child{
    color:#8797ab;
}

.info-line span:last-child{
    color:#fff;
    font-weight:700;
}

.net{
    color:#32c4ff !important;
    font-size:16px;
}

.submit-btn{
    width:100%;
    height:52px;
    border:0;
    border-radius:13px;
    background:linear-gradient(135deg,#099ddd,#087fbe);
    color:#fff;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    margin-top:20px;
}

.submit-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.history-btn{
    width:100%;
    height:48px;
    margin-top:11px;
    border:1px solid #334663;
    border-radius:13px;
    background:#1a273d;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.message{
    display:none;
    padding:13px;
    border-radius:12px;
    margin-top:15px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#103c2d;
    border:1px solid #17694c;
    color:#67e5ae;
}

.message.error{
    display:block;
    background:#461f24;
    border:1px solid #79363d;
    color:#ff9ca4;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:1000;
    padding:20px;
    overflow:auto;
}

.modal-box{
    width:100%;
    max-width:650px;
    margin:30px auto;
    background:#101a2e;
    border:1px solid #2a3c59;
    border-radius:20px;
    padding:20px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}

.modal-header h2{
    font-size:19px;
}

.close{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#28364d;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.history-item{
    border:1px solid #293b58;
    background:#0b1424;
    border-radius:15px;
    padding:15px;
    margin-bottom:12px;
}

.history-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.method{
    font-weight:800;
    color:#36bbff;
}

.status{
    font-size:12px;
    font-weight:800;
    padding:5px 9px;
    border-radius:8px;
}

.status.pending{
    background:#493d13;
    color:#ffd75e;
}

.status.approved{
    background:#123d2e;
    color:#65e7ad;
}

.status.rejected{
    background:#481f25;
    color:#ff9da5;
}

.history-line{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:4px 0;
    color:#9aaabd;
    font-size:13px;
}

.history-line strong{
    color:#fff;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#8493a7;
}

.loading{
    text-align:center;
    padding:30px;
    color:#7f91a8;
}

@media(max-width:480px){
    .container{
        padding:14px 12px 25px;
    }

    .page-card{
        padding:16px;
    }

    .title h1{
        font-size:17px;
    }

    .logo{
        width:46px;
        height:46px;
    }

    .back-btn{
        padding:9px 13px;
    }
}
</style>
</head>

<body>

<div id="header"></div>

<main class="container">

<div class="page-card">

    <div class="title-row">

        <div class="title-left">

            <div class="logo">A</div>

            <div class="title">
                <h1>AL-HUDA TECH GLOBAL</h1>
                <p>Withdrawal Management</p>
            </div>

        </div>

        <button
            class="back-btn"
            onclick="goBack()">
            Back
        </button>

    </div>


    <div class="balance-card">

        <div class="balance-label">
            Available Balance
        </div>

        <div class="balance">
            $<span id="balance">0.00</span>
        </div>

    </div>


    <div class="section">

        <label>
            Withdrawal Method
        </label>

        <select id="method">

            <option value="bKash">
                bKash
            </option>

            <option value="Nagad">
                Nagad
            </option>

            <option value="Rocket">
                Rocket
            </option>

            <option value="Upay">
                Upay
            </option>

            <option value="USDT-BEP20">
                USDT-BEP20
            </option>

            <option value="USDT-TRC20">
                USDT-TRC20
            </option>

        </select>

    </div>


    <div class="section">

        <label id="accountLabel">
            Account Number
        </label>

        <input
            id="account"
            type="text"
            placeholder="Enter account number"
            autocomplete="off">

    </div>


    <div class="section">

        <label>
            Withdrawal Amount (USD)
        </label>

        <input
            id="amount"
            type="number"
            min="0"
            step="0.01"
            placeholder="Enter USD amount">

    </div>


    <div class="info-box">

        <div class="info-line">
            <span>Minimum Withdrawal</span>
            <span>$<span id="minimum">0.00</span></span>
        </div>

        <div class="info-line">
            <span>USD to BDT Rate</span>
            <span>৳<span id="rate">0.00</span></span>
        </div>

        <div class="info-line">
            <span>Gross Amount</span>
            <span>৳<span id="gross">0.00</span></span>
        </div>

        <div class="info-line">
            <span>Withdrawal Charge</span>
            <span>
                <span id="chargePercent">0.00</span>%
                -
                ৳<span id="charge">0.00</span>
            </span>
        </div>

        <div class="info-line">
            <span>Net Amount</span>
            <span class="net">
                ৳<span id="net">0.00</span>
            </span>
        </div>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <button
        id="submitBtn"
        class="submit-btn"
        onclick="submitWithdrawal()">
        Submit Withdrawal
    </button>


    <button
        class="history-btn"
        onclick="openHistory()">
        Withdrawal History
    </button>

</div>

</main>


<div
    id="historyModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Withdrawal History</h2>

            <button
                class="close"
                onclick="closeHistory()">
                ×
            </button>

        </div>

        <div id="historyContent">
            <div class="loading">
                Loading...
            </div>
        </div>

    </div>

</div>


<div id="footer"></div>


<script>

const tg =
    window.Telegram &&
    window.Telegram.WebApp
        ? window.Telegram.WebApp
        : null;

if (tg) {
    tg.ready();
    tg.expand();
}


const API = "/api/api-combined";

let telegramId = "";

let currentBalance = 0;
let minimum = 1;
let rate = 100;
let chargePercent = 5;


function getTelegramId(){

    if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user &&
        tg.initDataUnsafe.user.id
    ) {
        return String(
            tg.initDataUnsafe.user.id
        );
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("telegram_id") ||
        ""
    );
}


async function loadIncludes(){

    try {

        const header =
            await fetch(
                "/includes/header.html",
                {
                    cache:"no-store"
                }
            );

        if(header.ok){
            document.getElementById(
                "header"
            ).innerHTML =
                await header.text();
        }

    } catch(error){
        console.error(
            "Header load error:",
            error
        );
    }


    try {

        const footer =
            await fetch(
                "/includes/footer.html",
                {
                    cache:"no-store"
                }
            );

        if(footer.ok){
            document.getElementById(
                "footer"
            ).innerHTML =
                await footer.text();
        }

    } catch(error){
        console.error(
            "Footer load error:",
            error
        );
    }
}


function goBack(){

    if(
        document.referrer &&
        new URL(
            document.referrer
        ).origin ===
        window.location.origin
    ){
        window.history.back();
        return;
    }

    window.location.href = "/";
}


function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );

    box.textContent = text;

    box.className =
        "message " + type;
}


async function loadInfo(){

    if(!telegramId){

        showMessage(
            "Telegram account information was not found.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `${API}?route=withdraw&action=info&telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(!response.ok || !data.success){

            throw new Error(
                data.message ||
                "Unable to load account information."
            );
        }


        currentBalance =
            Number(data.balance || 0);

        minimum =
            Number(
                data.settings.min_withdraw_usd
            );

        rate =
            Number(
                data.settings.usd_to_bdt_rate
            );

        chargePercent =
            Number(
                data.settings.withdraw_charge_percent
            );


        document.getElementById(
            "balance"
        ).textContent =
            currentBalance.toFixed(2);

        document.getElementById(
            "minimum"
        ).textContent =
            minimum.toFixed(2);

        document.getElementById(
            "rate"
        ).textContent =
            rate.toFixed(2);

        document.getElementById(
            "chargePercent"
        ).textContent =
            chargePercent.toFixed(2);


        calculate();

    } catch(error){

        showMessage(
            error.message ||
            "Unable to connect to server.",
            "error"
        );
    }
}


function calculate(){

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        ) || 0;

    const gross =
        amount * rate;

    const charge =
        gross *
        chargePercent /
        100;

    const net =
        gross - charge;


    document.getElementById(
        "gross"
    ).textContent =
        gross.toFixed(2);

    document.getElementById(
        "charge"
    ).textContent =
        charge.toFixed(2);

    document.getElementById(
        "net"
    ).textContent =
        Math.max(
            0,
            net
        ).toFixed(2);
}


document.getElementById(
    "amount"
).addEventListener(
    "input",
    calculate
);


document.getElementById(
    "method"
).addEventListener(
    "change",
    function(){

        const method =
            this.value;

        const label =
            document.getElementById(
                "accountLabel"
            );

        const input =
            document.getElementById(
                "account"
            );

        if(
            method === "USDT-BEP20" ||
            method === "USDT-TRC20"
        ){

            label.textContent =
                "Wallet Address";

            input.placeholder =
                "Enter USDT wallet address";

        } else {

            label.textContent =
                "Account Number";

            input.placeholder =
                "Enter account number";
        }
    }
);


async function submitWithdrawal(){

    const button =
        document.getElementById(
            "submitBtn"
        );

    const method =
        document.getElementById(
            "method"
        ).value;

    const account =
        document.getElementById(
            "account"
        ).value.trim();

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        );


    if(!telegramId){

        showMessage(
            "Telegram account information was not found.",
            "error"
        );

        return;
    }


    if(!account){

        showMessage(
            "Please enter your account number or wallet address.",
            "error"
        );

        return;
    }


    if(
        !Number.isFinite(amount) ||
        amount <= 0
    ){

        showMessage(
            "Please enter a valid withdrawal amount.",
            "error"
        );

        return;
    }


    if(amount < minimum){

        showMessage(
            `Minimum withdrawal is $${minimum.toFixed(2)}.`,
            "error"
        );

        return;
    }


    if(amount > currentBalance){

        showMessage(
            "Insufficient balance.",
            "error"
        );

        return;
    }


    const confirmed =
        window.confirm(
            `Confirm withdrawal of $${amount.toFixed(2)}?`
        );

    if(!confirmed){
        return;
    }


    button.disabled = true;
    button.textContent =
        "Submitting...";

    showMessage(
        "",
        ""
    );


    try {

        const response =
            await fetch(
                `${API}?route=withdraw`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        action:"submit",
                        telegram_id:
                            telegramId,
                        method:
                            method,
                        account_number:
                            account,
                        amount_usd:
                            amount
                    })
                }
            );


        const data =
            await response.json();


        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Withdrawal request failed."
            );
        }


        showMessage(
            "Withdrawal request submitted successfully.",
            "success"
        );


        document.getElementById(
            "amount"
        ).value = "";

        document.getElementById(
            "account"
        ).value = "";


        currentBalance -= amount;

        document.getElementById(
            "balance"
        ).textContent =
            Math.max(
                0,
                currentBalance
            ).toFixed(2);

        calculate();


    } catch(error){

        showMessage(
            error.message ||
            "Unable to submit withdrawal.",
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "Submit Withdrawal";
    }
}


async function openHistory(){

    document.getElementById(
        "historyModal"
    ).style.display =
        "block";

    document.getElementById(
        "historyContent"
    ).innerHTML =
        `<div class="loading">
            Loading withdrawal history...
        </div>`;


    try {

        const response =
            await fetch(
                `${API}?route=withdraw&action=history&telegram_id=${encodeURIComponent(telegramId)}`,
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){

            throw new Error(
                data.message ||
                "Unable to load history."
            );
        }


        renderHistory(
            data.withdrawals || []
        );

    } catch(error){

        document.getElementById(
            "historyContent"
        ).innerHTML =
            `<div class="message error">
                ${escapeHtml(error.message)}
            </div>`;
    }
}


function closeHistory(){

    document.getElementById(
        "historyModal"
    ).style.display =
        "none";
}


function renderHistory(rows){

    const box =
        document.getElementById(
            "historyContent"
        );

    if(!rows.length){

        box.innerHTML =
            `<div class="empty">
                No withdrawal history found.
            </div>`;

        return;
    }


    box.innerHTML =
        rows.map(row => {

            const status =
                String(
                    row.status || ""
                ).toLowerCase();

            return `
                <div class="history-item">

                    <div class="history-top">

                        <div class="method">
                            ${escapeHtml(row.method)}
                        </div>

                        <div class="status ${status}">
                            ${escapeHtml(
                                String(
                                    row.status
                                ).toUpperCase()
                            )}
                        </div>

                    </div>

                    <div class="history-line">
                        <span>Amount</span>
                        <strong>
                            $${Number(
                                row.amount_usd
                            ).toFixed(2)}
                        </strong>
                    </div>

                    <div class="history-line">
                        <span>Gross</span>
                        <strong>
                            ৳${Number(
                                row.gross_bdt
                            ).toFixed(2)}
                        </strong>
                    </div>

                    <div class="history-line">
                        <span>Charge</span>
                        <strong>
                            ৳${Number(
                                row.charge_bdt
                            ).toFixed(2)}
                        </strong>
                    </div>

                    <div class="history-line">
                        <span>Net</span>
                        <strong>
                            ৳${Number(
                                row.net_bdt
                            ).toFixed(2)}
                        </strong>
                    </div>

                    <div class="history-line">
                        <span>Date</span>
                        <strong>
                            ${escapeHtml(
                                formatDate(
                                    row.created_at
                                )
                            )}
                        </strong>
                    </div>

                    ${
                        row.admin_note
                        ?
                        `<div class="history-line">
                            <span>Admin Note</span>
                            <strong>
                                ${escapeHtml(
                                    row.admin_note
                                )}
                            </strong>
                        </div>`
                        :
                        ""
                    }

                </div>
            `;

        }).join("");
}


function formatDate(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(value);

    if(
        Number.isNaN(
            date.getTime()
        )
    ){
        return String(value);
    }

    return date.toLocaleString();
}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


window.addEventListener(
    "click",
    function(event){

        const modal =
            document.getElementById(
                "historyModal"
            );

        if(event.target === modal){
            closeHistory();
        }
    }
);


telegramId = getTelegramId();

loadIncludes();
loadInfo();

</script>

</body>
</html>
