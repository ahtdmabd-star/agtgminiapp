<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Instagram 2FA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#070b12;--card:#0f1622;--card2:#121c2a;--text:#f5f7fb;--muted:#91a0b5;--line:#1e2a3a;--accent:#7c5cff;--ok:#28c76f;--bad:#ff5d73;--warn:#ffb020}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:560px;margin:auto;padding:18px 14px 40px}
.top,.row,.itemtop{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{position:sticky;top:0;z-index:10;padding:8px 0 10px;background:linear-gradient(180deg,var(--bg) 72%,transparent)}.brand{min-width:0}.back-btn{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#ff9a3c,#e1306c,#833ab4)}h1{font-size:21px;margin:0 0 3px}.sub,.label,.count,.meta{color:var(--muted);font-size:12px}
button,input,textarea{font:inherit}button{cursor:pointer}.back-btn,.tutorial,.refresh,.copy-btn{border:1px solid var(--line);background:var(--card);color:#fff;border-radius:11px;padding:9px 12px;font-weight:700}.back-btn{display:flex;align-items:center;gap:6px;padding:9px 11px}.back-btn span{font-size:12px}.copy-btn{min-width:68px;background:#171f2d}.copy-btn.copied{background:#1d6b48;border-color:#2b9d6b}
.balance,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 35px #0005;margin-top:12px}.test-password-row{border-top:1px solid var(--line);margin-top:13px;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:12px}.display-password{margin-top:5px;font-size:15px;font-weight:800;letter-spacing:.5px;color:#fff;word-break:break-all}.money{font-size:28px;font-weight:800}.rate{border-top:1px solid var(--line);margin-top:13px;padding-top:13px;display:flex;justify-content:space-between;font-size:13px}
.section-title{font-size:16px;font-weight:800;margin:0 0 14px}.instructions{white-space:pre-wrap;color:#cbd5e1;font-size:13px;line-height:1.6;background:var(--card2);border:1px solid var(--line);padding:12px;border-radius:13px;margin-bottom:15px}
.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:700;color:#cbd5e1;margin-bottom:7px}.req{color:#ff7183}
input,textarea{width:100%;border:1px solid #253247;background:#0b121d;color:#fff;border-radius:12px;padding:12px;outline:0}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c5cff22}textarea{min-height:92px;resize:vertical}
.consent{display:flex;gap:9px;color:#aebbd0;font-size:12px;line-height:1.5;margin:12px 0 15px}.consent input{width:18px;min-width:18px;height:18px;accent-color:var(--accent)}
.submit{width:100%;border:0;border-radius:13px;padding:13px;background:linear-gradient(135deg,var(--accent),#5d3ee8);color:#fff;font-weight:800}.submit:disabled{opacity:.55;cursor:not-allowed}
.item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px}.username{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis}.status{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 8px;border-radius:999px}.pending{background:#ffb02022;color:var(--warn)}.checking{background:#7c5cff22;color:#b8a8ff}.approved{background:#28c76f22;color:var(--ok)}.rejected{background:#ff5d7322;color:var(--bad)}.meta{display:flex;justify-content:space-between;margin-top:8px}.note{margin-top:8px;padding:9px;background:#0b121d;border-radius:9px;font-size:12px;white-space:pre-wrap}.empty{text-align:center;color:var(--muted);padding:22px}
.loader{position:fixed;inset:0;background:#03070dbb;backdrop-filter:blur(5px);display:grid;place-items:center;z-index:20}.loaderbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;text-align:center}.spinner{width:30px;height:30px;border:3px solid #29364a;border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;margin:auto auto 10px}@keyframes s{to{transform:rotate(360deg)}}.check{font-size:40px;color:var(--ok);margin-bottom:5px}.hidden{display:none!important}.toast{position:fixed;left:14px;right:14px;bottom:18px;max-width:530px;margin:auto;background:#111a27;border:1px solid var(--line);padding:12px;border-radius:13px;z-index:30;font-size:13px}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <button id="back" class="back-btn" type="button" aria-label="Go back">← <span>Back</span></button>
  <div class="brand">
    <div class="logo">◎</div>
    <div><h1>Instagram 2FA</h1><div class="sub" id="welcome">Secure test submission</div></div>
  </div>
  <button id="tutorial" class="tutorial hidden" type="button">Tutorial</button>
</header>
<section class="balance">
  <div class="row">
    <div><div class="label">Current Balance</div><div class="money" id="balance">$0.00</div></div>
    <div class="count">Submissions<br><b id="count24">—</b><br>last 24 hours</div>
  </div>
  <div class="rate"><span>Current rate</span><b id="rate">$0.002</b></div>
  <div class="test-password-row">
    <div>
      <div class="label">Current Test Password</div>
      <div id="displayPassword" class="display-password">Loading…</div>
    </div>
    <button id="copyPassword" class="copy-btn" type="button">Copy</button>
  </div>
</section>
<section class="card"><h2 class="section-title">Instructions</h2><div id="instructions" class="instructions">Loading…</div>
<form id="form" novalidate>
<div class="field"><label>Instagram Username <span class="req">*</span></label><input id="username" maxlength="255" autocomplete="off" placeholder="Enter test username" required></div>
<div class="field"><label>Test Password <span class="req">*</span></label><input id="password" type="password" maxlength="500" autocomplete="off" placeholder="Enter Test Password" required></div>
<div id="fields"></div>
<label class="consent"><input id="consent" type="checkbox" required><span>I confirm this is for the test workflow and I agree to the current instructions.</span></label>
<button id="submit" class="submit" type="submit">Submit Test</button>
</form></section>
<section class="card"><div class="row"><h2 class="section-title">Submission History</h2><button id="refresh" class="refresh">Refresh</button></div><div id="history"><div class="empty">Loading history…</div></div></section>
</main>
<div id="loader" class="loader hidden"><div class="loaderbox"><div id="spin" class="spinner"></div><div id="loaderText">Loading…</div></div></div><div id="toast" class="toast hidden"></div>
<script>
"use strict";
(()=>{const tg=window.Telegram?.WebApp;const A="/api/instagram-2fa",M="/api/action";const $=id=>document.getElementById(id);let busy=false,settings={};
if(tg){tg.ready();tg.expand();try{tg.enableClosingConfirmation()}catch(e){}}
function id(){return tg?.initDataUnsafe?.user?.id?String(tg.initDataUnsafe.user.id):""}
function msg(s,ok=false){const e=$("toast");e.textContent=s;e.className="toast";if(ok)e.style.borderColor="#28c76f66";e.classList.remove("hidden");clearTimeout(msg.t);msg.t=setTimeout(()=>e.classList.add("hidden"),3500)}
function money(v){const n=Number(v);return Number.isFinite(n)?"$"+n.toFixed(8).replace(/0+$/,"").replace(/\.$/,""):"$0.00"}
function busyOn(t){$("loaderText").textContent=t;$("spin").classList.remove("hidden");$("loader").classList.remove("hidden")}
function busyOff(){$("loader").classList.add("hidden")}
async function req(url,data){const c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},credentials:"same-origin",cache:"no-store",body:JSON.stringify(data),signal:c.signal});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw Error(j?.message||"Request failed");return j}finally{clearTimeout(tm)}}
async function get(url,data){const q=new URLSearchParams(data),c=new AbortController(),tm=setTimeout(()=>c.abort(),12000);try{const r=await fetch(url+"?"+q,{headers:{"Accept":"application/json"},credentials:"same-origin",cache:"no-store",signal:c.signal});const j=await r.json().catch(()=>null);if(!r.ok||!j?.success)throw Error(j?.message||"Request failed");return j}finally{clearTimeout(tm)}}
function renderFields(fs){const w=$("fields");w.replaceChildren();(Array.isArray(fs)?fs:[]).forEach(f=>{const idn=Number(f.id);if(!idn)return;const box=document.createElement("div");box.className="field";const l=document.createElement("label");l.textContent=String(f.field_name||"Custom field");if(Number(f.required)===1){const s=document.createElement("span");s.className="req";s.textContent=" *";l.append(s)}let x=String(f.field_type)==="textarea"?document.createElement("textarea"):document.createElement("input");if(x.tagName==="INPUT")x.type="text";x.id="f"+idn;x.dataset.id=idn;x.maxLength=5000;x.placeholder=String(f.placeholder||"");x.autocomplete="off";x.required=Number(f.required)===1;box.append(l,x);w.append(box)})}
function renderHistory(xs){const w=$("history");w.replaceChildren();if(!xs?.length){w.innerHTML='<div class="empty">No submissions yet.</div>';return}xs.forEach(x=>{const c=document.createElement("div");c.className="item";const top=document.createElement("div");top.className="itemtop";const u=document.createElement("b");u.className="username";u.textContent=x.instagram_username||"Unknown";const s=document.createElement("span"),st=String(x.status||"pending");s.className="status "+(["pending","checking","approved","rejected"].includes(st)?st:"pending");s.textContent=st;top.append(u,s);const m=document.createElement("div");m.className="meta";m.innerHTML="<span>"+(x.submitted_at||"—")+"</span><span>"+(st==="approved"?"+":"Rate ")+money(st==="approved"?x.credited_usd:x.rate_usd)+"</span>";c.append(top,m);if(x.admin_note){const n=document.createElement("div");n.className="note";n.textContent=String(x.admin_note);c.append(n)}w.append(c)})}
async function settingsLoad(t){const [s,f]=await Promise.all([get(A,{action:"get_settings",tg_id:t}),get(A,{action:"get_fields",tg_id:t})]);settings=s.settings||{};$("rate").textContent=money(settings.rate_usd);const pass=String(settings.test_password||"").trim();$("displayPassword").textContent=pass||"Not configured";$("copyPassword").disabled=!pass;$("copyPassword").dataset.password=pass;$("instructions").textContent=settings.instructions||"No additional instructions have been configured.";renderFields(f.fields||[]);const url=String(settings.tutorial_url||"");$("tutorial").classList.toggle("hidden",!url);$("tutorial").onclick=()=>{try{tg?.openLink(url)}catch(e){window.open(url,"_blank","noopener,noreferrer")}};$("submit").disabled=settings.enabled===false||busy}
async function historyLoad(t){const j=await get(A,{action:"get_history",tg_id:t});renderHistory(j.submissions||[]);$("count24").textContent=Number.isFinite(Number(j.submissions_24h))?String(Number(j.submissions_24h)):"—"}
async function balanceLoad(t){try{const j=await get(M,{action:"get_user",tg_id:t});$("balance").textContent=money(j.user?.balance);if(j.user?.first_name)$("welcome").textContent="Hello, "+String(j.user.first_name).slice(0,60)}catch(e){}}
async function refresh(silent=true){const t=id();if(!t){$("submit").disabled=true;$("instructions").textContent="Open this page inside the Telegram Mini App.";return}if(!silent)busyOn("Updating…");try{await Promise.all([settingsLoad(t),historyLoad(t),balanceLoad(t)])}catch(e){if(!silent)msg(e.message)}finally{if(!silent)busyOff()}}
$("refresh").onclick=()=>refresh(false);
$("back").onclick=()=>{try{if(tg?.close){tg.close();return}}catch(e){}if(window.history.length>1)window.history.back()};
$("copyPassword").onclick=async()=>{const v=String($("copyPassword").dataset.password||"");if(!v)return;try{await navigator.clipboard.writeText(v)}catch(e){const ta=document.createElement("textarea");ta.value=v;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove()}$("copyPassword").textContent="Copied";$("copyPassword").classList.add("copied");setTimeout(()=>{$("copyPassword").textContent="Copy";$("copyPassword").classList.remove("copied")},1400)};
$("form").onsubmit=async ev=>{ev.preventDefault();if(busy)return;const t=id();if(!t)return msg("Open this page inside the Telegram Mini App.");const u=$("username").value.trim(),p=$("password").value;if(!u)return msg("Instagram username is required.");if(!p)return msg("Test Password is required.");if(!$("consent").checked)return msg("Please accept the consent checkbox.");const fv={};document.querySelectorAll("#fields [data-id]").forEach(x=>fv[x.dataset.id]=x.value);busy=true;$("submit").disabled=true;busyOn("Submitting your test…");try{const j=await req(A,{action:"submit",tg_id:t,instagram_username:u,test_password:p,consent:1,field_values:fv});$("password").value="";$("username").value="";document.querySelectorAll("#fields [data-id]").forEach(x=>x.value="");$("consent").checked=false;$("spin").classList.add("hidden");$("loaderText").innerHTML='<div class="check">✓</div><div>Submitted successfully</div>';setTimeout(async()=>{busyOff();await refresh(true);msg("Submission #"+j.submission_id+" is pending review.",true)},900)}catch(e){busyOff();msg(e.message||"Submission failed.")}finally{busy=false;$("submit").disabled=settings.enabled===false}};
(async()=>{if(!id()){ $("welcome").textContent="Open inside Telegram to continue";$("submit").disabled=true;return}busyOn("Loading Instagram 2FA…");await refresh(true).catch(()=>{});busyOff()})();
setInterval(()=>{if(!document.hidden&&!busy)refresh(true)},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!busy)refresh(true)});
})();
</script>
</body></html>
