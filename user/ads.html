<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>User Rewards Panel</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- TailwindCSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
        }
        .btn-action {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.2s ease-in-out;
        }
        .btn-action:active {
            transform: scale(0.96);
        }
        .btn-exchange {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            transition: all 0.2s ease-in-out;
        }
        .btn-exchange:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="p-4 pb-20 max-w-md mx-auto">

    <!-- Header Section with Coin Balance and Exchange Button -->
    <div class="glass-card p-4 mb-5 flex justify-between items-center shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                <i class="fa-solid fa-user"></i>
            </div>
            <div>
                <h2 id="userName" class="font-semibold text-sm text-gray-200">Loading...</h2>
                <p id="userIdDisplay" class="text-xs text-gray-400">ID: --</p>
            </div>
        </div>
        
        <!-- Coins & Exchange Button -->
        <div class="text-right flex flex-col items-end gap-1">
            <p class="text-xs text-gray-400">Coins</p>
            <div class="flex items-center justify-end gap-1 text-amber-400 font-bold text-base">
                <i class="fa-solid fa-coins"></i>
                <span id="userCoins">0</span>
            </div>
            <button onclick="exchangeCoins()" class="btn-exchange px-3 py-1 rounded-lg text-[10px] font-bold text-white shadow-md flex items-center gap-1 mt-1">
                <i class="fa-solid fa-arrow-right-arrow-left"></i> Exchange
            </button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div class="space-y-4">
        <!-- Daily Stats -->
        <div class="glass-card p-4 flex justify-around text-center shadow-lg">
            <div>
                <p class="text-xs text-gray-400">Daily Ads</p>
                <p id="dailyAds" class="text-base font-bold text-indigo-400">0</p>
            </div>
            <div class="border-r border-gray-700/60"></div>
            <div>
                <p class="text-xs text-gray-400">Completed</p>
                <p id="totalAds" class="text-base font-bold text-emerald-400">0</p>
            </div>
            <div class="border-r border-gray-700/60"></div>
            <div>
                <p class="text-xs text-gray-400">Incomplete</p>
                <p id="incompleteAds" class="text-base font-bold text-rose-400">0</p>
            </div>
        </div>

        <!-- GO TO VIEW ADS BUTTON -->
        <div class="glass-card p-6 text-center space-y-3 shadow-xl">
            <div class="w-12 h-12 rounded-full bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 text-xl mx-auto">
                <i class="fa-solid fa-play"></i>
            </div>
            <div>
                <h3 class="font-bold text-base text-gray-100">Interactive Media Hub</h3>
                <p class="text-xs text-gray-400 mt-1">Watch short promotional clips to collect virtual reward coins.</p>
            </div>
            <button onclick="goToAdPage()" class="btn-action w-full py-3 rounded-xl font-bold text-xs text-white shadow-lg flex items-center justify-center gap-2">
                <span>Go to View Ads</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) tg.expand();

        const user = tg?.initDataUnsafe?.user || { id: "12345678", first_name: "Member" };
        const userId = user.id;

        document.getElementById('userName').innerText = user.first_name;
        document.getElementById('userIdDisplay').innerText = `ID: ${userId}`;

        // Sync Statistics
        async function fetchUserStats() {
            try {
                const res = await fetch(`/api/ads/user-stats/${userId}`);
                const json = await res.json();
                if (json.success) {
                    const data = json.data;
                    document.getElementById('userCoins').innerText = data.coins || 0;
                    document.getElementById('dailyAds').innerText = data.daily_completed_tasks || 0;
                    document.getElementById('totalAds').innerText = data.completed_tasks || 0;
                    document.getElementById('incompleteAds').innerText = data.incomplete_tasks || 0;
                }
            } catch (e) {
                console.error("Stats Sync Error:", e);
            }
        }

        // Exchange Coins Function
        async function exchangeCoins() {
            try {
                const res = await fetch('/api/ads/convert-coins', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId })
                });

                const json = await res.json();
                alert(json.message);
                if (json.success) {
                    fetchUserStats();
                }
            } catch (e) {
                alert("Exchange Request Failed!");
            }
        }

        // Redirect to Public Ad Page with Encrypted/Query Session
        function goToAdPage() {
            window.location.href = `public_ads.html?uid=${userId}`;
        }

        // Initial Stats Fetch
        fetchUserStats();
    </script>
</body>
</html>
