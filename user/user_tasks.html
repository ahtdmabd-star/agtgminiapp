<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07111f">
  <title>Tasks | AL-HUDA TECH GLOBAL</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg:#07111f;
      --card:#0d1b2e;
      --card2:#10243d;
      --line:rgba(255,255,255,.085);
      --text:#f4f7fb;
      --muted:#9eafc3;
      --blue:#2563eb;
      --blue2:#60a5fa;
      --green:#22c55e;
      --danger:#ef4444;
      --shadow:0 18px 50px rgba(0,0,0,.32);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    body{padding:14px 13px 30px}
    button{font:inherit}

    .page{width:100%;max-width:600px;margin:0 auto}

    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:15px;
    }

    .back-btn{
      width:43px;
      height:43px;
      flex:0 0 43px;
      border:1px solid var(--line);
      border-radius:13px;
      background:rgba(255,255,255,.045);
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
    }

    .back-btn:active{transform:scale(.97)}
    .back-btn svg{width:20px;height:20px}

    .brand{min-width:0}
    .brand-title{
      font-size:18px;
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .brand-subtitle{margin-top:2px;color:var(--muted);font-size:12px}

    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:23px;
      padding:25px 20px 23px;
      background:linear-gradient(145deg,var(--card),var(--card2));
      box-shadow:var(--shadow);
    }

    .hero:before{
      content:"";
      position:absolute;
      width:190px;height:190px;
      border-radius:50%;
      background:rgba(37,99,235,.13);
      top:-110px;right:-75px;
    }

    .hero:after{
      content:"";
      position:absolute;
      width:150px;height:150px;
      border-radius:50%;
      background:rgba(96,165,250,.055);
      bottom:-100px;left:-65px;
    }

    .hero-content{position:relative;z-index:1}

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(59,130,246,.10);
      border:1px solid rgba(96,165,250,.16);
      color:#a9d0ff;
      font-size:10px;
      font-weight:800;
      letter-spacing:.75px;
      text-transform:uppercase;
    }

    .eyebrow-dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--blue2);
    }

    h1{
      margin:13px 0 8px;
      font-size:28px;
      line-height:1.16;
      letter-spacing:-.65px;
    }

    .hero-text{
      margin:0;
      color:var(--muted);
      font-size:13.5px;
      line-height:1.7;
      max-width:500px;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:10px;
      margin:22px 2px 11px;
    }

    .section-title{
      font-size:16px;
      font-weight:850;
    }

    .section-subtitle{
      color:#72859b;
      font-size:11px;
      margin-top:3px;
    }

    .task-list{
      display:grid;
      gap:10px;
    }

    .task-card{
      position:relative;
      display:flex;
      align-items:center;
      gap:13px;
      width:100%;
      min-height:70px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:17px;
      background:linear-gradient(145deg,#0c1a2c,#0b192b);
      box-shadow:0 8px 25px rgba(0,0,0,.15);
      text-align:left;
      color:#fff;
      cursor:pointer;
      transition:transform .14s ease,border-color .14s ease;
    }

    .task-card:active{transform:scale(.985)}
    .task-card.available{border-color:rgba(59,130,246,.28)}
    .task-card.coming{opacity:.88}

    .task-icon{
      width:45px;height:45px;flex:0 0 45px;
      border-radius:13px;
      display:grid;place-items:center;
      background:rgba(59,130,246,.10);
      border:1px solid rgba(96,165,250,.13);
      color:#8ec2ff;
    }

    .task-card.coming .task-icon{
      background:rgba(255,255,255,.045);
      color:#8395aa;
    }

    .task-icon svg{width:22px;height:22px}

    .task-info{min-width:0;flex:1}
    .task-name{
      font-size:13.5px;
      font-weight:800;
      line-height:1.3;
    }

    .task-description{
      margin-top:4px;
      color:#8295aa;
      font-size:11px;
      line-height:1.4;
    }

    .task-arrow{
      width:30px;height:30px;flex:0 0 30px;
      display:grid;place-items:center;
      border-radius:9px;
      background:rgba(255,255,255,.04);
      color:#7890aa;
    }

    .task-card.available .task-arrow{
      background:rgba(59,130,246,.12);
      color:#8ec2ff;
    }

    .task-arrow svg{width:16px;height:16px}

    .footer{
      margin-top:20px;
      text-align:center;
      color:#6f8298;
      font-size:10.5px;
      line-height:1.6;
    }

    .loading,.denied{
      padding:45px 20px;
      text-align:center;
      border:1px solid var(--line);
      border-radius:20px;
      background:var(--card);
      color:var(--muted);
    }

    .spinner{
      width:30px;height:30px;
      margin:0 auto 12px;
      border:3px solid rgba(255,255,255,.10);
      border-top-color:var(--blue2);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin{to{transform:rotate(360deg)}}

    .denied h2{margin:0 0 8px;color:#fff;font-size:19px}
    .denied p{margin:0;line-height:1.65;font-size:13px}

    @media(max-width:380px){
      body{padding:11px 10px 25px}
      .hero{padding:22px 16px 20px}
      h1{font-size:25px}
    }
  </style>
</head>

<body>
<main class="page">

  <header class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Go back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </button>

    <div class="brand">
      <div class="brand-title">AL-HUDA TECH GLOBAL</div>
      <div class="brand-subtitle">Tasks &amp; Jobs</div>
    </div>
  </header>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      Verifying your account...
    </div>
  </div>

</main>

<script>
(function(){

  const tg = window.Telegram && window.Telegram.WebApp;

  if(tg){
    tg.ready();
    tg.expand();

    try{
      tg.BackButton.show();
      tg.BackButton.onClick(goBack);
    }catch(e){}
  }

  function getTelegramId(){
    const params = new URLSearchParams(window.location.search);
    return params.get("tg_id") ||
      (tg && tg.initDataUnsafe && tg.initDataUnsafe.user
        ? tg.initDataUnsafe.user.id
        : "");
  }

  function goBack(){
    if(window.history.length > 1){
      window.history.back();
    }else if(tg){
      tg.close();
    }
  }

  /*
    ============================================================
    TASK BUTTON CONFIGURATION
    ============================================================
    To add a new button later, only add another object here.

    type: "active"       = opens the specified page
    type: "coming_soon"  = opens /coming_soon.html

    This makes it possible to add unlimited buttons without
    changing the HTML structure below.
    ============================================================
  */

  const TASKS = [

    {
      name: "Instagram Sell",
      description: "Instagram account related earning opportunities",
      type: "active",
      url: "/user/instagram.html",
      icon: "instagram"
    },

    {
      name: "Gmail Sell",
      description: "Gmail related earning opportunities",
      type: "coming_soon",
      icon: "mail"
    },

    {
      name: "Facebook Sell",
      description: "Facebook account related earning opportunities",
      type: "coming_soon",
      icon: "facebook"
    },

    {
      name: "Facebook 2FA",
      description: "Facebook 2FA related tasks",
      type: "coming_soon",
      icon: "shield"
    },

    {
      name: "Micro Task",
      description: "Complete simple online tasks and earn",
      type: "coming_soon",
      icon: "tasks"
    },

    {
      name: "Survey",
      description: "Complete surveys and earn",
      type: "coming_soon",
      icon: "survey"
    },

    {
      name: "Quiz",
      description: "Answer quizzes and earn rewards",
      type: "coming_soon",
      icon: "quiz"
    },

    {
      name: "Gift Code",
      description: "Redeem available gift code opportunities",
      type: "coming_soon",
      icon: "gift"
    },

    {
      name: "Top Referral",
      description: "Referral competition and rewards",
      type: "coming_soon",
      icon: "referral"
    },

    {
      name: "Leaderboard",
      description: "View top performers and rankings",
      type: "coming_soon",
      icon: "leaderboard"
    },

    {
      name: "Spin & Earn",
      description: "Spin and earn rewards",
      type: "coming_soon",
      icon: "spin"
    },

    {
      name: "Play & Earn",
      description: "Play games and earn rewards",
      type: "coming_soon",
      icon: "game"
    },

    {
      name: "Watch & Earn",
      description: "Watch available content and earn",
      type: "coming_soon",
      icon: "play"
    }

  ];

  const icons = {

    instagram: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>`,

    mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>`,

    facebook: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8h3V4h-3c-3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"/></svg>`,

    shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 20 6v5c0 5-3.3 8.2-8 10-4.7-1.8-8-5-8-10V6l8-3z"/><path d="m9 12 2 2 4-4"/></svg>`,

    tasks: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5M8 16h7"/></svg>`,

    survey: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>`,

    quiz: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 1 1 4.3 2.2c-1.1.7-1.8 1.2-1.8 2.5"/><path d="M12 17h.01"/></svg>`,

    gift: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M12 9v11M3 13h18M5 9h14"/><path d="M12 9H8.5a2.5 2.5 0 1 1 2.5-2.5V9zM12 9h3.5A2.5 2.5 0 1 0 13 6.5V9z"/></svg>`,

    referral: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3.5 19c.6-3 2.4-4.5 5.5-4.5s4.9 1.5 5.5 4.5M15 14c2.7.1 4.4 1.7 4.8 4"/></svg>`,

    leaderboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10h4v10M10 20V5h4v15M15 20v-7h4v7"/></svg>`,

    spin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m12 4 2.5 5.5L20 12l-5.5 2.5L12 20l-2.5-5.5L4 12l5.5-2.5L12 4z"/><path d="M12 12h.01"/></svg>`,

    game: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8h10c3 0 5 2.4 5 5.5S20.2 19 18 19c-1.7 0-3-1.1-4.2-3H10.2C9 17.9 7.7 19 6 19c-2.2 0-4-2.4-4-5.5S4 8 7 8z"/><path d="M7 11v4M5 13h4M16.5 12.5h.01M18.5 14.5h.01"/></svg>`,

    play: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9z"/></svg>`
  };

  function renderTasks(){

    const app = document.getElementById("app");

    app.innerHTML = `
      <section class="hero">
        <div class="hero-content">
          <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            Work • Learn • Earn
          </div>

          <h1>Build Your Career &amp; Earn Online with AL-HUDA TECH GLOBAL</h1>

          <p class="hero-text">
            Explore available earning opportunities, complete tasks carefully,
            develop your skills and take the next step toward building your
            online career with AL-HUDA TECH GLOBAL.
          </p>
        </div>
      </section>

      <div class="section-head">
        <div>
          <div class="section-title">Our Tasks &amp; Jobs</div>
          <div class="section-subtitle">Choose an available opportunity</div>
        </div>
      </div>

      <section class="task-list" id="taskList"></section>

      <div class="footer">
        Please follow the instructions of each task carefully.<br>
        More earning opportunities will be added soon.
      </div>
    `;

    const list = document.getElementById("taskList");

    TASKS.forEach(task => {

      const available = task.type === "active";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "task-card " + (available ? "available" : "coming");

      button.innerHTML = `
        <span class="task-icon">
          ${icons[task.icon] || icons.tasks}
        </span>

        <span class="task-info">
          <span class="task-name">${escapeHtml(task.name)}</span>
          <span class="task-description">${escapeHtml(task.description)}</span>
        </span>

        <span class="task-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      `;

      button.addEventListener("click", () => openTask(task));
      list.appendChild(button);
    });
  }

  function openTask(task){

    const tgId = getTelegramId();

    let target;

    if(task.type === "active"){
      target = task.url;
    }else{
      target = "/coming_soon.html";
    }

    if(tgId){
      target += (target.includes("?") ? "&" : "?") +
        "tg_id=" + encodeURIComponent(tgId);
    }

    window.location.href = target;
  }

  function escapeHtml(value){
    return String(value)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  /*
    Account access check.
    The page requires a Telegram user ID and verifies the account
    through the same existing AHTG API before rendering tasks.
  */
  async function verifyUser(){

    const tgId = getTelegramId();

    if(!tgId){
      showDenied("Please open this page from your authorized AL-HUDA TECH GLOBAL account.");
      return;
    }

    try{

      const response = await fetch(
        `/api/action?action=get_user&tg_id=${encodeURIComponent(tgId)}`,
        {
          method:"GET",
          headers:{
            "Accept":"application/json",
            ...(tg && tg.initData ? {"X-Telegram-Init-Data":tg.initData} : {})
          },
          cache:"no-store"
        }
      );

      if(!response.ok){
        throw new Error("Authentication request failed");
      }

      const data = await response.json();

      if(!data || data.success === false || !data.user){
        showDenied("Your account could not be verified. Please reopen the Mini App.");
        return;
      }

      renderTasks();

    }catch(error){

      console.error(error);

      showDenied(
        "Unable to verify your account right now. Please try again from the AL-HUDA TECH GLOBAL Mini App."
      );
    }
  }

  function showDenied(message){

    document.getElementById("app").innerHTML = `
      <section class="denied">
        <h2>Access Verification Required</h2>
        <p>${escapeHtml(message)}</p>
      </section>
    `;
  }

  document.getElementById("backBtn").addEventListener("click",goBack);

  verifyUser();

})();
</script>
</body>
</html>
