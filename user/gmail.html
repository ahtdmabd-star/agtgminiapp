<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Hub Center</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #090d16;
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 45%),
                radial-gradient(at 90% 90%, rgba(168, 85, 247, 0.15) 0px, transparent 45%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Highlit Dynamic Button Design */
        .highlight-btn {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.8) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(129, 140, 248, 0.25);
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3), 0 0 12px 0 rgba(99, 102, 241, 0.1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .highlight-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, #818cf8, #c084fc);
            border-radius: 3px 0 0 3px;
            box-shadow: 0 0 8px #818cf8;
        }

        .highlight-btn:active {
            transform: scale(0.98);
            border-color: rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.3);
            background: linear-gradient(135deg, rgba(49, 46, 129, 0.5) 0%, rgba(30, 41, 59, 0.8) 100%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen">

    <!-- Access Restricted Guard Notice (US English) -->
    <div id="access-denied" class="hidden text-center p-6 m-auto highlight-btn rounded-3xl max-w-xs">
        <i class="fa-solid fa-shield-halved text-rose-500 text-5xl mb-4 animate-bounce"></i>
        <h2 class="text-xl font-bold text-white mb-2">Access Restricted</h2>
        <p class="text-xs text-slate-400">This application is designed to run exclusively within the Telegram Mini App environment.</p>
    </div>

    <!-- Main Content Container -->
    <div id="hub-content" class="w-full max-w-md flex flex-col min-h-screen">
        
        <!-- App Bar Navigation Header -->
        <div class="glass-header sticky top-0 z-50 px-4 py-4 rounded-b-2xl mb-4">
            <div class="flex items-center justify-between gap-3">
                <button onclick="goBackPrevious()" class="w-10 h-10 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-slate-300 hover:text-white active:scale-90 transition">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </button>

                <div class="text-center flex-1">
                    <h1 id="page-headline" class="text-lg font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-indigo-300 via-purple-200 to-pink-300">
                        Gmail Hub Center
                    </h1>
                    <p id="page-subheadline" class="text-[11px] font-medium text-slate-400 leading-tight">
                        Select your preferred service below
                    </p>
                </div>

                <div class="w-10"></div>
            </div>
        </div>

        <!-- Buttons Vertical List Area -->
        <div class="px-4 pb-8 space-y-3.5 flex-1 overflow-y-auto" id="buttons-list">
            <div class="text-center py-12">
                <i class="fa-solid fa-circle-notch fa-spin text-indigo-400 text-3xl mb-3"></i>
                <p class="text-xs font-medium text-slate-400">Loading services...</p>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        function goBackPrevious() {
            if (window.history.length > 1) {
                window.history.back();
            } else if (tg && tg.BackButton.isVisible) {
                tg.close();
            } else {
                window.location.href = 'index.html';
            }
        }

        function verifyTelegramEnvironment() {
            if (!tg || !tg.initData || tg.initData === "") {
                document.getElementById('hub-content').classList.add('hidden');
                document.getElementById('access-denied').classList.remove('hidden');
                return false;
            }

            tg.expand();
            tg.ready();

            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(function() { goBackPrevious(); });
            }

            return true;
        }

        async function fetchHubData() {
            try {
                const response = await fetch('/api/hub/data');
                const result = await response.json();

                if (result.success) {
                    if (result.settings) {
                        document.getElementById('page-headline').innerText = result.settings.page_headline || 'Gmail Hub Center';
                        document.getElementById('page-subheadline').innerText = result.settings.page_subheadline || 'Select your preferred service below';
                    }

                    const btnContainer = document.getElementById('buttons-list');
                    btnContainer.innerHTML = '';

                    if (!result.buttons || result.buttons.length === 0) {
                        btnContainer.innerHTML = `
                            <div class="highlight-btn p-8 rounded-2xl text-center">
                                <i class="fa-solid fa-inbox text-slate-600 text-3xl mb-2"></i>
                                <p class="text-xs text-slate-400 font-medium">No services currently available</p>
                            </div>`;
                        return;
                    }

                    result.buttons.forEach(btn => {
                        const btnEl = document.createElement('a');
                        
                        let userPath = btn.button_action;
                        if (!userPath.startsWith('http://') && !userPath.startsWith('https://')) {
                            userPath = userPath.startsWith('/') ? `user${userPath}` : `/${userPath}`;
                        }
                        
                        btnEl.href = userPath;
                        btnEl.className = 'highlight-btn w-full p-4 rounded-2xl flex items-center justify-between group';
                        
                        btnEl.innerHTML = `
                            <div class="flex items-center space-x-3.5">
                                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 border border-indigo-400/30 flex items-center justify-center text-indigo-300 group-hover:scale-105 group-hover:text-white transition-all shadow-inner">
                                    ${btn.button_icon || '<i class="fa-solid fa-link"></i>'}
                                </div>
                                <span class="font-bold text-sm tracking-wide text-slate-100 group-hover:text-white">${btn.button_name}</span>
                            </div>
                            <div class="w-8 h-8 rounded-xl bg-slate-800/80 flex items-center justify-center border border-slate-700/60 shadow-sm">
                                <i class="fa-solid fa-chevron-right text-xs text-slate-400 group-hover:translate-x-0.5 group-hover:text-indigo-300 transition"></i>
                            </div>
                        `;
                        btnContainer.appendChild(btnEl);
                    });
                }
            } catch (err) {
                console.error("Hub Load Error:", err);
            }
        }

        if (verifyTelegramEnvironment()) {
            fetchHubData();
        }
    </script>
</body>
</html>
