<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gmail Hub</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #0f172a, #020617);
            min-height: 100vh;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-btn:active {
            transform: scale(0.97);
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(129, 140, 248, 0.4);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <!-- সিকিউরিটি গার্ড ব্লক স্ক্রিন (টেলিগ্রাম ছাড়া ওপেন করলে দেখাবে) -->
    <div id="access-denied" class="hidden text-center p-6 glass-card rounded-2xl max-w-sm">
        <i class="fa-solid fa-shield-halved text-rose-500 text-5xl mb-4 animate-bounce"></i>
        <h2 class="text-xl font-bold text-white mb-2">অ্যাক্সেস সংরক্ষিত</h2>
        <p class="text-xs text-slate-400">এই পেজটি শুধুমাত্র টেলিগ্রাম মিনি অ্যাপ অ্যাপ্লিকেশনের ভেতরে ব্যবহারযোগ্য।</p>
    </div>

    <!-- মূল জিমেইল হাব অ্যাপ -->
    <div id="hub-content" class="w-full max-w-md space-y-6">
        
        <!-- হেডলাইন সেকশন (এডমিন প্যানেল থেকে পরিবর্তনযোগ্য) -->
        <div class="text-center space-y-2 glass-card p-6 rounded-3xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-24 h-24 bg-indigo-500/20 rounded-full blur-2xl"></div>
            <h1 id="page-headline" class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
                Loading...
            </h1>
            <p id="page-subheadline" class="text-xs font-medium text-slate-400">
                Please wait while loading content
            </p>
        </div>

        <!-- ডাইনামিক বাটন লিস্ট -->
        <div id="buttons-list" class="space-y-3">
            <!-- বাটনগুলো এপিআই থেকে অটো আসবে -->
        </div>

    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;

        // টেলিগ্রাম এনভায়রনমেন্ট ভেরিফিকেশন
        function verifyTelegramEnvironment() {
            if (!tg || !tg.initData || tg.initData === "") {
                document.getElementById('hub-content').classList.add('hidden');
                document.getElementById('access-denied').classList.remove('hidden');
                return false;
            }
            tg.expand();
            tg.ready();
            return true;
        }

        // এপিআই থেকে ডাটা লোড
        async function fetchHubData() {
            try {
                const response = await fetch('/api/hub/data');
                const result = await response.json();

                if (result.success) {
                    document.getElementById('page-headline').innerText = result.settings.page_headline;
                    document.getElementById('page-subheadline').innerText = result.settings.page_subheadline;

                    const btnContainer = document.getElementById('buttons-list');
                    btnContainer.innerHTML = '';

                    if(result.buttons.length === 0) {
                        btnContainer.innerHTML = `<p class="text-center text-xs text-slate-500">কোনো বাটন পাওয়া যায়নি।</p>`;
                        return;
                    }

                    result.buttons.forEach(btn => {
                        const btnEl = document.createElement('a');
                        btnEl.href = btn.button_action;
                        btnEl.className = 'glass-btn w-full p-4 rounded-2xl flex items-center justify-between text-slate-100 group';
                        
                        btnEl.innerHTML = `
                            <div class="flex items-center space-x-3.5">
                                <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition">
                                    ${btn.button_icon}
                                </div>
                                <span class="font-semibold text-sm tracking-wide">${btn.button_name}</span>
                            </div>
                            <i class="fa-solid fa-chevron-right text-xs text-slate-500 group-hover:translate-x-1 transition"></i>
                        `;
                        btnContainer.appendChild(btnEl);
                    });
                }
            } catch (err) {
                console.error("Hub Load Error:", err);
            }
        }

        if (verifyTelegramEnvironment()) {
            fetchHubData();
        }
    </script>
</body>
</html>
