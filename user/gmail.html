<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social-X | Gmail Sell Center</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }

        .brand-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-balance-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #818cf8;
        }

        .back-btn {
            display: none;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 16px;
        }

        .back-btn:active {
            background: var(--glass-hover);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }
              .categories-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-card:hover, .category-card:active {
            background: var(--glass-hover);
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
        }

        .category-info h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .category-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .category-rate {
            text-align: right;
        }

        .rate-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--success);
        }

        .rate-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
      }
        .alert-box {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 10px;
            padding: 12px;
            font-size: 0.85rem;
            color: #fcd34d;
            margin-bottom: 16px;
            line-height: 1.4;
            white-space: pre-line;
        }

        .task-box {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .task-box label-title {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .task-box .task-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-all;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 6px;
        }

        .btn-submit:active {
            opacity: 0.85;
              }
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 20px 0 10px 0;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .history-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-checking { background: rgba(99, 102, 241, 0.15); color: #818cf8; }
        .status-approved { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-reject { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .loading-spinner {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <div class="brand-title">Social-X Gmail</div>
            <div class="user-balance-badge" id="userBalanceDisplay">$0.0000</div>
        </div>

        <button class="back-btn" id="backBtn" onclick="goHome()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Back to Categories
        </button>

        <!-- VIEW 1: Categories Home Grid -->
        <div id="homeView" class="view-section active">
            <div class="section-title">Select Category</div>
            <div class="categories-grid" id="categoriesGrid">
                <!-- Dynamically Rendered Categories -->
            </div>
        </div>

        <!-- VIEW 2: Dynamic Submission Form Panel -->
        <div id="formView" class="view-section">
            <div id="categoryRules" class="alert-box" style="display:none;"></div>
            
            <div id="customTaskContainer" style="display:none;" class="task-box">
                <span class="task-box label-title">Assigned Full Name</span>
                <div class="task-value" id="taskFullName">Loading...</div>
            </div>

            <form id="gmailSubmitForm" onsubmit="handleGmailSubmit(event)">
                <input type="hidden" id="selectedCategory" name="category">
                <input type="hidden" id="poolIdInput" name="pool_id" value="0">

                <div class="form-group" id="groupUsername">
                    <label id="usernameLabelText">Gmail Username / Email</label>
                    <input type="text" class="form-control" id="gmailUsername" name="gmail_username" placeholder="Enter full gmail or username" required>
                </div>

                <div class="form-group" id="groupPassword">
                    <label id="passwordLabelText">Gmail Password</label>
                    <input type="text" class="form-control" id="gmailPassword" name="gmail_password" placeholder="Enter gmail password" required>
                </div>

                <div class="form-group" id="groupOldDays" style="display:none;">
                    <label>Account Age (in Days)</label>
                    <input type="text" class="form-control" id="oldDaysInput" name="old_days" placeholder="e.g. 180 days">
                </div>

                <div class="form-group" id="groupUsedReason" style="display:none;">
                    <label>Where / How was it used?</label>
                    <input type="text" class="form-control" id="usedReasonInput" name="used_reason" placeholder="Mention usage details">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Submit Gmail</button>
            </form>

            <div class="section-title">Recent Submissions</div>
            <div class="history-list" id="historyList">
                <div class="loading-spinner">Loading history...</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const tgId = tg.initDataUnsafe?.user?.id || '123456789'; // Fallback for testing
        const API_ENDPOINT = '/api/gmail-sell';

        const categoriesMeta = [
            { key: 'new_random', name: 'New Random Gmail', desc: 'Create fresh random gmail accounts' },
            { key: 'new_custom_password', name: 'Fixed Password Gmail', desc: 'Create with admin fixed password' },
            { key: 'new_custom_name', name: 'Custom Name Gmail', desc: 'Create using exact pool full name' },
            { key: 'old_old', name: 'Old Gmail Accounts', desc: 'Submit aged operational accounts' },
            { key: 'used_used', name: 'Used Gmail Accounts', desc: 'Submit previously used accounts' }
        ];

        let currentCategory = '';

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoriesGrid();
            // Handle Telegram native back button behaviour
            tg.BackButton.onClick(() => {
                goHome();
            });
        });

        function renderCategoriesGrid() {
            const grid = document.getElementById('categoriesGrid');
            grid.innerHTML = categoriesMeta.map(cat => `
                <div class="category-card" onclick="selectCategory('${cat.key}')">
                    <div class="category-info">
                        <h3>${cat.name}</h3>
                        <p>${cat.desc}</p>
                    </div>
                    <div class="category-rate">
                        <div class="rate-value" id="rate-${cat.key}">$0.0000</div>
                        <div class="rate-label">Rate</div>
                    </div>
                </div>
            `).join('');

            // Fetch live rates and user balance data
            fetchCategoryPageDataInit();
        }

        async function fetchCategoryPageDataInit() {
            try {
                // Fetch basic metrics for first category to get user balance and rates
                const res = await fetch(`${API_ENDPOINT}?action=get_page_data&tg_id=${tgId}&category=new_random`);
                const data = await res.json();
                if(data.success && data.settings) {
                    document.getElementById('userBalanceDisplay').innerText = `$${Number(data.settings.rate_usd || 0).toFixed(4)}`; // Placeholder or balance endpoint if available
                }
            } catch(e) {
                console.error(e);
            }
        }

        async function selectCategory(catKey) {
            currentCategory = catKey;
            document.getElementById('selectedCategory').value = catKey;
            
            // Switch views smoothly without closing miniapp
            document.getElementById('homeView').classList.remove('active');
            document.getElementById('formView').classList.add('active');
            document.getElementById('backBtn').style.display = 'flex';
            tg.BackButton.show();

            // Reset UI fields
            document.getElementById('categoryRules').style.display = 'none';
            document.getElementById('customTaskContainer').style.display = 'none';
            document.getElementById('groupOldDays').style.display = 'none';
            document.getElementById('groupUsedReason').style.display = 'none';
            document.getElementById('groupUsername').style.display = 'block';
            document.getElementById('groupPassword').style.display = 'block';
            document.getElementById('poolIdInput').value = '0';
            document.getElementById('gmailSubmitForm').reset();

            // Fetch specific category page rules, settings & history
            try {
                const res = await fetch(`${API_ENDPOINT}?action=get_page_data&tg_id=${tgId}&category=${catKey}`);
                const data = await res.json();
                
                if(data.success) {
                    if(data.settings.rules) {
                        const rulesBox = document.getElementById('categoryRules');
                        rulesBox.innerText = data.settings.rules;
                        rulesBox.style.display = 'block';
                    }

                    // Handle specific category layouts
                    if(catKey === 'new_custom_password') {
                        const passInput = document.getElementById('gmailPassword');
                        if(data.settings.fixed_password) {
                            passInput.value = data.settings.fixed_password;
                            passInput.readOnly = true;
                        }
                    } else if(catKey === 'new_custom_name') {
                        document.getElementById('groupUsername').style.display = 'none';
                        document.getElementById('groupPassword').style.display = 'none';
                        fetchCustomTask();
                    } else if(catKey === 'old_old') {
                        document.getElementById('groupOldDays').style.display = 'block';
                    } else if(catKey === 'used_used') {
                        document.getElementById('groupUsedReason').style.display = 'block';
                    }

                    renderHistory(data.history || []);
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchCustomTask() {
            try {
                const res = await fetch(`${API_ENDPOINT}?action=get_custom_name_task&tg_id=${tgId}`);
                const data = await res.json();
                if(data.success && data.task) {
                    document.getElementById('customTaskContainer').style.display = 'block';
                    document.getElementById('taskFullName').innerText = data.task.full_name;
                    document.getElementById('poolIdInput').value = data.task.id;
                    
                    // Show username and password fields back for filling
                    document.getElementById('groupUsername').style.display = 'block';
                    document.getElementById('groupPassword').style.display = 'block';
                    document.getElementById('gmailUsername').value = data.task.gmail_username || '';
                } else {
                    document.getElementById('customTaskContainer').style.display = 'block';
                    document.getElementById('taskFullName').innerText = data.message || 'No available tasks right now.';
                }
            } catch(e) {
                console.error(e);
            }
        }

        function goHome() {
            document.getElementById('formView').classList.remove('active');
            document.getElementById('homeView').classList.add('active');
            document.getElementById('backBtn').style.display = 'none';
            tg.BackButton.hide();
            currentCategory = '';
        }

        function renderHistory(history) {
            const list = document.getElementById('historyList');
            if(!history || history.length === 0) {
                list.innerHTML = '<div class="loading-spinner">No submissions found.</div>';
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <div style="font-weight:600;">${item.gmail_username}</div>
                        <div style="font-size:0.72rem; color:var(--text-muted);">${new Date(item.submitted_at).toLocaleDateString()}</div>
                    </div>
                    <div>
                        <span class="status-badge status-${String(item.status).toLowerCase()}">${item.status}</span>
                    </div>
                </div>
            `).join('');
        }

        async function handleGmailSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Submitting...';
            submitBtn.disabled = true;

            const formData = {
                action: 'submit_gmail',
                tg_id: tgId,
                category: currentCategory,
                gmail_username: document.getElementById('gmailUsername').value,
                gmail_password: document.getElementById('gmailPassword').value,
                pool_id: document.getElementById('poolIdInput').value,
                old_days: document.getElementById('oldDaysInput').value,
                used_reason: document.getElementById('usedReasonInput').value
            };

            try {
                const res = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await res.json();
                
                if(result.success) {
                    tg.showAlert('Gmail submitted successfully! Status is Pending.');
                    selectCategory(currentCategory); // Refresh view & history
                } else {
                    tg.showAlert(result.message || 'Submission failed.');
                }
            } catch (err) {
                tg.showAlert('Network error occurred.');
            } finally {
                submitBtn.innerText = 'Submit Gmail';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
                  </html>
