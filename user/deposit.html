<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds - AL-HUDA TASK</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #071321;
            --card-bg: #102136;
            --accent-color: #00d2ff;
            --text-color: #ffffff;
            --text-muted: #8a9ba8;
            --border-color: #1e3a5f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #071321;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .loading, .error-msg {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Deposit Balance</h2>
    </div>

    <div id="app-container">
        <div class="card">
            <div class="form-group">
                <label>Select Payment Gateway</label>
                <select id="gateway">
                    <option value="bKash">bKash (Personal)</option>
                    <option value="Nagad">Nagad (Personal)</option>
                    <option value="Rocket">Rocket</option>
                </select>
            </div>
            <div class="form-group">
                <label>Amount (USD / BDT)</label>
                <input type="number" id="amount" placeholder="Enter amount">
            </div>
            <div class="form-group">
                <label>Sender Account Number</label>
                <input type="text" id="sender_number" placeholder="e.g., 01XXXXXXXXX">
            </div>
            <div class="form-group">
                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trx_id" placeholder="Enter TrxID">
            </div>
            <button class="submit-btn" onclick="submitDeposit()">Submit Deposit</button>
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    let tgId = urlParams.get('tg_id') || (tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '');

    async function submitDeposit() {
        const gateway = document.getElementById('gateway').value;
        const amount = document.getElementById('amount').value;
        const senderNumber = document.getElementById('sender_number').value;
        const trxId = document.getElementById('trx_id').value;

        if (!amount || !senderNumber || !trxId) {
            alert('Please fill in all fields correctly!');
            return;
        }

        try {
            const response = await fetch('/api/action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'create_deposit',
                    tg_id: tgId,
                    gateway: gateway,
                    amount: amount,
                    sender_number: senderNumber,
                    trx_id: trxId
                })
            });

            const result = await response.json();
            if (result.success) {
                alert('Deposit request submitted successfully! Please wait for admin approval.');
                window.location.reload();
            } else {
                alert('Error: ' + (result.message || 'Failed to submit'));
            }
        } catch (err) {
            console.error('Error:', err);
            alert('Server connection error.');
        }
    }
</script>
</body>
</html>
