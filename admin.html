<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AL-HUDA TECH GLOBAL</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: radial-gradient(circle at top, #0f172a 0%, #070a12 100%); 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px;
            overflow-x: hidden;
        }
        
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: auto;
        }

        .brand-header {
            text-align: center;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #f43f5e;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        
        /* Admin Balance Card */
        .balance-card { 
            background: linear-gradient(135deg, #e11d48 0%, #be123c 50%, #0f172a 100%); 
            padding: 20px; 
            border-radius: 20px; 
            position: relative; 
            box-shadow: 0 12px 30px rgba(225, 29, 72, 0.25); 
            border: 1px solid rgba(244, 63, 94, 0.3);
        }
        
        .status-badge { 
            position: absolute; 
            top: 16px; 
            right: 16px; 
            background: rgba(255, 255, 255, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            color: #ffffff; 
            padding: 4px 10px; 
            border-radius: 30px; 
            font-size: 10px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            display: flex; 
            align-items: center; 
            gap: 6px; 
            text-transform: uppercase;
        }
        
        .status-dot { 
            width: 6px; 
            height: 6px; 
            background: #34d399; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #34d399; 
        }
        
        .balance-title { font-size: 11px; color: #ffe4e6; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .balance-amount { font-size: 28px; font-weight: 800; color: #ffffff; margin: 8px 0 4px 0; letter-spacing: -0.5px; }
        .balance-amount span { font-size: 14px; font-weight: 600; color: #fecdd3; }

        /* Information Card Container */
        .info-card { 
            background: #111827; 
            padding: 16px; 
            border-radius: 16px; 
            border: 1px solid #1f2937; 
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25); 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .label { color: #94a3b8; font-weight: 500; }
        .value { color: #f1f5f9; font-weight: 600; letter-spacing: 0.3px; }

        /* Referral Link Section */
        .ref-box-container { display: flex; gap: 8px; margin-top: 6px; }
        .ref-input { flex: 1; background: #070a12; border: 1px solid #334155; padding: 10px 12px; border-radius: 10px; font-size: 11px; color: #f43f5e; outline: none; font-family: monospace; }
        .copy-btn { background: #e11d48; color: white; border: none; padding: 0 16px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 12px; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .copy-btn:hover { background: #be123c; }

        /* Full Width Action Buttons */
        .btn-full { 
            width: 100%; 
            background: linear-gradient(135deg, #e11d48, #be123c); 
            color: white; 
            border: none; 
            padding: 13px; 
            border-radius: 14px; 
            font-weight: 600; 
            font-size: 13px; 
            cursor: pointer; 
            text-align: center; 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            box-shadow: 0 6px 15px rgba(225, 29, 72, 0.35); 
            transition: all 0.2s ease; 
        }
        .btn-full:hover { opacity: 0.95; transform: translateY(-1px); }

        .btn-secondary { background: #1f2937; color: #cbd5e1; border: 1px solid #374151; box-shadow: none; }
        .btn-secondary:hover { background: #374151; color: white; }

        .btn-accent { background: linear-gradient(135deg, #0284c7, #0369a1); box-shadow: 0 6px 15px rgba(2, 132, 199, 0.35); }

        /* Popup Modal Styles */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1e293b; width: 100%; max-width: 420px; padding: 20px; border-radius: 18px; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 14px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: 700; color: #f1f5f9; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }
        .form-group { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #94a3b8; }
        .form-input, .form-textarea { background: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 10px; color: #fff; font-size: 13px; outline: none; }
        .form-textarea { resize: vertical; min-height: 70px; }

        .app-footer { text-align: center; font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 500; }
        .loading, .error-msg { text-align: center; padding: 40px; color: #94a3b8; line-height: 1.6; font-size: 14px; }
        svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-wrapper" id="admin-app">
        <div class="loading">Verifying Administrator Privileges...</div>
    </div>

    <!-- Referral Management Popup Modal -->
    <div class="modal" id="refModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>⚙️ Referral System Settings</span>
                <button class="close-modal" onclick="toggleRefModal(false)">&times;</button>
            </div>
            <div class="form-group">
                <label>Commission Percentage (%)</label>
                <input type="number" id="modalRefPercentage" class="form-input" step="0.01" placeholder="5.00">
            </div>
            <div class="form-group">
                <label>Referral Notice / Description</label>
                <textarea id="modalRefNotice" class="form-textarea" placeholder="Enter referral system notice text..."></textarea>
            </div>
            <button class="btn-full" onclick="saveReferralSettings()">Save Changes</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        let tgId = urlParams.get('tg_id');

        if (!tgId && tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgId = tg.initDataUnsafe.user.id;
        }

        function maskTelegramId(id) {
            if (!id || id === 'None' || id === 'Direct') return 'Direct / None';
            const strId = String(id);
            if (strId.length <= 4) return strId;
            return strId.substring(0, 2) + '***' + strId.substring(strId.length - 2);
        }

        async function verifyAndLoadAdmin() {
            const container = document.getElementById('admin-app');

            if (!tgId) {
                container.innerHTML = `
                    <div class="error-msg">
                        <h3 style="color: #f43f5e; margin-bottom: 8px;">Access Denied</h3>
                        <p>Unauthorized access attempt detected. Secure session required.</p>
                    </div>
                `;
                return;
            }

            try {
                // মেইন ডিরেক্টরি থেকে বিদ্যমান get-user এপিআই ব্যবহার করে অ্যাডমিন ডেটা ফেচ করা হচ্ছে
                const response = await fetch(`/.netlify/functions/get-user?tg_id=${tgId}`);
                const data = await response.json();

                if (!response.ok || !data.success || data.user.role !== 'admin') {
                    container.innerHTML = `
                        <div class="error-msg" style="background: #111827; padding: 25px; border-radius: 16px; border: 1px solid #1f2937;">
                            <h3 style="color: #f43f5e; margin-bottom: 10px;">Restricted Area</h3>
                            <p style="color: #cbd5e1; font-size: 13px; margin-bottom: 15px;">You do not possess administrator privileges to access this secure command center.</p>
                            <a href="index.html?tg_id=${tgId}" class="btn-full" style="text-decoration:none;">Return to User Dashboard</a>
                        </div>
                    `;
                    return;
                }

                const admin = data.user;
                const maskedReferredBy = maskTelegramId(admin.referred_by);
                const referralLink = `https://t.me/ahtgearnbdbot?start=${admin.referral_code}`;

                // রেন্ডারিং ড্যাশবোর্ড
                container.innerHTML = `
                    <div class="brand-header">AL-HUDA TECH GLOBAL (ADMIN)</div>

                    <!-- Admin Balance Card -->
                    <div class="balance-card">
                        <div class="status-badge"><span class="status-dot"></span> Admin Active</div>
                        <div class="balance-title">Administrator Balance</div>
                        <div class="balance-amount">$${parseFloat(admin.balance || 0).toFixed(2)} <span>USDT</span></div>
                    </div>

                    <!-- Admin Info Card -->
                    <div class="info-card">
                        <div class="info-row"><span class="label">Admin Name</span><span class="value">${admin.first_name || 'Admin'}</span></div>
                        <div class="info-row"><span class="label">Telegram ID</span><span class="value">${admin.telegram_id}</span></div>
                        <div class="info-row"><span class="label">Referred By</span><span class="value">${maskedReferredBy}</span></div>
                        <div class="info-row"><span class="label">Total Referrals</span><span class="value">${admin.referrals || 0} Users</span></div>
                        <div class="info-row"><span class="label">Authorization</span><span class="value" style="color: #f43f5e;">SECURE ADMIN</span></div>
                    </div>

                    <!-- Referral Link Section -->
                    <div class="info-card">
                        <div>
                            <div style="font-size: 13px; font-weight: 600; color: #f1f5f9; margin-bottom: 3px;">Admin Referral Link</div>
                            <div style="font-size: 11px; color: #94a3b8; line-height: 1.4;">Share your link to invite partners securely.</div>
                        </div>
                        <div class="ref-box-container">
                            <input type="text" class="ref-input" id="refLinkInput" value="${referralLink}" readonly>
                            <button class="copy-btn" onclick="copyRefLink()">Copy</button>
                        </div>
                    </div>

                    <!-- Referral Management Button (Triggers Popup Modal) -->
                    <button class="btn-full btn-accent" onclick="toggleRefModal(true)">
                        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                        Referral System Control
                    </button>

                    <!-- Go to Settings Button (Correctly linked inside the admin folder) -->
                    <a href="admin/settings.html?tg_id=${tgId}" class="btn-full">
                        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c-.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        Go to Settings
                    </a>

                    <!-- Switch to User View Button (Points to root index.html) -->
                    <a href="index.html?tg_id=${tgId}" class="btn-full btn-secondary">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Switch to User Dashboard
                    </a>

                    <div class="app-footer">&copy; 2026 AL-HUDA TECH GLOBAL. Secure Admin Portal.</div>
                `;

            } catch (error) {
                console.error('Admin verification error:', error);
                container.innerHTML = `<div class="error-msg"><h3 style="color: #f43f5e;">Connection Error</h3><p>Failed to verify administrative credentials securely.</p></div>`;
            }
        }

        function toggleRefModal(show) {
            document.getElementById('refModal').style.display = show ? 'flex' : 'none';
        }

        async function saveReferralSettings() {
            const percentage = document.getElementById('modalRefPercentage').value;
            const notice = document.getElementById('modalRefNotice').value;

            try {
                const res = await fetch('/.netlify/functions/update-referral-settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tg_id: tgId, referral_percentage: percentage, referral_notice: notice })
                });
                const result = await res.json();
                if (result.success) {
                    alert('Referral settings updated successfully!');
                    toggleRefModal(false);
                } else {
                    alert('Failed to update: ' + (result.message || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('Server error while saving settings.');
            }
        }

        function copyRefLink() {
            const input = document.getElementById('refLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            alert('Admin referral link copied successfully!');
        }

        verifyAndLoadAdmin();
    </script>
</body>
</html>
